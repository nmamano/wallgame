<!doctype html>
<!--
  The video stage for scripts/game-video/render-game-video.mjs.

  This page is a CANVAS FOR COMPOSITION, not a second renderer. It never draws a
  board, a pawn or a wall: every one of those arrives as a PNG that real Chrome
  screenshotted off the real replay page, so there is no artwork here that could
  disagree with the product. What this file owns is the parts the product has no
  opinion about - the aspect ratio, the VS screen, the name plates and the end
  card.

  The renderer sets window.__stage(state) and screenshots the viewport.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "StageSans";
        src: local("DejaVu Sans");
      }
      :root {
        --ink: #f8fafc;
        --dim: #94a3b8;
        --bg: #0b0f1c;
        --panel: #121a2e;
        /* The call to action's pill: the GG card's and the strip's, and
           the GG card's shine, which lays its band over this fill. */
        --cta-fill: linear-gradient(180deg, #ffb24d, #ff7a1a);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        font-family: "Segoe UI", "DejaVu Sans", system-ui, sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 50% 34%,
            rgba(56, 78, 140, 0.32),
            transparent 62%
          ),
          var(--bg);
      }

      /* ---------- shared ---------- */
      .hidden {
        display: none !important;
      }

      /* ---------- the VS screen ---------- */
      /*
        Both of Nil's references share one structure: two skewed banners offset
        top-left and bottom-right, a portrait in each, and a heavy VS at the
        centre crossing the split. That is what these rules build. The skew is
        the diagonal split; the banners overshoot the frame on purpose so the
        cut edges are never visible.
      */
      #vs {
        position: absolute;
        inset: 0;
        /* Over the board when it plays as an overlay. */
        z-index: 2;
      }
      .beam {
        position: absolute;
        left: -12%;
        width: 124%;
        height: var(--beam-h);
        transform: skewY(-7deg);
        overflow: hidden;
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
      }
      #vs .beam.top {
        top: var(--beam-top);
      }
      #vs .beam.bottom {
        top: var(--beam-bottom);
      }
      /*
        The contents are un-skewed so faces and text stay upright while the
        banner tilts. The padding is measured from the beam's own overshoot
        (it starts at -12% and runs 124% wide), so a portrait sits inside the
        visible frame rather than off the edge of it.
      */
      .beam .inner {
        position: absolute;
        inset: 0;
        transform: skewY(7deg);
        display: flex;
        align-items: center;
        gap: 4%;
        padding: 0 16%;
      }
      #vs .beam.bottom .inner {
        flex-direction: row-reverse;
      }
      .beam .portrait {
        width: var(--portrait);
        height: var(--portrait);
        flex: none;
        object-fit: contain;
        filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.55));
      }
      .beam .who {
        min-width: 0;
      }
      .beam .name {
        font-size: var(--name-size);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.02;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #vs .beam.bottom .who {
        text-align: right;
      }
      /*
        The daily overlay names no player: it says which side is the bot and
        which the human (dailySeatNames), each word IN its side's colour (Nil,
        2026-10-26: "AI (in Red) vs Human (in Blue)"; 2026-10-29: Bot), so the viewer links each word to its
        pieces. A light banner keeps both colours readable.
      */
      #vs .beam.word {
        background: linear-gradient(
          100deg,
          #ffffff 0%,
          #f1f5f9 62%,
          rgba(241, 245, 249, 0.88) 100%
        ) !important;
      }
      #vs .beam.word .name {
        font-size: calc(var(--name-size) * 1.4);
        text-shadow: 0 3px 0 rgba(15, 23, 42, 0.18);
      }
      .beam .sub {
        font-size: var(--sub-size);
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        opacity: 0.82;
        margin-top: 0.35em;
      }
      #vs .vsmark {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) scale(var(--vs-scale));
        font-size: var(--vs-size);
        font-weight: 900;
        font-style: italic;
        letter-spacing: -0.04em;
        color: #fff;
        text-shadow:
          0 0 0 #000,
          6px 6px 0 #0b0f1c,
          0 0 42px rgba(255, 214, 102, 0.85);
        -webkit-text-stroke: calc(var(--vs-size) * 0.055) #10182c;
        paint-order: stroke fill;
      }
      #vs .vsmark span {
        color: #ffd166;
      }

      /* ---------- the board segment ---------- */
      /*
        The bands above and below the board are not slack - the plates live in
        them, and the lower one also keeps the board clear of the caption and
        button furniture that TikTok and Shorts paint over the bottom of every
        video. What IS slack is anything past the plates, so the block is
        pushed up by the reserved chrome band rather than centred in the whole
        frame, and the plates are tall enough to carry the space they occupy.
      */
      #play {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--gap);
        padding-bottom: var(--chrome);
      }
      #play .plate {
        width: var(--board);
        display: flex;
        align-items: center;
        gap: 2.4%;
        padding: var(--plate-pad);
        border-radius: 26px;
        background: rgba(18, 26, 46, 0.9);
        border: 2px solid rgba(148, 163, 184, 0.16);
      }
      #play .plate.bottom {
        flex-direction: row;
      }
      #play .plate .avatar {
        width: var(--avatar);
        height: var(--avatar);
        flex: none;
        object-fit: contain;
      }
      #play .plate .nm {
        font-size: var(--plate-name);
        font-weight: 800;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
        flex: 1;
      }
      #play .plate .tag {
        font-size: var(--plate-tag);
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 0.42em 0.85em;
        border-radius: 999px;
        flex: none;
      }
      #boardWrap {
        width: var(--board);
        height: var(--board);
        border-radius: 26px;
        overflow: hidden;
        border: 2px solid rgba(148, 163, 184, 0.16);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      }
      #boardImg {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: fill;
      }
      /*
        A flashback (render-game-video.mjs playFlashback, Nil's C39): the
        board turns sepia (on the board's image only, so the walls that
        land again keep their colour over it) under a VHS look, scan lines
        and a rolling band, with its stamp top left.
      */
      #vhsFx {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.05) 0 2px,
          rgba(0, 0, 0, 0.2) 2px 5px
        );
      }
      #vhsBand {
        position: absolute;
        left: 0;
        right: 0;
        height: 7%;
        background: rgba(255, 255, 255, 0.12);
        filter: blur(4px);
      }
      #vhsLabel {
        position: absolute;
        left: 4%;
        top: 3%;
        font-family: "DejaVu Sans Mono", monospace;
        font-weight: 700;
        font-size: calc(var(--board) * 0.075);
        letter-spacing: 0.06em;
        color: #fff;
        text-shadow:
          0.05em 0 rgba(255, 0, 80, 0.7),
          -0.05em 0 rgba(0, 200, 255, 0.7),
          0 0 0.3em rgba(0, 0, 0, 0.9);
      }
      /*
        The camera. The board screenshot rides on it, and so does the position
        before the last move during the instant replay. #boardWrap clips it, so a zoom stays
        inside the board's square and never covers the caption.
      */
      #boardCam {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #boardWrap {
        position: relative;
      }
      /* The position before the last move, for the instant replay's dissolve. */
      #boardPrev {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
      }

      /* ---------- the close-call beat (daily look) ---------- */
      /*
        Nil, 2026-10-26: the mouse looks scared when the cat gets close, and
        laughs once a wall has saved it. The pawn that trembles or bounces is
        a CROP OF THE REAL SCREENSHOT, cut to the mouse's cell and moved over
        it; the pawn art is never redrawn. It rides on the camera.
      */
      #pawnFx {
        position: absolute;
      }
      /*
        The crop moves only inside its cell: the walls in the grooves around
        it stay the real board's, still and whole (Wall Game Director,
        2026-10-29: the shaking mouse hid the cage's walls next to it).
      */
      /*
        Square, as the page's cells are (measured on the VX-IPenv capture,
        2026-10-29: the corner radius is under 3% of a cell). What it holds
        is the real cell, corners included, so it matches any theme.
      */
      #pawnWin {
        position: absolute;
        overflow: hidden;
      }
      #pawnCrop {
        position: absolute;
        inset: 0;
        background-repeat: no-repeat;
      }
      /*
        The capture picture: the catcher landing on the caught pawn, both
        bigger than the page's two small pawns on one cell, which a square
        of the cell's own colour covers. It rides on the camera.
      */
      #captureFx,
      #captureFx > * {
        position: absolute;
      }
      #captureFx {
        inset: 0;
        pointer-events: none;
      }
      #pawnSweat {
        position: absolute;
        font-family: "Noto Color Emoji", sans-serif;
        line-height: 1;
      }
      #pawnBubble {
        position: absolute;
        left: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #fff;
        border: 0.06em solid #10182c;
        box-shadow: 0 0.08em 0 #10182c;
        color: #10182c;
        font-family:
          "TikTok Sans", "Noto Color Emoji", "DejaVu Sans", sans-serif;
        font-weight: 900;
        line-height: 1;
        white-space: nowrap;
      }

      /* ---------- the moment effects (daily look) ---------- */
      /*
        Nil, 2026-10-26: "more meme effects and animations, to be used
        contextually by the director". Each one is a layer over the real
        screenshot, nothing of the game is redrawn, and each stays inside the
        board's square (#boardWrap clips it), so no effect reaches the parts
        of a 9:16 frame that TikTok and Shorts paint over.
      */
      #cellFx {
        position: absolute;
      }
      #cellRing {
        position: absolute;
        inset: -6%;
        border-radius: 24%;
        border-style: solid;
      }
      #cellBurst {
        position: absolute;
        left: -150%;
        top: -150%;
        width: 400%;
        height: 400%;
        overflow: visible;
      }
      #cellBadge {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        border: 0.06em solid #10182c;
        box-shadow: 0 0.08em 0 #10182c;
        color: #fff;
        font-family: "TikTok Sans", "DejaVu Sans", sans-serif;
        font-weight: 900;
        font-style: italic;
        letter-spacing: -0.04em;
        line-height: 1;
        white-space: nowrap;
      }
      .resignFlag {
        position: absolute;
        overflow: visible;
      }
      #cellEmoji {
        position: absolute;
        left: 50%;
        top: 50%;
        font-family: "Noto Color Emoji", sans-serif;
        line-height: 1;
      }
      #fxFlash {
        position: absolute;
        inset: 0;
        background: #ef4444;
      }
      #eraseFx,
      #eraseFx img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
      }
      #trapSvg,
      #pathSvg,
      #namesSvg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #freezeBadge {
        position: absolute;
        right: 4%;
        top: 4%;
        display: flex;
        gap: 0.22em;
        padding: 0.32em 0.42em;
        border-radius: 0.3em;
        background: rgba(18, 26, 46, 0.9);
        font-size: calc(var(--board) * 0.07);
      }
      #freezeBadge div {
        width: 0.26em;
        height: 0.9em;
        border-radius: 0.06em;
        background: #fff;
      }
      /*
        The head of the daily look, between the caption and the board: the
        race counter (each side's steps to its target, all video long), and
        in the same place, through the opening, the variant's goal in
        one line (Wall Game PM, 2026-10-26, audit item 1). Both sit in one
        grid cell, so the row is as tall as the taller of the two and the
        board never moves when one gives way to the other. Above the board,
        not over it: the encode check reads only the board's square.
      */
      #hud {
        display: none;
      }
      #root.wallz #hud.on {
        display: grid;
        place-items: center;
        width: min(100%, var(--text-w));
        align-self: center;
      }
      #hud > * {
        grid-area: 1 / 1;
      }
      /*
        The evaluation strip (edl.mjs evalStrip): the site's evaluation bar
        (info/evaluation_bar.md), thin, over the call to action under the
        board and as wide as its badge: red's share on the left, blue's on
        the right, in their colours (Nil, 2026-11-05, C58: the players'
        names under the board went). A clear gap on both sides (Nil,
        2026-10-31, the revise of v-2026-10-31-11: "that whole part is too
        crowded"); a thin line marks the even split.
      */
      #evalStrip {
        position: relative;
        width: 100%;
        height: 12px;
        margin-bottom: 0.7em;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
      }
      #evalLeft,
      #evalSwing,
      #evalMid {
        position: absolute;
        top: 0;
        bottom: 0;
      }
      #evalLeft {
        left: 0;
      }
      #evalSwing {
        background: #fff;
      }
      #evalMid {
        left: calc(50% - 1px);
        width: 2px;
        background: rgba(255, 255, 255, 0.55);
      }
      #race {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.6em;
        font-family: "TikTok Sans", "DejaVu Sans", sans-serif;
        font-weight: 900;
        font-size: var(--caption-size);
      }
      #race .side {
        display: flex;
        align-items: baseline;
        gap: 0.3em;
      }
      #race .n {
        display: inline-block;
        min-width: 1.2em;
        text-align: center;
        font-size: 1.05em;
        line-height: 1;
        -webkit-text-stroke: 0.04em #000;
        paint-order: stroke fill;
      }
      #race .w {
        font-size: 0.5em;
        letter-spacing: 0.08em;
      }
      #race .vs {
        font-size: 0.5em;
        color: #e2e8f0;
        letter-spacing: 0.08em;
        text-align: center;
        line-height: 1.1;
      }
      /*
        In a fast-forward the middle shows a badge, "▶▶ x3", in place of its
        words (Nil, 2026-10-31, the revise of v-2026-10-31-9: "the >> x3 is
        too small and not well placed"). Both sit in one grid cell, so the
        middle is as wide as the wider of the two all video long (the badge
        is laid out only in a video with a fast-forward), and the counters
        and the board never move.
      */
      #race .vs {
        display: grid;
        place-items: center;
      }
      #race .vs > * {
        grid-area: 1 / 1;
      }
      #raceFast {
        display: none;
        visibility: hidden;
        font-size: 1.7em;
        line-height: 1;
        padding: 0.14em 0.5em;
        border-radius: 999px;
        background: #fde047;
        color: #0b0f1c;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      /* Nil, 2026-11-05, C58: "the small vs can go". */
      #root.wallz #raceTag {
        display: none;
      }
      /* The same size as the side words, so it reads at phone size. */
      #race .vs small {
        display: block;
        font-size: 1em;
        color: #cbd5e1;
        letter-spacing: 0.12em;
      }
      #goal {
        max-width: 100%;
        padding: 0.3em 0.8em;
        border-radius: 999px;
        background: rgba(18, 26, 46, 0.92);
        border: 2px solid rgba(148, 163, 184, 0.25);
        color: #f8fafc;
        font-family: "TikTok Sans", "DejaVu Sans", sans-serif;
        font-weight: 800;
        font-size: var(--goal-size, calc(var(--caption-size) * 0.62));
        text-align: center;
        /* Its height at full size, so a smaller line keeps the head row's. */
        min-height: var(--goal-h, 0px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /*
        The credit (music-tracks.mjs creditLines): over the ending and its
        hold, a small muted line in a corner of the end card, about the
        size of the board's letters (Nil, 2026-10-31, the revise of
        v-2026-10-31-6: "JDSherbert credits are too prominent. they should
        be in the corner"): in the GG card's bottom-right padding, or, in an
        ending with no card, the board's bottom-left corner (__fitWallz puts
        it there), as the edge-to-edge board's right edge is under the apps'
        buttons (C58). One line per track, broken only where the lines end. The
        board's filters do not reach it: it is not the board image.
      */
      #credit {
        position: absolute;
        left: calc(var(--board) * 0.025);
        bottom: calc(var(--board) * 0.012);
        max-width: calc(var(--board) * 0.7);
        z-index: 5;
        white-space: pre;
        font-family: "TikTok Sans", "DejaVu Sans", sans-serif;
        font-weight: 700;
        font-size: calc(var(--board) * 0.026);
        line-height: 1.2;
        color: #94a3b8;
        text-align: left;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        visibility: hidden;
      }
      #ggCard #credit {
        left: auto;
        right: 5%;
        text-align: right;
        max-width: 80%;
      }
      #ggCard.credited {
        padding-bottom: calc(var(--board) * 0.075);
      }

      /* ---------- the endings (wallz look) ---------- */
      /*
        Three endings of our own, each a layer over the frozen final
        screenshot: nothing of the game is redrawn. Their lettering is the VS
        mark's, their panels are the replay page's plates, their pawns and
        colours are the players' own.
      */
      .stampmark {
        font-weight: 900;
        font-style: italic;
        letter-spacing: -0.03em;
        color: #fff;
        text-shadow:
          6px 6px 0 #0b0f1c,
          0 0 42px rgba(255, 214, 102, 0.85);
        -webkit-text-stroke: 0.055em #10182c;
        paint-order: stroke fill;
        white-space: nowrap;
      }
      #stamp,
      #midStamp {
        position: absolute;
        left: 50%;
        top: 50%;
        font-size: calc(var(--board) * 0.14);
      }
      #replayBadge {
        position: absolute;
        left: 4%;
        top: 4%;
        display: flex;
        align-items: center;
        gap: 0.5em;
        padding: 0.4em 0.9em;
        border-radius: 999px;
        background: rgba(18, 26, 46, 0.9);
        border: 2px solid rgba(148, 163, 184, 0.16);
        font-size: calc(var(--board) * 0.04);
        font-weight: 800;
        letter-spacing: 0.18em;
      }
      #replayBadge .dot {
        width: 0.7em;
        height: 0.7em;
        border-radius: 50%;
        background: #ef4444;
      }
      /*
        An EDL overlay (overlays.mjs): over the board, not on the camera, so
        a zoom does not move it; the badges and stamps paint over it. The
        renderer gives its box in the board (0..1) once it has placed it.
        #frameBar is the ending's bar in the caption's place, over the frame
        (overlays.mjs overlayPlaces): #boardWrap clips #overlay.
      */
      #overlay,
      #frameBar {
        position: absolute;
        display: flex;
        box-sizing: border-box;
        font-family: "TikTok Sans", "DejaVu Sans", sans-serif;
        transform-origin: 50% 50%;
      }
      #overlay.toast {
        align-items: center;
        gap: 0.6em;
        padding: 0 1em;
        border-radius: 0.6em;
        background: rgba(15, 20, 36, 0.94);
        border: 2px solid rgba(148, 163, 184, 0.3);
        box-shadow: 0 0.3em 1.2em rgba(0, 0, 0, 0.5);
        color: #fde68a;
        font-size: calc(var(--board) * 0.052);
        font-weight: 700;
        white-space: nowrap;
      }
      #overlay.toast .dot {
        flex: none;
        width: 0.7em;
        height: 0.7em;
        border-radius: 50%;
        background: #facc15;
      }
      #overlay.reactor {
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        font-size: calc(var(--board) * 0.046);
        font-weight: 900;
        color: #fff;
        text-align: center;
        text-shadow:
          -2px -2px 0 #000,
          2px -2px 0 #000,
          -2px 2px 0 #000,
          2px 2px 0 #000,
          0 0 0.3em #000;
      }
      /* The face takes the room the label leaves; its image adds no size of
         its own (absolute), so the box never overflows. */
      #overlay.reactor .face {
        position: relative;
        flex: 1 1 0;
        min-height: 0;
        width: 100%;
        /* A punch-in grows up and out, never down over the label. */
        transform-origin: 50% 100%;
      }
      #overlay.reactor .face img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 0.15em 0.4em rgba(0, 0, 0, 0.7));
      }
      #overlay.reactor .emo {
        position: absolute;
        right: 4%;
        top: 0;
        font-family: "Noto Color Emoji", sans-serif;
        font-size: 1.6em;
        text-shadow: none;
      }
      /* One line on a dark pill, as the chat toast (Wall Game Director,
         2026-10-28: white text over the portrait did not read). */
      #overlay.reactor .label {
        flex: none;
        max-width: 100%;
        box-sizing: border-box;
        margin-top: 0.15em;
        padding: 0.05em 0.55em;
        border-radius: 0.5em;
        background: rgba(15, 20, 36, 0.94);
        border: 2px solid rgba(148, 163, 184, 0.3);
        white-space: nowrap;
        text-shadow: none;
        font-weight: 800;
        /* Not under 1.25: a glyph taller than its line counts as overflow,
           and the fit would shrink the label to nothing (measured). */
        line-height: 1.25;
      }
      /* A clip with alpha (a cut-out): the frame fills its box, kept whole,
         and stands on the board's edge in its corner (paintOverlay sets
         object-position from the place). */
      #overlay.sequence img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 0.15em 0.4em rgba(0, 0, 0, 0.6));
      }
      /* A cover clip (overlays.mjs form "cover") fills the whole board, its
         overflow cut equally on both sides (overlay-clips.mjs boardToCover
         measures what it hides in the same frame): no shadow, no pop. */
      #overlay.sequence.cover img {
        object-fit: cover;
        object-position: center;
        filter: none;
      }
      /* The ending's caption: black on a white bar, the model video's last
         beat. One line, fitted. */
      #overlay.whitebar,
      #frameBar.whitebar {
        /* Over the gg crack (Wall Game Director, 2026-10-28: the crack is
           the board's; the caption is a layer on top). Its place avoids the
           ending's card, banner, pawn, badge and stamp, so it covers none. */
        z-index: 1;
        align-items: center;
        justify-content: center;
        padding: 0 3%;
        background: #fff;
        color: #000;
        box-shadow: 0 0.2em 0.8em rgba(0, 0, 0, 0.5);
        font-size: calc(var(--board) * 0.055);
        font-weight: 800;
        white-space: nowrap;
        line-height: 1.25;
      }
      /*
        Visual memes (overlays.mjs "card" and "image", visual-memes.md):
        known memes' cards in our own art, and still pictures. In the board,
        the left margin or the caption's place (#frameBar), so in em of the
        board's size: the stage scales the font with a smaller place.
      */
      #overlay.card,
      #frameBar.card {
        z-index: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        white-space: nowrap;
        line-height: 1.1;
        /* A card below may set its own size: same weight, later rule. */
        font-size: calc(var(--board) * 0.1);
      }
      :is(#overlay, #frameBar).wasted,
      :is(#overlay, #frameBar).you-died {
        background: linear-gradient(
          transparent,
          rgba(0, 0, 0, 0.82) 22%,
          rgba(0, 0, 0, 0.82) 78%,
          transparent
        );
      }
      :is(#overlay, #frameBar).wasted {
        color: #d42a2a;
        font-size: calc(var(--board) * 0.15);
        font-weight: 900;
        font-style: italic;
        letter-spacing: 0.02em;
        -webkit-text-stroke: 0.05em #000;
        paint-order: stroke fill;
      }
      :is(#overlay, #frameBar).you-died {
        color: #a3161a;
        font-family: "DejaVu Serif", serif;
        font-size: calc(var(--board) * 0.11);
        letter-spacing: 0.14em;
      }
      /*
        The time card: Grandstander Black (OFL, Tyler Finck / ETC, from
        github.com/google/fonts ofl/grandstander; installed on the render box
        like TikTok Sans, sync-render-kit.sh checks it), the closest free
        face to SpongeBob's time-card letters; never the show's own font.
        The colours are the card's own (Director, 2026-11-01: ours read as
        one more caption): navy letters on a warm sand box, with a flat
        tiki-plank grain.
      */
      :is(#overlay, #frameBar).eternity-later {
        border-radius: 0.3em;
        background:
          repeating-linear-gradient(
            90deg,
            transparent 0 1.6em,
            rgba(122, 62, 20, 0.16) 1.6em 1.72em
          ),
          linear-gradient(#f6c46e, #e89a4c);
        border: 0.06em solid #7a3e14;
        box-shadow: 0 0.1em 0.4em rgba(0, 0, 0, 0.6);
        color: #1c2b6e;
        font-family: "Grandstander", "TikTok Sans", sans-serif;
        font-size: calc(var(--board) * 0.08);
        font-weight: 900;
      }
      :is(#overlay, #frameBar).mission-passed {
        border-radius: 0.2em;
        background: rgba(0, 0, 0, 0.6);
        font-weight: 900;
        -webkit-text-stroke: 0.08em #000;
        paint-order: stroke fill;
      }
      .card.mission-passed .big {
        color: #e8a92a;
        font-size: 0.9em;
      }
      .card.mission-passed .small {
        color: #fff;
        font-size: 0.5em;
      }
      :is(#overlay, #frameBar).directed-by {
        background: rgba(0, 0, 0, 0.94);
        color: #fff;
        font-family: "DejaVu Serif", serif;
        font-size: calc(var(--board) * 0.075);
        gap: 0.15em;
      }
      .card.directed-by .small {
        font-size: 0.55em;
      }
      /*
        The resign card (C42): our own white flag over the loser's line, in
        the look of our captions.
      */
      .card.resign-flag svg {
        filter: drop-shadow(0 0.1em 0.3em rgba(0, 0, 0, 0.7));
      }
      .card.uno-reverse svg,
      .image .pic {
        flex: none;
        filter: drop-shadow(0 0.1em 0.3em rgba(0, 0, 0, 0.7));
      }
      #overlay.image,
      #frameBar.image {
        z-index: 1;
      }
      .image .pic {
        box-sizing: border-box;
        border: 0.08em solid #fff;
        border-radius: 0.12em;
        background-repeat: no-repeat;
        font-size: calc(var(--board) * 0.05);
      }
      /* A cut-out in its own outline (overlays.mjs image.outline): no frame;
         its ring, in the seat's colour, is its wrapper's filter. */
      .image .ring {
        flex: none;
      }
      .image .ring .pic {
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 0;
        filter: none;
      }
      /* A tail from a picture to the pawn that emotes it (overlays.mjs
         placeNear): under the picture, over the board. */
      #overlayTail {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        overflow: visible;
      }
      #overlay.redraw {
        z-index: 1;
      }
      #overlay.redraw svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #overlay.loading {
        flex-direction: column;
        justify-content: center;
        gap: 0.5em;
        padding: 0 7%;
        border-radius: 0.5em;
        background: rgba(10, 12, 20, 0.95);
        border: 3px solid #e2e8f0;
        color: #f8fafc;
        font-size: calc(var(--board) * 0.068);
        font-weight: 900;
        letter-spacing: 0.06em;
      }
      #overlay.loading .bar {
        height: 1.2em;
        border: 3px solid #f8fafc;
        padding: 3px;
      }
      #overlay.loading .fill {
        height: 100%;
      }
      #overlay.loading.error {
        color: #ef4444;
        border-color: #ef4444;
      }
      /* The compare cut-out: "2 -> 12" big in the side's colour, outlined,
         and one small line under it, no box (Nil, 2026-10-28: a cut-out
         is "better than the cards because it's like a cutout, not a huge
         rectangle covering the board"). */
      #overlay.compare {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: calc(var(--board) * 0.06);
        font-weight: 900;
        line-height: 1.1;
        -webkit-text-stroke: 0.1em #000;
        paint-order: stroke fill;
        filter: drop-shadow(0 0.1em 0.3em rgba(0, 0, 0, 0.7));
      }
      #overlay.compare .nums {
        display: flex;
        align-items: center;
        gap: 0.2em;
        font-size: 2.6em;
        line-height: 1;
        white-space: nowrap;
        -webkit-text-stroke: 0.06em #000;
      }
      #overlay.compare .arrow {
        font-family: "DejaVu Sans", sans-serif;
        font-size: 0.6em;
      }
      #overlay.compare .label {
        font-size: 0.75em;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }
      #crack {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
      }
      #ggCard {
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(var(--board) * 0.8);
        display: flex;
        flex-direction: column;
        align-items: center;
        /* Compact, so the call to action's badge (below) adds no height
           that pushes the ending's bar off the board (2026-10-31). */
        gap: calc(var(--board) * 0.012);
        padding: calc(var(--board) * 0.035) calc(var(--board) * 0.04);
        border-radius: 26px;
        background: rgba(18, 26, 46, 0.94);
        border: 2px solid rgba(148, 163, 184, 0.16);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      }
      #ggCard .gg {
        font-size: calc(var(--board) * 0.16);
        line-height: 1;
      }
      #ggCard .gg span {
        color: #ffd166;
      }
      /*
        The full card width, not its content's: a row that sizes itself to its
        content measured the name before it shrank and left it 540 px of an
        834 px card, so the name was cut (2026-10-26).
      */
      #ggCard .who {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4%;
        width: 100%;
      }
      #ggCard img {
        width: calc(var(--board) * 0.14);
        height: calc(var(--board) * 0.14);
        flex: none;
        object-fit: contain;
      }
      #ggCard .n {
        font-size: calc(var(--board) * 0.065);
        font-weight: 900;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      /* How the game was won: on a resignation it is the payoff, so it
         reads on a phone (Wall Game Director, 2026-10-30: at 0.032 it was
         too small on v-2026-10-30-8). */
      #ggCard .how {
        font-size: calc(var(--board) * 0.05);
        font-weight: 800;
        color: #cbd5e1;
        letter-spacing: 0.02em;
      }
      /*
        The call to action as the strip's badge, bigger, and it pops as the
        card lands (Nil, 2026-10-31: "make it pop at the end"; its scale and
        glow are set per frame in the gg ending). A call to action too long
        for one line at this size takes two balanced lines, not a smaller
        size: on one line it shrank to the old size (measured, 2026-10-31).
      */
      #ggCard .cta {
        margin-top: 1%;
        /* 97%, not 100%: its breath swells it by CTA_BREATH (1.08), and
           at that size it must stay 2% inside the card's sides (VR1
           review 123 N1; the card's padding is 0.04 of 0.8 board). */
        max-width: 97%;
        box-sizing: border-box;
        text-align: center;
        text-wrap: balance;
        line-height: 1.15;
        padding: 0.22em 0.8em;
        border-radius: 0.7em;
        background: var(--cta-fill);
        color: #0b0f1c;
        font-size: calc(var(--board) * 0.045);
        font-weight: 900;
        letter-spacing: 0.04em;
        box-shadow: 0 0 calc(var(--board) * 0.03) rgba(255, 140, 66, 0.5);
      }

      #koPawn {
        position: absolute;
        left: 0;
        top: 0;
        object-fit: contain;
        filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.6));
      }
      #koBanner {
        top: calc(50% + var(--board) * 0.12);
        height: calc(var(--board) * 0.3);
      }

      /* ---------- the WallzGame look (style "wallz") ---------- */
      /*
        Nil's reference Short (2026-10-25): black frame, one meme caption over
        the board for the whole video, the board as wide as the frame, nothing
        else. Same tree as the default look: the plates are hidden and the
        caption shown, so nothing is drawn twice.
      */
      #play .caption {
        display: none;
      }
      /*
        The daily frame has no flat black band (Instagram shows reels with
        borders less, Wall Game PM audit item 8): the board theme's navy,
        lit behind the board.
      */
      #root.wallz {
        background:
          radial-gradient(
            ellipse at 50% 38%,
            rgba(56, 78, 140, 0.45),
            transparent 70%
          ),
          linear-gradient(#141c33, #0b0f1c);
      }
      /*
        The look of Nil, 2026-11-05 (C58: "the edge to edge board is
        gorgeous"): caption, then the head row, then the board as wide as
        the frame less --look-side on each side (room for the shakes), stacked
        up from the strip on the floor (--look-bottom, from __fitWallz), and
        never above --look-top. The renderer sizes the board to what is left
        (window.__fitWallz). LOOK in edl.mjs holds the numbers.
      */
      #root.wallz #play {
        justify-content: flex-end;
        gap: var(--head-gap);
        padding: var(--look-top) var(--look-side) var(--look-bottom, 0px);
      }
      #root.wallz #ggCard {
        top: var(--board-mid);
      }
      #root.wallz #koBanner {
        top: calc(var(--board-mid) + var(--board) * 0.12);
      }
      #root.wallz #play .plate {
        display: none;
      }
      /*
        The caption keeps the height of the taller beat (--caption-h, from
        __fitWallz), its text at the bottom, next to the head row. It never
        shrinks: that min-height replaces the flex item's own floor (auto),
        and #play overflows while __fitWallz measures.
      */
      #root.wallz #play .caption {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-height: var(--caption-h, 0px);
        flex-shrink: 0;
        /* Text keeps clear of the buttons on the right (TEXT_AREA). */
        width: min(100%, var(--text-w));
        align-self: center;
        text-align: center;
        font-family:
          "TikTok Sans", "Noto Color Emoji", "DejaVu Sans", sans-serif;
        font-size: var(--caption-size);
        font-weight: 700;
        line-height: 1.15;
        color: #fff;
      }
      #root.wallz #boardWrap {
        border: none;
        border-radius: 12px;
        box-shadow: none;
      }
      /*
        The strip under the board (Nil, 2026-11-05, C58): the evaluation bar
        and the call to action. It is out of the column's flow, so the board
        keeps its size; __fitWallz stands it on the floor (--strip-top) and
        fits its size to STRIP_AREA's width (--strip-size).
      */
      #strip {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: var(--strip-top);
        margin: 0 auto;
        width: fit-content;
        max-width: var(--strip-w);
        flex-direction: column;
        align-items: center;
        font-family: "TikTok Sans", "DejaVu Sans", sans-serif;
        font-size: var(--strip-size);
      }
      #root.wallz #strip.on {
        display: flex;
      }
      /*
        The call to action as a badge, so a phone reads it at a glance for
        the whole video (Nil, 2026-10-30: "url needs to be more visible").
        Nil, 2026-10-31: "can be bigger i think or more interesting colors":
        a bigger badge, the site's orange with a glow. __fitWallz holds the
        strip, badge included, to STRIP_AREA's width.
      */
      #strip .site {
        padding: 0.18em 0.85em;
        border-radius: 999px;
        background: var(--cta-fill);
        color: #0b0f1c;
        font-size: 1em;
        font-weight: 900;
        letter-spacing: 0.04em;
        box-shadow:
          0 0 0.7em rgba(255, 140, 66, 0.5),
          0 0.15em 0.6em rgba(0, 0, 0, 0.45);
      }

      /* ---------- persistent branding ---------- */
      /*
        Quiet during play, loud only on the end card. A feed watermark that
        fights the board costs more attention than it earns.
      */
      #brand {
        position: absolute;
        left: 0;
        right: 0;
        bottom: var(--brand-bottom);
        text-align: center;
        font-size: var(--brand-size);
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: lowercase;
        /*
          Readable at 1x on a phone-sized timeline, which is the only size
          anyone watches at. It was rgba(...,0.42) on the principle that a
          watermark must not fight the board; that principle still holds, but
          0.42 crossed from quiet into invisible.
        */
        color: rgba(226, 232, 240, 0.72);
      }

      /* ---------- the end card ---------- */
      #end {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--gap);
        background:
          radial-gradient(
            circle at 50% 42%,
            rgba(56, 78, 140, 0.4),
            transparent 62%
          ),
          var(--bg);
      }
      #end .crown {
        font-size: var(--end-kicker);
        font-weight: 800;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #ffd166;
      }
      #end .winner {
        display: flex;
        align-items: center;
        gap: 3%;
      }
      #end .winner img {
        width: var(--end-avatar);
        height: var(--end-avatar);
        object-fit: contain;
      }
      #end .winner .n {
        font-size: var(--end-name);
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      #end .how {
        font-size: var(--end-how);
        font-weight: 700;
        color: var(--dim);
        letter-spacing: 0.04em;
      }
      #end .cta {
        margin-top: 4%;
        font-size: var(--end-cta);
        font-weight: 900;
        letter-spacing: 0.12em;
        color: #fff;
      }
      #end .cta .dot {
        color: #ff8c42;
      }
      #end .cta2 {
        margin-top: 1.4%;
        font-size: var(--end-cta2);
        font-weight: 700;
        color: var(--dim);
        letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="vs" class="hidden">
        <div class="beam top" id="beamTop">
          <div class="inner">
            <img class="portrait" id="vsImgA" />
            <div class="who">
              <div class="name" id="vsNameA"></div>
              <div class="sub" id="vsSubA"></div>
            </div>
          </div>
        </div>
        <div class="beam bottom" id="beamBottom">
          <div class="inner">
            <img class="portrait" id="vsImgB" />

              <div class="name" id="vsNameB"></div>
              <div class="sub" id="vsSubB"></div>

            <div class="side">
              <span class="w" id="raceWa"></span
              ><span class="n" id="raceNa"></span>

              ><span class="w" id="raceWb"></span>

            REPLAY
          </div>

        <div id="frameBar" class="hidden"></div>

        <div class="beam hidden" id="koBanner">
          <div class="inner">

        <div id="strip">
