        <div id="ggCard" class="hidden">
          <div class="gg stampmark">G<span>G</span></div>
          <div class="who">
            <img id="ggAv" />
            <div class="n" id="ggName"></div>
          </div>
          <div class="how" id="ggHow"></div>
          <div class="cta" id="ggCta">wallgame<span class="dot">.</span>io</div>
        </div>
        <div class="plate bottom">
          <img class="avatar" id="pAvB" />
          <div class="nm" id="pNameB"></div>
          <div class="tag" id="pTagB"></div>
        </div>
      </div>

      <div id="end" class="hidden">
        <div class="crown" id="endKicker">WINNER</div>
        <div class="winner">
          <img id="endAv" />
          <div class="n" id="endName"></div>
        </div>
        <div class="how" id="endHow"></div>
        <div class="cta">wallgame<span class="dot">.</span>io</div>
        <div class="cta2" id="endCta2">free · no account · play in one tap</div>
      </div>

      <!--
        The track name used to appear here so four comparison renders could be
        told apart on screen. That comparison is over, and a viewer has no use
        for it - the filename carries it now.
      -->
      <div id="brand" class="hidden">wallgame.io</div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const show = (el, on) => el.classList.toggle("hidden", !on);

      /**
       * How far into the VS segment the mark punches down, as a fraction.
       *
       * The renderer reads this to line the sting's impact up with the visual
       * one. It is published rather than copied, so the sound cannot drift
       * away from the picture when the animation is retimed.
       */
      window.__VS_PUNCH_FRACTION = 0.55;
      /** How long the punch takes, as a fraction of the same segment. */
      window.__VS_PUNCH_DURATION = 0.26;
      /**
       * The three endings of the wallz look, one frame at a time.
       *
       * Nil, 2026-10-26: the colour flood looked like a copy of WallzGame, so
       * the video ends in one of these instead, in Wall Game's own language:
       *
       *   replay  an instant replay: the camera cuts back to the position
       *           before the last move, pushes in on the capture cell while
       *           the two real screenshots dissolve in slow motion, and a
       *           stamp lands.
       *   gg      a freeze frame: a flash, a shake, cracks out of the capture
       *           cell, the board goes grey, and our winner card slides up.
       *   ko      a knockout: the loser's pawn spins off the board and the
       *           winner's banner, the VS screen's own, slides in.
       *
       * Each ending publishes its length, its hold and the second of its
       * impact here. The renderer reads them, and the finish sound lands on
       * the impact, so the sound cannot drift off the picture when an ending
       * is retimed.
       *
       * gg's cardIn is when its card is fully shown, so the renderer holds
       * the card for its words' reading time.
       *
       * e = { kind, t: seconds into the ending, at: {x, y} the capture cell
       *       in the board image (0..1), cell: one cell's width (0..1),
       *       before: the board image before the last move, stamp, how,
       *       winner, loser, crack: whether a move ended the game (gg
       *       cracks out of its cell; a resignation has no hit) }
       */
      /*
        The GG card's call to action after its pop (seconds on the
        ending's clock): a shine crosses it from CTA_SHINE_AT, over
        CTA_SHINE, and again every second breath; it breathes from
        CTA_PULSE_FROM every CTA_PULSE: it swells to CTA_BREATH (within
        its room), glows and brightens. The Wall Game Director,
        2026-11-01: a 3% swell does not read as motion on a phone.
      */
      const CTA_SHINE_AT = 1.05;
      const CTA_SHINE = 0.6;
      const CTA_PULSE_FROM = 1.75;
      const CTA_PULSE = 1.3;
      const CTA_BREATH = 1.08;
      window.__ENDINGS = {
        replay: { seconds: 2.0, impact: 1.4, hold: 1.3, flash: 0 },
        gg: { seconds: 1.0, impact: 0, hold: 1.6, flash: 0.18, cardIn: 0.95 },
        ko: { seconds: 1.0, impact: 0, hold: 1.5, flash: 0.12 },
      };
      /*
        window.__TEXT_TIMING: how long text takes to come in and go out
        (overlays.mjs TEXT_TIMING), set by the renderer before any frame.
      */

      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const easeOut3 = (x) => 1 - Math.pow(1 - x, 3);
      const easeInOut3 = (x) =>
        x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      /** Progress of `t` through the window [from, to], 0..1. */
      const span = (t, from, to) => clamp01((t - from) / (to - from));
      /** The VS mark's punch: lands big, overshoots once, settles at 1. */
      const punch = (p) =>
        p >= 1 ? 1 : 1.9 - 0.9 * easeOut3(p) - 0.14 * Math.sin(p * Math.PI);
      /** The size a punch starts at, for the renderer's room check. */
      window.__PUNCH_FROM = punch(0);

      /**
       * A long name shrinks until it fits, instead of ending in "...". The
       * room a name gets depends on the frame and the portrait size, so it is
       * measured here, not predicted. Seen 2026-10-26: the 9:16 frame cut
       * "Guest Cormorant" to "Guest Cormor...".
       */
      /**
       * Write the call to action into `el` (DEFAULT_CTA when absent), its
       * "wallgame.io" with the site's orange dot, as text nodes.
       */
      const ctaInto = (el, cta) => {
        const text = cta ?? "wallgame.io";
        const at = text.toLowerCase().indexOf("wallgame.io");
        el.textContent = "";
        if (at < 0) {
          el.textContent = text;
          return;
        }
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.textContent = ".";
        el.append(text.slice(0, at + 8), dot, text.slice(at + 9));
      };

      /**
       * `measure()` with the GG card laid out as it rests over the ending
       * (centred, full size) but unseen: the card is hidden until then, and
       * the credit may be in it. Everything is put back.
       */
      const cardAtRest = (measure) => {
        const card = $("ggCard");
        const hidden = card.classList.contains("hidden");
        const { visibility, transform } = card.style;
        card.style.visibility = "hidden";
        card.style.transform = "translate(-50%, -50%)";
        show(card, true);
        try {
          return measure();
        } finally {
          show(card, !hidden);
          card.style.visibility = visibility;
          card.style.transform = transform;
        }
      };

      const fitName = (el) => {
        el.style.fontSize = "";
        let size = parseFloat(getComputedStyle(el).fontSize);
        const floor = size * 0.6;
        while (el.scrollWidth > el.clientWidth && size > floor) {
          size = Math.max(floor, size - 2);
          el.style.fontSize = size + "px";
        }
      };

      /**
       * Cracks out of a point, in a 1000x1000 box over the board. The rays
       * come from fixed formulas, not a random source, so every render of a
       * game cracks the same way.
       */
      const paintCracks = (x, y, drawn) => {
        const svg = $("crack");
        const key = x + "/" + y;
        if (svg.dataset.key !== key) {
          svg.dataset.key = key;
          const rays = [];
          for (let i = 0; i < 9; i += 1) {
            let a = (i / 9) * Math.PI * 2 + Math.sin(i * 12.9898) * 0.35;
            let px = x * 1000;
            let py = y * 1000;
            const len = 260 + 220 * Math.abs(Math.sin(i * 78.233));
            const pts = [[px, py]];
            for (let k = 1; k <= 6; k += 1) {
              a += Math.sin(i * 3.1 + k * 1.7) * 0.35;
              px += (Math.cos(a) * len) / 6;
              py += (Math.sin(a) * len) / 6;
              pts.push([px, py]);
            }
            rays.push(pts.map((p) => p.join(",")).join(" "));
          }
          svg.innerHTML = rays
            .map(
              (pts) =>
                `<polyline points="${pts}" pathLength="1" fill="none" stroke="rgba(11,15,28,0.85)" stroke-width="9" stroke-linejoin="round" stroke-dasharray="1"/>` +
                `<polyline points="${pts}" pathLength="1" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="1"/>`,
            )
            .join("");
        }
        for (const line of svg.children) {
          line.setAttribute("stroke-dashoffset", String(1 - drawn));
        }
      };

      /**
       * The close-call beat on the mouse, one frame at a time.
       *
       *   scared  the cat is close: the mouse trembles, sweats, and a "!"
       *           bubble pops over it.
       *   laugh   a wall has saved it: the mouse bounces and a 😂 bubble pops.
       *
       * b = { kind, t: seconds into the beat, board: the screenshot under it,
       *       cell: {x, y} the mouse's cell centre in the board image (0..1),
       *       size: one cell's pitch, its gap included (0..1), the box
       *       the bubble and the drop sit around,
       *       cellSize: one cell's width without its gap (0..1), the window
       *       the crop moves in,
       *       under: the cell's own colour, under the crop: the strip its
       *       motion uncovers shows the cell, not the still pawn,
       *       side: where the bubble goes, up | right | left | down, chosen
       *       by the renderer away from the other pawns }
       */
      const paintBeat = (b) => {
        const fx = $("pawnFx");
        show(fx, !!b);
        if (!b) return;
        const W = $("boardWrap").clientWidth;
        const px = b.size * W;
        const left = (b.cell.x - b.size / 2) * W;
        const top = (b.cell.y - b.size / 2) * W;
        fx.style.left = left + "px";
        fx.style.top = top + "px";
        fx.style.width = px + "px";
        fx.style.height = px + "px";
        const inset = ((b.size - b.cellSize) / 2) * W;
        $("pawnWin").style.inset = inset + "px";
        $("pawnWin").style.background = b.under;
        const crop = $("pawnCrop");
        crop.style.backgroundImage = "url('" + b.board + "')";
        crop.style.backgroundSize = W + "px " + W + "px";
        crop.style.backgroundPosition =
          -(left + inset) + "px " + -(top + inset) + "px";

        const phase = b.t * 30;
        const bubble = $("pawnBubble");
        // Next to the mouse, on the side the renderer measured to be clear.
        const across = b.side === "left" || b.side === "right";
        bubble.style.top = b.side === "down" ? "105%" : across ? "50%" : "auto";
        bubble.style.bottom = b.side === "up" ? "105%" : "auto";
        bubble.style.left =
          b.side === "right" ? "105%" : across ? "auto" : "50%";
        bubble.style.right = b.side === "left" ? "105%" : "auto";
        bubble.style.fontSize = px * 0.42 + "px";
        bubble.style.padding = "0.18em 0.42em";
        const pop = punch(span(b.t, 0, 0.18));
        bubble.style.transform =
          (across ? "translateY(-50%)" : "translateX(-50%)") +
          " scale(" +
          pop +
          ")";
        const sweat = $("pawnSweat");

        if (b.kind === "scared") {
          /*
            Its own size, never enlarged: the window would cut the art. The
            strip its shake uncovers shows the cell's own colour (b.under):
            some skins' art reaches within 1% of the cell's edge
            (2026-10-29, the 85 mouse skins measured).
          */
          crop.style.transform =
            "translate(" +
            Math.sin(phase * 2.7) * px * 0.04 +
            "px," +
            Math.cos(phase * 3.3) * px * 0.03 +
            "px)";
          bubble.textContent = "!";
          show(sweat, true);
          // A drop that slides down the face and starts again, twice a second.
          const cycle = (b.t * 2) % 1;
          sweat.style.fontSize = px * 0.3 + "px";
          /*
            The drop is always on the right: the emoji's drops fly off to
            the right, so on the right side they read as sweat off the face
            (Nil, 2026-10-26: "the sweat looks like its pouring to the
            right, but it appears on the left side of the mouse").
          */
          sweat.style.left = "78%";
          sweat.style.top = -5 + cycle * 30 + "%";
          sweat.style.opacity = 1 - cycle * 0.8;
        } else {
          /*
            Small hops with a wobble, at its own size, as the scared shake:
            an enlarged hop is cut by the window (2026-10-29). What the hop
            uncovers is the cell's own colour, never the still pawn (seen
            twice on 2026-10-26, at 22% of a cell).
          */
          const hop = Math.abs(Math.sin(b.t * Math.PI * 3.2));
          crop.style.transform =
            "translateY(" +
            -hop * px * 0.05 +
            "px) rotate(" +
            Math.sin(phase * 0.9) * 6 +
            "deg)";
          bubble.textContent = "😂";
          show(sweat, false);
        }
      };

      /**
       * An EDL stamp in the middle of the game: the word punches in like the
       * VS mark and fades over its last quarter second (__TEXT_TIMING).
       *   m = { text, t: seconds into the stamp, seconds: its length,
       *         at: {x, y} its centre on the board image (0..1), where the
       *         renderer measured it to cover the least of the move,
       *         fit: its size, 1 or less so a long word fits the board,
       *         pop: the size its slam starts at, from 1 to __PUNCH_FROM:
       *         the largest at which it covers nothing new }
       */
      const paintMidStamp = (m) => {
        const el = $("midStamp");
        show(el, !!m);
        if (!m) return;
        el.textContent = m.text;
        el.style.left = m.at.x * 100 + "%";
        el.style.top = m.at.y * 100 + "%";
        const { stampPunch, stampFade } = window.__TEXT_TIMING;
        el.style.opacity = 1 - span(m.t, m.seconds - stampFade, m.seconds);
        el.style.transform =
          "translate(-50%,-50%) rotate(-8deg) scale(" +
          (1 +
            ((punch(span(m.t, 0, stampPunch)) - 1) * (m.pop - 1)) /
              (window.__PUNCH_FROM - 1)) *
            m.fit +
          ")";
      };

      /**
       * The colour of a cell where no pawn is drawn, read from the board
       * image (a data: URL, so the canvas may read it): the median of a ring
       * of pixels one pixel inside the cell's edge, its round corners left
       * out. A pawn's art can reach that ring at a few points only, so the
       * median is the cell's own colour, its highlight included.
       *   box = { x0, y0, x1, y1 } the cell in the image (0..1)
       */
      window.__cellColour = async (url, box) => {
        const img = new Image();
        img.src = url;
        await img.decode();
        const W = img.naturalWidth;
        const H = img.naturalHeight;
        const x0 = Math.round(box.x0 * W) + 1;
        const y0 = Math.round(box.y0 * H) + 1;
        const x1 = Math.round(box.x1 * W) - 2;
        const y1 = Math.round(box.y1 * H) - 2;
        const canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        const g = canvas.getContext("2d");
        g.drawImage(img, 0, 0);
        const d = g.getImageData(0, 0, W, H).data;
        const cut = Math.ceil((x1 - x0) * 0.25);
        const ring = [];
        const at = (x, y) => ring.push((y * W + x) * 4);
        for (let x = x0 + cut; x <= x1 - cut; x += 1) (at(x, y0), at(x, y1));
        for (let y = y0 + cut; y <= y1 - cut; y += 1) (at(x0, y), at(x1, y));
        const median = (k) => {
          const v = ring.map((i) => d[i + k]).sort((a, b) => a - b);
          return v[Math.floor(v.length / 2)];
        };
        return "rgb(" + median(0) + "," + median(1) + "," + median(2) + ")";
      };

      /**
       * The box of a picture's opaque pixels (alpha 128 or more), as
       * shares of the picture: what an overlay must not cover of a pawn
       * composed from its own art (render-game-video.mjs capturePicture).
       */
      window.__artBox = async (url) => {
        const img = new Image();
        img.src = url;
        await img.decode();
        const w = img.naturalWidth;
        const h = img.naturalHeight;
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const g = canvas.getContext("2d");
        g.drawImage(img, 0, 0);
        const d = g.getImageData(0, 0, w, h).data;
        let x0 = w;
        let y0 = h;
        let x1 = 0;
        let y1 = 0;
        for (let y = 0; y < h; y += 1) {
          for (let x = 0; x < w; x += 1) {
            if (d[(y * w + x) * 4 + 3] < 128) continue;
            x0 = Math.min(x0, x);
            y0 = Math.min(y0, y);
            x1 = Math.max(x1, x + 1);
            y1 = Math.max(y1, y + 1);
          }
        }
        return { x0: x0 / w, y0: y0 / h, x1: x1 / w, y1: y1 / h };
      };

      /**
       * A pawn as a picture with a clear background: the board image's
       * `box` (0..1) with the colour `key` ("rgb(r,g,b)", its cell's colour
       * as __cellColour reads it) made clear, with a soft edge so the art
       * keeps its outline: { png: a PNG data: URL, art: the box of its
       * opaque pixels, as shares of the picture }. The fallback of the
       * capture picture for a capture with no pawn art: the box also takes
       * what the page drew round the pawn (render-game-video.mjs
       * capturePicture).
       */
      window.__pawnSprite = async (url, box, key) => {
        const img = new Image();
        img.src = url;
        await img.decode();
        const W = img.naturalWidth;
        const H = img.naturalHeight;
        const x0 = Math.round(box.x0 * W);
        const y0 = Math.round(box.y0 * H);
        const w = Math.round((box.x1 - box.x0) * W);
        const h = Math.round((box.y1 - box.y0) * H);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const g = canvas.getContext("2d");
        g.drawImage(img, x0, y0, w, h, 0, 0, w, h);
        const data = g.getImageData(0, 0, w, h);
        const d = data.data;
        const bg = key.match(/\d+/g).map(Number);
        const SOFT = 24;
        for (let i = 0; i < d.length; i += 4) {
          const far =
            Math.abs(d[i] - bg[0]) +
            Math.abs(d[i + 1] - bg[1]) +
            Math.abs(d[i + 2] - bg[2]);
          d[i + 3] = Math.round(
            d[i + 3] * Math.max(0, Math.min(1, (far - SOFT) / SOFT)),
          );
        }
        g.putImageData(data, 0, 0);
        // The art's own box, the clear margin left out, as shares of the
        // picture: what an overlay must not cover.
        let ax0 = w;
        let ay0 = h;
        let ax1 = 0;
        let ay1 = 0;
        for (let y = 0; y < h; y += 1) {
          for (let x = 0; x < w; x += 1) {
            if (d[(y * w + x) * 4 + 3] < 128) continue;
            ax0 = Math.min(ax0, x);
            ay0 = Math.min(ay0, y);
            ax1 = Math.max(ax1, x + 1);
            ay1 = Math.max(ay1, y + 1);
          }
        }
        return {
          png: canvas.toDataURL("image/png"),
          art: { x0: ax0 / w, y0: ay0 / h, x1: ax1 / w, y1: ay1 / h },
        };
      };

      /**
       * The capture picture (render-game-video.mjs CAPTURE_INSIDE,
       * CAPTURE_POUNCE): c = { cell, mouse, cat: boxes {x, y, w, h} in the
       * board image (0..1); under: the capture cell's colour; mouseSrc,
       * catSrc: the two pawns' pictures (mouseSrc null when a ko ending
       * has thrown the caught pawn off); pounce: 0..1, how far the catcher
       * has landed }.
       */
      const paintCapture = (c) => {
        const fx = $("captureFx");
        show(fx, !!c);
        if (!c) return;
        const W = $("boardWrap").clientWidth;
        const place = (el, b) => {
          el.style.left = b.x * W + "px";
          el.style.top = b.y * W + "px";
          el.style.width = b.w * W + "px";
          el.style.height = b.h * W + "px";
        };
        place($("capUnder"), c.cell);
        $("capUnder").style.background = c.under;
        // A ko ending throws the caught pawn off the board: it is not here.
        show($("capMouse"), !!c.mouseSrc);
        if (c.mouseSrc) {
          place($("capMouse"), c.mouse);
          $("capMouse").src = c.mouseSrc;
        }
        place($("capCat"), c.cat);
        $("capCat").src = c.catSrc;
        // It grows from its feet to its box, never past it, so the pounce
        // covers only what the renderer measured.
        const p = easeOut3(clamp01(c.pounce));
        $("capCat").style.transformOrigin = "50% 100%";
        $("capCat").style.transform = "scale(" + (0.55 + 0.45 * p) + ")";
      };

      /**
       * The box a stamp word covers at rest (after its punch) at full size,
       * as a share of the board's width and height, so the renderer can
       * size it and place it where it hides the least of the move (audit
       * item 4).
       */
      window.__stampBox = (text) => {
        paintMidStamp({
          text,
          t: 0.25,
          seconds: 1,
          at: { x: 0.5, y: 0.5 },
          fit: 1,
          pop: 1,
        });
        const r = $("midStamp").getBoundingClientRect();
        const b = $("boardWrap").getBoundingClientRect();
        paintMidStamp(null);
        return { w: r.width / b.width, h: r.height / b.height };
      };

      /**
       * The box an element covers over a whole motion, as {x, y, w, h}
       * shares of the board, the camera's zoom left out: the union of its
       * boxes when `paint` draws `c` at each time of `ts` (seconds, the
       * frames it plays), where it shows. A pop grows past the rest size,
       * so one time is not enough (Video Reviewer 1, review 64).
       */
      const boxOver = (paint, el, c, ts) => {
        const cam = $("boardCam");
        const zoom = cam.style.transform;
        cam.style.transform = "none";
        const b = $("boardWrap").getBoundingClientRect();
        let x0 = Infinity;
        let y0 = Infinity;
        let x1 = -Infinity;
        let y1 = -Infinity;
        for (const t of ts) {
          paint({ ...c, t });
          // A faded element covers nothing.
          if (Number(getComputedStyle(el).opacity) < 0.05) continue;
          const r = el.getBoundingClientRect();
          x0 = Math.min(x0, r.left);
          y0 = Math.min(y0, r.top);
          x1 = Math.max(x1, r.right);
          y1 = Math.max(y1, r.bottom);
        }
        paint(null);
        cam.style.transform = zoom;
        // A wrong length or a new fade must not pass as "covers nothing"
        // (Video Reviewer 1, review 66).
        if (x0 === Infinity) {
          throw new Error(
            "the " + el.id + " never shows over its " + ts.length + " frames",
          );
        }
        return {
          x: (x0 - b.left) / b.width,
          y: (y0 - b.top) / b.height,
          w: (x1 - x0) / b.width,
          h: (y1 - y0) / b.height,
        };
      };

      /**
       * The box a react, blunder or brilliant mark (paintCellFx's `c`)
       * covers over the times `ts` (boxOver), so the renderer can put it on
       * a side where it covers no wall.
       */
      window.__cellFxBox = (c, ts) =>
        boxOver(
          paintCellFx,
          $(c.kind === "react" ? "cellEmoji" : "cellBadge"),
          c,
          ts,
        );

      /**
       * The box a scared or laughing mouse's bubble (paintBeat's `b`) covers
       * over the times `ts` (boxOver), for the same reason.
       */
      window.__beatBox = (b, ts) => boxOver(paintBeat, $("pawnBubble"), b, ts);

      /**
       * The box one resign flag (paintResignFlags with `f` its only flag)
       * covers over the times `ts` (boxOver), so the renderer can put it on
       * a side of its pawn where it covers no wall and hides no pawn.
       */
      window.__resignFlagBox = (f, ts) =>
        boxOver(paintResignFlags, $("resignFlag0"), f, ts);

      /**
       * Place a bubble next to a cell-sized box, on the side the renderer
       * measured to be clear (as the mouse beat's bubble), popped by `pop`.
       */
      const placeBubble = (el, side, pop) => {
        const across = side === "left" || side === "right";
        el.style.top = side === "down" ? "105%" : across ? "50%" : "auto";
        el.style.bottom = side === "up" ? "105%" : "auto";
        el.style.left = side === "right" ? "105%" : across ? "auto" : "50%";
        el.style.right = side === "left" ? "105%" : "auto";
        el.style.transform =
          (across ? "translateY(-50%)" : "translateX(-50%)") +
          " scale(" +
          pop +
          ")";
      };

      /** Rays out of the middle of a 400x400 box, from fixed formulas. */
      const burstRays = (n, inner, outer, width, color) => {
        let out = "";
        for (let i = 0; i < n; i += 1) {
          const a = (i / n) * Math.PI * 2 + Math.sin(i * 7.31) * 0.12;
          const long = i % 2 === 0 ? 1 : 0.7;
          const x1 = Math.cos(a) * inner;
          const y1 = Math.sin(a) * inner;
          const x2 = Math.cos(a) * outer * long;
          const y2 = Math.sin(a) * outer * long;
          out +=
            '<line x1="' +
            x1 +
            '" y1="' +
            y1 +
            '" x2="' +
            x2 +
            '" y2="' +
            y2 +
            '" stroke="' +
            color +
            '" stroke-width="' +
            width +
            '" stroke-linecap="round"/>';
        }
        return out;
      };

      /*
        The resign card's flags (Nil, 2026-11-01, ask 3d2f28e7: "what if we
        make both pawns weave the resign flag?"): a small white flag held up
        beside each pawn of the side that resigned, on the side the renderer
        measured to be clear, with no pointer (C45). Each is
        RESIGN_FLAG_CELLS of a cell, large enough to read at a glance on a
        phone (Wall Game Director, 2026-11-01: at 0.7 it read as a small
        mark), its middle RESIGN_FLAG_OUT of a cell from its pawn's, kept
        inside the board. It rises over its first
        0.45 s, then its cloth waves, as the old card's flag did.
      */
      const RESIGN_FLAG_CELLS = 0.85;
      const RESIGN_FLAG_OUT = 0.8;
      const resignFlagSvg = (t) => {
        const up = easeOut3(span(t, 0, 0.45));
        const y = (k) => Math.sin(t * 7 - k * 1.3) * 3;
        const cloth =
          "M22 " +
          (14 + y(0)).toFixed(1) +
          " C40 " +
          (7 + y(1)).toFixed(1) +
          " 60 " +
          (21 + y(2)).toFixed(1) +
          " 92 " +
          (11 + y(3)).toFixed(1) +
          " L92 " +
          (47 + y(3)).toFixed(1) +
          " C60 " +
          (57 + y(2)).toFixed(1) +
          " 40 " +
          (43 + y(1)).toFixed(1) +
          " 22 " +
          (50 + y(0)).toFixed(1) +
          " Z";
        return (
          '<g transform="translate(0 ' +
          ((1 - up) * 40).toFixed(1) +
          ')">' +
          '<rect x="14" y="8" width="7" height="88" rx="3.5" fill="#8b5a2b" stroke="#3b2410" stroke-width="2.5"/>' +
          '<circle cx="17.5" cy="7" r="6" fill="#e8c35a" stroke="#3b2410" stroke-width="2.5"/>' +
          '<path d="' +
          cloth +
          '" fill="#fff" stroke="#3b4252" stroke-width="3" stroke-linejoin="round"/>' +
          "</g>"
        );
      };
      /**
       * f = { t: seconds into the card, alpha: its fade, size: one cell's
       *       width (0..1), flags: [{ cell: {x, y} its pawn's centre in the
       *       board image (0..1), side: up, down, left or right }] }
       */
      const paintResignFlags = (f) => {
        const W = $("boardWrap").clientWidth;
        ["resignFlag0", "resignFlag1"].forEach((id, i) => {
          const el = $(id);
          const one = f?.flags[i];
          show(el, !!one);
          if (!one) return;
          const px = f.size * W;
          const half = (px * RESIGN_FLAG_CELLS) / 2;
          const [dx, dy] = {
            up: [0, -1],
            down: [0, 1],
            left: [-1, 0],
            right: [1, 0],
          }[one.side];
          const clamp = (v) => Math.max(half, Math.min(W - half, v));
          const x = clamp(one.cell.x * W + dx * px * RESIGN_FLAG_OUT);
          const y = clamp(one.cell.y * W + dy * px * RESIGN_FLAG_OUT);
          el.style.left = x - half + "px";
          el.style.top = y - half + "px";
          el.style.width = half * 2 + "px";
          el.style.height = half * 2 + "px";
          el.style.opacity = f.alpha;
          el.innerHTML = resignFlagSvg(f.t);
        });
      };

      /**
       * A moment on one cell, one frame at a time.
       *
       *   blunder    a red ring and a "??" bubble. The renderer adds the red
       *              flash (fxFlash) and the shake (s.shake).
       *   brilliant  a burst of rays and a ring out of the cell, and a "!!"
       *              bubble.
       *   react      an emoji pops once NEXT TO the cell, on the side the
       *              renderer measured to be clear, so it never covers the
       *              pawn it reacts to, and kept inside the board (Wall Game
       *              PM, 2026-10-26: it covered the pawn, hung off the h-file,
       *              and its trailing copies read as artifacts).
       *
       * c = { kind, t: seconds into it, cell: {x, y} the cell centre in the
       *       board image (0..1), size: one cell's width (0..1), side: where
       *       the bubble goes, emoji: the react's character }
       */
      const paintCellFx = (c) => {
        const fx = $("cellFx");
        show(fx, !!c);
        if (!c) return;
        const W = $("boardWrap").clientWidth;
        const px = c.size * W;
        fx.style.left = (c.cell.x - c.size / 2) * W + "px";
        fx.style.top = (c.cell.y - c.size / 2) * W + "px";
        fx.style.width = px + "px";
        fx.style.height = px + "px";
        const ring = $("cellRing");
        const badge = $("cellBadge");
        const burst = $("cellBurst");
        const emoji = $("cellEmoji");
        show(ring, c.kind !== "react");
        show(badge, c.kind !== "react");
        show(burst, c.kind === "brilliant");
        show(emoji, c.kind === "react");
        badge.style.fontSize = px * 0.6 + "px";
        badge.style.padding = "0.12em 0.36em 0.12em 0.3em";
        const pop = punch(span(c.t, 0, 0.2));

        if (c.kind === "blunder") {
          ring.style.borderWidth = px * 0.09 + "px";
          ring.style.borderColor = "#ef4444";
          ring.style.boxShadow = "0 0 " + px * 0.25 + "px #ef4444";
          ring.style.opacity = 1;
          ring.style.transform = "scale(" + pop + ")";
          badge.textContent = "??";
          badge.style.background = "#dc2626";
          placeBubble(badge, c.side, pop);
        }

        if (c.kind === "brilliant") {
          const out = easeOut3(span(c.t, 0, 0.55));
          ring.style.borderWidth = px * 0.07 + "px";
          ring.style.borderColor = "#2dd4bf";
          ring.style.boxShadow = "0 0 " + px * 0.3 + "px #2dd4bf";
          ring.style.transform = "scale(" + (1 + 1.3 * out) + ")";
          ring.style.opacity = 1 - out;
          burst.innerHTML = burstRays(
            14,
            60 + 70 * out,
            80 + 120 * out,
            10,
            "#5eead4",
          );
          burst.style.opacity = 1 - span(c.t, 0.45, 0.9);
          badge.textContent = "!!";
          badge.style.background = "#0d9488";
          placeBubble(badge, c.side, pop);
        }

        if (c.kind === "react") {
          // One cell over, on the clear side; the centre is then clamped so
          // the emoji at its largest stays inside the board's square.
          const [dx, dy] = {
            up: [0, -1],
            down: [0, 1],
            left: [-1, 0],
            right: [1, 0],
          }[c.side];
          const most = 1.15;
          const half = (px * 0.95 * most) / 2;
          const clamp = (v) => Math.max(half, Math.min(W - half, v));
          const x = clamp(c.cell.x * W + dx * px) - c.cell.x * W;
          const y = clamp(c.cell.y * W + dy * px) - c.cell.y * W;
          // A clean pop: grows past full size, settles, holds, fades.
          const grow =
            c.t < 0.18
              ? 0.4 + (most - 0.4) * easeOut3(c.t / 0.18)
              : most - (most - 1) * easeOut3(span(c.t, 0.18, 0.32));
          emoji.textContent = c.emoji;
          emoji.style.fontSize = px * 0.95 + "px";
          emoji.style.transform =
            "translate(calc(-50% + " +
            x +
            "px), calc(-50% + " +
            y +
            "px)) rotate(" +
            Math.sin(c.t * 7) * 6 +
            "deg) scale(" +
            grow +
            ")";
          emoji.style.opacity = 1 - span(c.t, 1.0, 1.2);
        }
      };

      /**
       * A trap: the walls that shut a pawn in light up, pulse, and stay lit
       * while the renderer stamps its word over them.
       *   tr = { t: seconds into it, walls: [[x1, y1, x2, y2]] in the board
       *          image (0..1), lit: true to skip the light-up (the cold
       *          open cuts in on walls that are already lit) }
       */
      /**
       * A hunter's walk (edl.mjs "path"): render-game-video.mjs playState
       * adds to every path what to paint, path.paint = { lines: [{ hex,
       * alpha, steps, dots, disc }], dotRadius, rimRadius, rimColor,
       * discRing }, places as
       * fractions of the board and sizes in board units (1000 a board).
       * Where the dots go and where the number sits is decided in
       * shared/domain/walk-animation.ts, which the game board reads too;
       * this page only paints them. Each line is a dotted trail in its
       * hunter's colour (hex) on a dark rim, and a whole walk shows its
       * steps in a disc beside its target (disc, null while it draws).
       */
      const paintPath = (path) => {
        const svg = $("pathSvg");
        show(svg, !!path);
        if (!path) return;
        const p = path.paint;
        const k = (v) => (v * 1000).toFixed(1);
        svg.innerHTML = p.lines
          .map((l) => {
            const circles = (r, fill) =>
              l.dots
                .map(
                  (q) =>
                    '<circle cx="' +
                    k(q.x) +
                    '" cy="' +
                    k(q.y) +
                    '" r="' +
                    r +
                    '" fill="' +
                    fill +
                    '"/>',
                )
                .join("");
            const r = l.disc ? l.disc.radius.toFixed(1) : "";
            const disc = !l.disc
              ? ""
              : '<circle cx="' +
                k(l.disc.at.x) +
                '" cy="' +
                k(l.disc.at.y) +
                '" r="' +
                r +
                '" fill="' +
                l.hex +
                '" stroke="' +
                p.rimColor +
                '" stroke-width="' +
                p.discRing +
                '"/>' +
                '<text x="' +
                k(l.disc.at.x) +
                '" y="' +
                k(l.disc.at.y) +
                '" dy="0.35em" text-anchor="middle" font-family="TikTok Sans, DejaVu Sans, sans-serif" font-weight="900" font-size="' +
                (r * 1.1).toFixed(1) +
                '" fill="#fff">' +
                l.steps +
                "</text>";
            return (
              '<g opacity="' +
              l.alpha +
              '">' +
              circles(p.rimRadius, p.rimColor) +
              circles(p.dotRadius, l.hex) +
              disc +
              "</g>"
            );
          })
          .join("");
      };

      /**
       * The opening's names (render-game-video.mjs openingNames): each
       * side's name over its cat, in its colour on a dark rim, its baseline
       * centred at (x, y) and its letters `size` high, as fractions of the
       * board. It pops in as `pop` goes 0..1 (bigger, then settling) and
       * fades by `alpha`.
       */
      const paintNames = (names) => {
        const svg = $("namesSvg");
        show(svg, !!names && names.length > 0);
        if (!names || names.length === 0) return;
        const k = (v) => (v * 1000).toFixed(1);
        svg.innerHTML = names
          .map((n) => {
            const grow = 1 + 0.35 * (1 - n.pop) * (1 - n.pop);
            const size = n.size * 1000;
            return (
              '<g opacity="' +
              Math.min(1, 0.5 + n.pop) * n.alpha +
              '" transform="translate(' +
              k(n.x) +
              " " +
              k(n.y) +
              ") scale(" +
              grow.toFixed(3) +
              ')"><text x="0" y="0" text-anchor="middle" font-family="TikTok Sans, DejaVu Sans, sans-serif" font-weight="900" font-size="' +
              size.toFixed(1) +
              '" fill="' +
              n.hex +
              '" stroke="#0b0f1c" stroke-width="' +
              (size * 0.16).toFixed(1) +
              '" stroke-linejoin="round" paint-order="stroke">' +
              n.text +
              "</text></g>"
            );
          })
          .join("");
      };

      /**
       * An EDL overlay (overlays.mjs, render-game-video.mjs overlayFrame):
       * drawn from o.draw and the facts the renderer put in, at the box it
       * placed (o.place, 0..1 of the board). It pops in over its first
       * overlayPop (TEXT_TIMING) and fades by o.alpha. With no place yet
       * (the renderer places an overlay once its window closes), nothing
       * shows. A place off the board paints #frameBar instead: the
       * caption's (on the caption's last line, with the caption hidden
       * while it shows) or the left margin's. An overlay with a tint greys
       * the board under it (the camera, so the capture picture too).
       */
      const ERROR_HIT_SECONDS = 0.3;
      const OVERLAY_FIT_FLOOR = 0.6;
      /*
        The left margin (overlays.mjs OffPlace): from MARGIN_EDGE px off the
        frame's left edge to MARGIN_GAP px before the board, centred on the
        board's height, at the shape of the asset's size. Under
        MARGIN_MIN px wide it has no room (a wide board leaves almost none).
        It lies out of the Reels safe area's 6% inset, which keeps clear of
        the buttons on the right; the left edge has none.
      */
      /**
       * The eternity-later card's letters, as SpongeBob's time cards set
       * them: [tilt in degrees, lift in em], in turn (Nil, C39: "the sponge
       * bob font would also be a nice touch").
       */
      const TIME_CARD_BOUNCE = [
        [-4, 0.02],
        [3, -0.04],
        [-2, 0.03],
        [5, -0.02],
        [-3, 0.04],
        [2, -0.03],
        [-5, 0.01],
      ];
      /** A card's inside (overlays.mjs CARDS), in our own art. */
      const cardHtml = (o, esc) => {
        if (o.card === "wasted") return "<div>wasted</div>";
        if (o.card === "you-died") return "<div>YOU DIED</div>";
        if (o.card === "eternity-later") {
          // The time card's own bounce: each letter tilts and lifts a little,
          // the same way in every render (TIME_CARD_BOUNCE).
          let k = 0;
          return (
            "<div>" +
            "One Eternity Later"
              .split("")
              .map((ch) => {
                if (ch === " ") return " ";
                const [deg, lift] =
                  TIME_CARD_BOUNCE[k++ % TIME_CARD_BOUNCE.length];
                return (
                  '<span style="display:inline-block;transform:rotate(' +
                  deg +
                  "deg) translateY(" +
                  lift +
                  'em)">' +
                  ch +
                  "</span>"
                );
              })
              .join("") +
            "</div>"
          );
        }
        if (o.card === "mission-passed") {
          return (
            '<div class="big">mission passed!</div>' +
            '<div class="small">respect +</div>'
          );
        }
        if (o.card === "resign-flag") {
          /*
            The resign card's words, two lines ("Human" / "resigns"), in
            the drawing so they scale as one picture to its box and never
            overflow it. They are large: at 40 of 330 they read about 20 px
            high, a third of the payoff (render vet, 2026-11-01,
            v-2026-11-01-8). The flags are beside the resigner's pawns
            (paintResignFlags), not in the card.
          */
          const [who, ...rest] = String(o.text ?? "").split(" ");
          const word = (text, at) =>
            '<text x="150" y="' +
            at +
            '" text-anchor="middle" font-size="62" font-weight="900" fill="#fff" stroke="#0b1020" stroke-width="9" paint-order="stroke fill" font-family="TikTok Sans, sans-serif">' +
            esc(text) +
            "</text>";
          return (
            '<svg viewBox="0 0 300 150" style="height:100%;width:100%">' +
            word(who, 66) +
            word(rest.join(" "), 132) +
            "</svg>"
          );
        }
        if (o.card === "directed-by") {
          return (
            '<div class="small">Directed by</div><div>' + esc(o.text) + "</div>"
          );
        }
        // uno-reverse: a reverse card in the seat's colour, two arrows on
        // its white oval, a small one in two corners.
        const c = esc(o.hex);
        const arrows = (x, y, k) =>
          '<g transform="translate(' +
          x +
          " " +
          y +
          ") scale(" +
          k +
          ') rotate(-40)">' +
          '<path d="M-34 -10 h44 v-16 l30 28 l-30 28 v-16 h-44 z" fill="' +
          c +
          '" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>' +
          '<path d="M34 10 h-44 v16 l-30 -28 l30 -28 v16 h44 z" transform="translate(0 30)" fill="' +
          c +
          '" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>' +
          "</g>";
        return (
          '<svg viewBox="0 0 200 300" style="height:100%;width:auto;max-width:100%">' +
          '<rect x="4" y="4" width="192" height="292" rx="18" fill="#fff"/>' +
          '<rect x="16" y="16" width="168" height="268" rx="12" fill="' +
          c +
          '"/>' +
          '<ellipse cx="100" cy="150" rx="62" ry="112" transform="rotate(28 100 150)" fill="#fff"/>' +
          arrows(100, 135, 1) +
          '<g opacity="0.95">' +
          arrows(40, 44, 0.32) +
          arrows(160, 250, 0.32) +
          "</g></svg>"
        );
      };
      const MARGIN_EDGE = 24;
      const MARGIN_GAP = 16;
      const MARGIN_MIN = 110;
      /**
       * The ring of a cut-out a pawn emotes, in its seat's colour: four
       * hard shadows grow its outline by `r` px on every side, then a soft
       * one lifts it off the board.
       */
      const ringFilter = (hex, r) =>
        [
          [r, 0],
          [-r, 0],
          [0, r],
          [0, -r],
        ]
          .map(([x, y]) => "drop-shadow(" + x + "px " + y + "px 0 " + hex + ")")
          .join(" ") + " drop-shadow(0 0.1em 0.3em rgba(0, 0, 0, 0.7))";
      /** `hex` mixed with white: k = 1 is white. */
      const tintOf = (hex, k) => {
        const n = parseInt(hex.slice(1), 16);
        const c = [n >> 16, (n >> 8) & 255, n & 255].map((v) =>
          Math.round(v + (255 - v) * k),
        );
        return "rgb(" + c.join(",") + ")";
      };
      /**
       * A redraw (overlays.mjs draw "redraw"): the seat's own pawn art
       * (`o.art`) in a known meme's pose and props, as one SVG; every
       * motion is a pure function of t.
       */
      const redrawSvg = (o, esc) => {
        const t = o.t;
        const art = esc(o.art);
        const ink = "#0b1020";
        if (o.redraw === "surprised") {
          // The deadpan close-up: the pawn's top half, still, on a flat
          // disc in its seat's colour.
          return (
            '<svg viewBox="0 0 100 100"><defs><clipPath id="rdDisc">' +
            '<circle cx="50" cy="50" r="46"/></clipPath></defs>' +
            '<circle cx="50" cy="50" r="46" fill="' +
            tintOf(o.ring, 0.72) +
            '"/><g clip-path="url(#rdDisc)"><image href="' +
            art +
            '" x="-22" y="-4" width="144" height="144"/></g>' +
            '<circle cx="50" cy="50" r="46" fill="none" stroke="' +
            ink +
            '" stroke-width="2.5"/></svg>'
          );
        }
        if (o.redraw === "pointing") {
          /*
            The mirror pose: the seat's hunter on the left, the piece it
            hunts on the right, mirrored, so they face each other; each
            points an arm at the other, in its seat's colour. The arms jab
            in turn, a beat each, as the pointing sound's two voices do.
          */
          const jab = (a) => Math.sin(Math.PI * span(t, a, a + 0.3));
          const arm = (x0, dir, hex, k) => {
            const x1 = x0 + dir * (20 + 6 * k);
            const fx = x1 + dir * 4;
            return (
              '<path d="M' +
              x0 +
              " 40 Q" +
              (x0 + dir * 8) +
              " 31 " +
              x1 +
              ' 31" fill="none" stroke="' +
              ink +
              '" stroke-width="6.4" stroke-linecap="round"/>' +
              '<path d="M' +
              x0 +
              " 40 Q" +
              (x0 + dir * 8) +
              " 31 " +
              x1 +
              ' 31" fill="none" stroke="' +
              hex +
              '" stroke-width="4" stroke-linecap="round"/>' +
              '<line x1="' +
              x1 +
              '" y1="31" x2="' +
              (fx + dir * 7) +
              '" y2="31" stroke="' +
              ink +
              '" stroke-width="4.2" stroke-linecap="round"/>' +
              '<line x1="' +
              x1 +
              '" y1="31" x2="' +
              (fx + dir * 7) +
              '" y2="31" stroke="#fff" stroke-width="2" stroke-linecap="round"/>' +
              '<circle cx="' +
              (x1 + dir * 1.5) +
              '" cy="32.5" r="4.6" fill="#fff" stroke="' +
              ink +
              '" stroke-width="1.6"/>'
            );
          };
          const k1 = Math.max(jab(0.15), jab(1.35));
          const k2 = Math.max(jab(0.75), jab(1.95));
          // A dark band, each pawn on a soft glow in its seat's colour.
          const glow = (hex, id) =>
            '<radialGradient id="' +
            id +
            '"><stop offset="0" stop-color="' +
            hex +
            '" stop-opacity="0.55"/><stop offset="1" stop-color="' +
            hex +
            '" stop-opacity="0"/></radialGradient>';
          return (
            '<svg viewBox="0 0 200 64"><defs>' +
            glow(o.hex, "rdPtA") +
            glow(o.hex2, "rdPtB") +
            "</defs>" +
            '<rect x="2" y="2" width="196" height="60" rx="12" fill="#0f172a" stroke="#fff" stroke-width="2"/>' +
            '<circle cx="38" cy="32" r="30" fill="url(#rdPtA)"/>' +
            '<circle cx="162" cy="32" r="30" fill="url(#rdPtB)"/>' +
            arm(58, 1, o.hex, k1) +
            arm(142, -1, o.hex2, k2) +
            '<image href="' +
            art +
            '" x="14" y="8" width="48" height="48"/>' +
            '<g transform="translate(200 0) scale(-1 1)"><image href="' +
            esc(o.art2) +

          const flame = (cx, base, h, w, phase, k) => {
            const hh =

            const one = (ww, hh2, fill) =>
              '<path fill="' +
              fill +
              '" d="M' +
              (cx - ww / 2) +
              " " +
              base +
              " Q" +
              (cx - ww / 2) +
              " " +
              (base - hh2 * 0.55) +
              " " +
              cx +
              " " +
              (base - hh2) +
              " Q" +
              (cx + ww / 2) +
              " " +
              (base - hh2 * 0.55) +
              " " +
              (cx + ww / 2) +
              " " +
              base +
              ' Z"/>';

            [5, 80, 26, 12, 0.4],
            [95, 80, 28, 12, 1.9],
            [10, 62, 20, 10, 2.6],
            [90, 62, 22, 10, 0.9],

            .map(([x, b, h, w, ph]) => flame(x, b, h, w, ph, side * grow))

            .map((x, i) => flame(x, 94, 18 + (i % 3) * 5, 13, i * 1.3, grow))

            easeOut3(span(t, 0.25, 0.55)) - easeOut3(span(t, 0.8, 1.05));

          const cy = 66 - 13 * lift;
          const cup =
            '<g transform="translate(' +
            cx +
            " " +
            cy +
            ") rotate(" +
            -25 * lift +
            ')"><path d="M6 2 q5 0 5 4 q0 4 -5 4" fill="none" stroke="' +
            ink +
            '" stroke-width="1.6"/><rect x="-4" y="0" width="10" height="11" rx="1.5" fill="#fff" stroke="' +
            ink +
            '" stroke-width="1.6"/></g>';
          const bubble =
            '<g opacity="' +
            span(t, 0.1, 0.25) +
            '"><path d="M38 20 L48 31 L44 20 Z" fill="#fff" stroke="' +
            ink +
            '" stroke-width="1.4" stroke-linejoin="round"/><rect x="3" y="3" width="62" height="18" rx="8" fill="#fff" stroke="' +
            ink +
            '" stroke-width="1.6"/><rect x="36" y="18" width="11" height="4" fill="#fff"/>' +
            '<text x="34" y="15.6" text-anchor="middle" font-size="10" font-weight="800" fill="#111" font-family="TikTok Sans, DejaVu Sans, sans-serif">this is fine</text></g>';

            back +
            '<image href="' +
            art +
            '" x="27" y="32" width="46" height="46"/>' +
            cup +
            front +
            bubble +
            "</svg>"

        // The scream: the pawn stretched and waving, on a Munch sky over a
        // blue fjord and the bridge's rail.
        const blob = [];
        for (let k = 0; k < 72; k += 1) {
          const a = (k / 72) * Math.PI * 2;
          const c = Math.cos(a);
          const sn = Math.sin(a);

          const r =
            1 /
            Math.pow(
              Math.pow(Math.abs(c), 4) + Math.pow(Math.abs(sn), 4),
              0.25,
            );

            (40 + 38 * c * r * wv).toFixed(2) +
              " " +
              (50 + 48 * sn * r * wv).toFixed(2),

          let d = "M-10 " + y;

              " L" +
              x +
              " " +
              (y + amp * Math.sin((x / len) * Math.PI * 2 + phase)).toFixed(2);

            '<path d="' +
            d +
            '" fill="none" stroke="' +
            color +
            '" stroke-width="' +
            width +
            '" stroke-linecap="round"/>'

        };

        const sky = [
          ["#fbbf24", 4],
          ["#dc2626", 11],
          ["#f97316", 18],
          ["#b91c1c", 25],
          ["#f59e0b", 32],
          ["#ea580c", 39],
        ]
          .map(([c, y], i) => wave(y, 2.6, 46, c, 6, ph + i))
          .join("");

          ["#1d4ed8", 52],
          ["#60a5fa", 60],
          ["#1e40af", 68],
          ["#3b82f6", 76],
          ["#1e3a8a", 86],
        ]
          .map(([c, y], i) => wave(y, 3, 38, c, 6, -ph + i * 1.7))
          .join("");

        return (
          '<svg viewBox="0 0 80 100"><defs><clipPath id="rdBlob"><path d="M' +
          blob.join(" L") +
          ' Z"/></clipPath><filter id="rdWave" x="-20%" y="-20%" width="140%" height="140%">' +
          '<feTurbulence type="fractalNoise" baseFrequency="0.015 0.05" numOctaves="1" seed="7"/>' +
          '<feDisplacementMap in="SourceGraphic" scale="' +
          (9 + 4 * Math.sin(t * Math.PI * 2 * 1.4)).toFixed(2) +
          '" xChannelSelector="R" yChannelSelector="G"/></filter></defs>' +
          '<g clip-path="url(#rdBlob)"><rect x="0" y="0" width="80" height="100" fill="#c2410c"/>' +
          sky +
          '<rect x="0" y="48" width="80" height="52" fill="#1e3a8a"/>' +
          fjord +
          '<path d="M-6 66 L86 104" stroke="#7c4a1e" stroke-width="7"/>' +
          '<path d="M-6 74 L86 112" stroke="#a16207" stroke-width="3"/>' +
          '<g transform="translate(40 92) scale(' +
          (0.86 - sway) +
          " " +
          (1.22 + sway) +
          ') translate(-40 -92)" filter="url(#rdWave)"><image href="' +
          art +
          '" x="10" y="34" width="60" height="58"/></g>' +
          '</g><path d="M' +
          blob.join(" L") +
          ' Z" fill="none" stroke="' +
          ink +
          '" stroke-width="1.6"/></svg>'
        );
      };
      const paintOverlay = (o) => {
        show($("overlayTail"), false);
        const placed = !!o && o.place.where !== undefined;
        const frame =
          placed && (o.place.where === "caption" || o.place.where === "margin");
        const el = $(frame ? "frameBar" : "overlay");
        show($(frame ? "overlay" : "frameBar"), false);
        $("caption").style.visibility =
          frame && o.place.where === "caption" ? "hidden" : "";
        show(el, placed);
        const tint = placed && o.tint === "grey";
        $("boardCam").style.filter = tint
          ? "grayscale(" +
            easeOut3(span(o.t, 0, window.__TEXT_TIMING.overlayPop)) * o.alpha +
            ") brightness(" +
            (1 -
              0.3 *
                easeOut3(span(o.t, 0, window.__TEXT_TIMING.overlayPop)) *
                o.alpha) +
            ")"
          : "";

        const p = o.place;
        el.className =
          o.draw === "card"
            ? "card " + o.card
            : o.form === "cover"
              ? o.draw + " cover"
              : o.draw;
        let room = "ok";
        // The scale of its content: a clip's small size, or the margin.
        let scale = p.scale;
        if (p.where === "margin") {
          const board = $("boardWrap");
          const shape = (p.h * board.offsetHeight) / (p.w * board.offsetWidth);
          const w = Math.min(
            board.offsetLeft - MARGIN_GAP - MARGIN_EDGE,
            p.w * board.offsetWidth,
          );
          const h = Math.min(w * shape, board.offsetHeight);
          room = w >= MARGIN_MIN ? "ok" : "narrow";
          scale = Math.max(0, w) / (p.w * board.offsetWidth);
          el.style.left = board.offsetLeft - MARGIN_GAP - w + "px";
          el.style.top = board.offsetTop + (board.offsetHeight - h) / 2 + "px";
          el.style.width = Math.max(0, w) + "px";
          el.style.height = h + "px";
        } else if (frame) {
          /*
            The board bar's size, centred on the caption's last line (its
            text sits at the bottom of its box), MEASURED in #play, which
            the shake moves with it; kept under the look's top and over
            the head row, or room says why not and the renderer stops: a
            look that shows no caption (only wallz does) has no line for
            it (Video Reviewer 1, review 93 N1). The wallz caption's
            line-height is a number, so the page gives it in px.
          */
          const board = $("boardWrap");
          const cap = $("caption");
          const w = p.w * board.offsetWidth;
          const line = parseFloat(getComputedStyle(cap).lineHeight);
          const ceiling = parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue(
              "--look-top",
            ),
          );
          const hud = $("hud");
          const floor = hud.offsetHeight > 0 ? hud.offsetTop : board.offsetTop;
          /*
            Its height and its text shrink to the room over the head row:
            the bar is sized in the board's units, and the edge-to-edge
            board (C58) made it taller than the caption's room (the ending
            bar of qbh, test render on the 4090, 2026-11-05).
          */
          const fit = Math.min(
            1,
            (floor - ceiling) / (p.h * board.offsetHeight),
          );
          const h = p.h * board.offsetHeight * fit;
          scale *= fit;
          const mid = cap.offsetTop + cap.offsetHeight - line / 2;
          const top = Math.max(ceiling, Math.min(mid - h / 2, floor - h));
          room =
            cap.offsetHeight === 0 || !Number.isFinite(line)
              ? "no-caption-line"
              : top >= ceiling && top + h <= floor
                ? "ok"
                : "no-room";
          el.style.left = board.offsetLeft + p.x * board.offsetWidth + "px";
          el.style.top = top + "px";
          el.style.width = w + "px";
          el.style.height = h + "px";
        } else {
          el.style.left = p.x * 100 + "%";
          el.style.top = p.y * 100 + "%";
          el.style.width = p.w * 100 + "%";
          el.style.height = p.h * 100 + "%";
        }
        const pop = easeOut3(span(o.t, 0, window.__TEXT_TIMING.overlayPop));
        // A cover clip is its own animation: no pop (a curtain that faded
        // in would show the board first), only the fade at its end.
        const cover = o.form === "cover";
        el.style.opacity = (cover ? 1 : pop) * o.alpha;
        // Who emotes it: a tail from it to the pawn (placeNear), as faded.
        if (o.ring && p.tail) {
          const tail = $("overlayTail");
          // A wall of the move that the tail crosses shows over it, through
          // a hole in the tail (placeNear's `over`), so a box stays whole.
          const over = p.over ?? [];
          tail.innerHTML =
            (over.length > 0
              ? '<defs><mask id="tailHoles" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">' +
                '<rect x="0" y="0" width="1000" height="1000" fill="#fff"/>' +
                over
                  .map(
                    (b) =>
                      '<rect x="' +
                      b.x0 * 1000 +
                      '" y="' +
                      b.y0 * 1000 +
                      '" width="' +
                      (b.x1 - b.x0) * 1000 +
                      '" height="' +
                      (b.y1 - b.y0) * 1000 +
                      '" fill="#000"/>',
                  )
                  .join("") +
                "</mask></defs>"

            '<polygon points="' +
            p.tail.points.map(([x, y]) => x * 1000 + "," + y * 1000).join(" ") +
            '" fill="' +
            o.ring +
            '" stroke="#0b1020" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"' +
            (over.length > 0 ? ' mask="url(#tailHoles)"' : "") +

        // shakes side to side, dying out, and the bar drains (Wall Game

        const hit = o.error ? span(o.error.t, 0, ERROR_HIT_SECONDS) : 0;
        const shake = o.error

          : 0;

          "translateX(" +
          shake +
          "%) scale(" +
          (cover ? 1 : 0.85 + 0.15 * pop) +

        const moves = [];
        const esc = (v) =>
          String(v).replace(/[&<>"]/g, (c) => "&#" + c.charCodeAt(0) + ";");
        if (o.draw === "whitebar") {
          el.innerHTML = "<div>" + esc(o.text) + "</div>";
        } else if (o.draw === "sequence" && o.form === "cover") {

        } else if (o.draw === "sequence") {

          // pushes it right, toward the board's rim, not into the middle;
          // an edge's middle ("right-middle", a pawn's place) centres it

            "beside-right": "left",
            "beside-top": "bottom",
            "beside-bottom": "top",

            '<img src="' +
            esc(o.src) +
            '" style="object-position:' +
            (x ?? "center") +
            " " +
            (y ?? "center") +

          const c = o.crop;

            (h === "left" ? "auto 0 0" : h === "right" ? "0 0 auto" : "auto") +

            w +
            "px;height:" +
            w / shape +
            "px;";

            esc(o.src) +

            100 / c.h +

            pos(c.x, c.w) +
            "% " +
            pos(c.y, c.h) +

            const cut =

                .map(([x, y]) => x * 100 + "% " + y * 100 + "%")

              (o.fade > 0
                ? "-webkit-mask-image:linear-gradient(to bottom, #000 " +

                  "%, transparent);"
                : "");

              '<div class="ring" style="' +
              box +
              (o.ring
                ? "filter:" + ringFilter(o.ring, Math.max(2, w * 0.03))
                : "") +
              '"><div class="pic" style="' +
              picture +
              cut +
              '"></div></div>';
          } else {
            // A framed rectangle, ringed the same way when a pawn emotes
            // it (great-wave: the first rectangle a video used, 2026-10-30).
            el.innerHTML =
              '<div class="pic" style="' +
              box +
              picture +
              (o.ring
                ? "filter:" + ringFilter(o.ring, Math.max(2, w * 0.03))
                : "") +
              '"></div>';
          }

          el.innerHTML = redrawSvg(o, esc);

              Math.max(2, el.clientWidth * 0.025),
            );
          }

            whenever it is drawn: shock shakes and punches in, dying out;
            laugh bounces; stare creeps in for the whole clip.
          */
          const t = o.t;

          let emo = "";
          if (o.motion === "shock") {
            const die = 1 - span(t, 0, 0.7);
            move =
              "translateX(" +
              5 * die * Math.sin(t * Math.PI * 2 * 11) +

          } else if (o.motion === "laugh") {

              6 * Math.sin(t * Math.PI * 3.2) +
              "deg)";

            '<div class="face"><img src="' +
            esc(o.portrait) +
            '" />' +
            (emo ? '<div class="emo">' + emo + "</div>" : "") +
            "</div>" +
            (o.text ? '<div class="label">' + esc(o.text) + "</div>" : "");
        } else if (o.draw === "loading") {
          el.className = "loading" + (o.error ? " error" : "");

              : "CAPTURE LOADING " + o.percent + "%") +
            '</div><div class="bar"><div class="fill" style="width:' +

            n(o.before) +

            esc(o.label) +

        const over = () =>
          el.scrollWidth > el.clientWidth || el.scrollHeight > el.clientHeight;

          fits: !over(),
          room,
          size,
          floor,
          needs: [el.scrollWidth, el.scrollHeight],
          has: [el.clientWidth, el.clientHeight],

          el.querySelector(sel).style.transform = move;
