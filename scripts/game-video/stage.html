        </div>
        <div class="how" id="endHow"></div>
        <div class="cta">wallgame<span class="dot">.</span>io</div>
        <div class="cta2" id="endCta2">free · no account · play in one tap</div>
      </div>

      <!--
        The track name used to appear here so four comparison renders could be
        told apart on screen. That comparison is over, and a viewer has no use
        for it - the filename carries it now.
      -->
      <div id="brand" class="hidden">wallgame.io</div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const show = (el, on) => el.classList.toggle("hidden", !on);

      /**
       * How far into the VS segment the mark punches down, as a fraction.
       *
       * The renderer reads this to line the sting's impact up with the visual
       * one. It is published rather than copied, so the sound cannot drift
       * away from the picture when the animation is retimed.
       */
      window.__VS_PUNCH_FRACTION = 0.55;
      /** How long the punch takes, as a fraction of the same segment. */
      window.__VS_PUNCH_DURATION = 0.26;
      /**
       * The VS overlay's timing, in seconds: the whole of it, the entry the
       * VS screen's 0..1 animation is stretched over, and the exit. The
       * renderer reads it to place the overlay frames and the punch sound,
       * and plays the first move only once the exit starts. Nil, 2026-10-26:
       * 3.0 s was "still too crowded and fast"; at 4.0 the words stand still
       * for about 2.5 s.
       */
      window.__VS_OVERLAY = { seconds: 4.0, entry: 1.6, exit: 0.6 };

      /**
       * The three endings of the wallz look, one frame at a time.
       *
       * Nil, 2026-10-26: the colour flood looked like a copy of WallzGame, so
       * the video ends in one of these instead, in Wall Game's own language:
       *
       *   replay  an instant replay: the camera cuts back to the position
       *           before the last move, pushes in on the capture cell while
       *           the two real screenshots dissolve in slow motion, and a
       *           stamp lands.
       *   gg      a freeze frame: a flash, a shake, cracks out of the capture
       *           cell, the board goes grey, and our winner card slides up.
       *   ko      a knockout: the loser's pawn spins off the board and the
       *           winner's banner, the VS screen's own, slides in.
       *
       * Each ending publishes its length, its hold and the second of its
       * impact here. The renderer reads them, and the finish sound lands on
       * the impact, so the sound cannot drift off the picture when an ending
       * is retimed.
       *
       * e = { kind, t: seconds into the ending, at: {x, y} the capture cell
       *       in the board image (0..1), cell: one cell's width (0..1),
       *       before: the board image before the last move, stamp, how,
       *       winner, loser }
       */
      window.__ENDINGS = {
        replay: { seconds: 2.0, impact: 1.4, hold: 1.3, flash: 0 },
        gg: { seconds: 1.0, impact: 0, hold: 1.6, flash: 0.18 },
        ko: { seconds: 1.0, impact: 0, hold: 1.5, flash: 0.12 },
      };
      /*
        window.__TEXT_TIMING: how long text takes to come in and go out
        (overlays.mjs TEXT_TIMING), set by the renderer before any frame.
      */

      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const easeOut3 = (x) => 1 - Math.pow(1 - x, 3);
      const easeInOut3 = (x) =>
        x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      /** Progress of `t` through the window [from, to], 0..1. */
      const span = (t, from, to) => clamp01((t - from) / (to - from));
      /** The VS mark's punch: lands big, overshoots once, settles at 1. */
      const punch = (p) =>
        p >= 1 ? 1 : 1.9 - 0.9 * easeOut3(p) - 0.14 * Math.sin(p * Math.PI);
      /** The size a punch starts at, for the renderer's room check. */
      window.__PUNCH_FROM = punch(0);

      /**
       * A long name shrinks until it fits, instead of ending in "...". The
       * room a name gets depends on the frame and the portrait size, so it is
       * measured here, not predicted. Seen 2026-10-26: the 9:16 frame cut
       * "Guest Cormorant" to "Guest Cormor...".
       */
      const fitName = (el) => {
        el.style.fontSize = "";
        let size = parseFloat(getComputedStyle(el).fontSize);
        const floor = size * 0.6;
        while (el.scrollWidth > el.clientWidth && size > floor) {
          size = Math.max(floor, size - 2);
          el.style.fontSize = size + "px";
        }
      };

      /**
       * Cracks out of a point, in a 1000x1000 box over the board. The rays
       * come from fixed formulas, not a random source, so every render of a
       * game cracks the same way.
       */
      const paintCracks = (x, y, drawn) => {
        const svg = $("crack");
        const key = x + "/" + y;
        if (svg.dataset.key !== key) {
          svg.dataset.key = key;
          const rays = [];
          for (let i = 0; i < 9; i += 1) {
            let a = (i / 9) * Math.PI * 2 + Math.sin(i * 12.9898) * 0.35;
            let px = x * 1000;
            let py = y * 1000;
            const len = 260 + 220 * Math.abs(Math.sin(i * 78.233));
            const pts = [[px, py]];
            for (let k = 1; k <= 6; k += 1) {
              a += Math.sin(i * 3.1 + k * 1.7) * 0.35;
              px += (Math.cos(a) * len) / 6;
              py += (Math.sin(a) * len) / 6;
              pts.push([px, py]);
            }
            rays.push(pts.map((p) => p.join(",")).join(" "));
          }
          svg.innerHTML = rays
            .map(
              (pts) =>
                `<polyline points="${pts}" pathLength="1" fill="none" stroke="rgba(11,15,28,0.85)" stroke-width="9" stroke-linejoin="round" stroke-dasharray="1"/>` +
                `<polyline points="${pts}" pathLength="1" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="1"/>`,
            )
            .join("");
        }
        for (const line of svg.children) {
          line.setAttribute("stroke-dashoffset", String(1 - drawn));
        }
      };

      /**
       * The close-call beat on the mouse, one frame at a time.
       *
       *   scared  the cat is close: the mouse trembles, sweats, and a "!"
       *           bubble pops over it.
       *   laugh   a wall has saved it: the mouse bounces and a 😂 bubble pops.
       *
       * b = { kind, t: seconds into the beat, board: the screenshot under it,
       *       cell: {x, y} the mouse's cell centre in the board image (0..1),
       *       size: one cell's pitch, its gap included (0..1), the box
       *       the bubble and the drop sit around,
       *       cellSize: one cell's width without its gap (0..1), the window
       *       the crop moves in,
       *       under: the cell's own colour, under the crop: the strip its
       *       motion uncovers shows the cell, not the still pawn,
       *       side: where the bubble goes, up | right | left | down, chosen
       *       by the renderer away from the other pawns }
       */
      const paintBeat = (b) => {
        const fx = $("pawnFx");
        show(fx, !!b);
        if (!b) return;
        const W = $("boardWrap").clientWidth;
        const px = b.size * W;
        const left = (b.cell.x - b.size / 2) * W;
        const top = (b.cell.y - b.size / 2) * W;
        fx.style.left = left + "px";
        fx.style.top = top + "px";
        fx.style.width = px + "px";
        fx.style.height = px + "px";
        const inset = ((b.size - b.cellSize) / 2) * W;
        $("pawnWin").style.inset = inset + "px";
        $("pawnWin").style.background = b.under;
        const crop = $("pawnCrop");
        crop.style.backgroundImage = "url('" + b.board + "')";
        crop.style.backgroundSize = W + "px " + W + "px";
        crop.style.backgroundPosition =
          -(left + inset) + "px " + -(top + inset) + "px";

        const phase = b.t * 30;
        const bubble = $("pawnBubble");
        // Next to the mouse, on the side the renderer measured to be clear.
        const across = b.side === "left" || b.side === "right";
        bubble.style.top = b.side === "down" ? "105%" : across ? "50%" : "auto";
        bubble.style.bottom = b.side === "up" ? "105%" : "auto";
        bubble.style.left =
          b.side === "right" ? "105%" : across ? "auto" : "50%";
        bubble.style.right = b.side === "left" ? "105%" : "auto";
        bubble.style.fontSize = px * 0.42 + "px";
        bubble.style.padding = "0.18em 0.42em";
        const pop = punch(span(b.t, 0, 0.18));
        bubble.style.transform =
          (across ? "translateY(-50%)" : "translateX(-50%)") +
          " scale(" +
          pop +
          ")";
        const sweat = $("pawnSweat");

        if (b.kind === "scared") {
          /*
            Its own size, never enlarged: the window would cut the art. The
            strip its shake uncovers shows the cell's own colour (b.under):
            some skins' art reaches within 1% of the cell's edge
            (2026-10-29, the 85 mouse skins measured).
          */
          crop.style.transform =
            "translate(" +
            Math.sin(phase * 2.7) * px * 0.04 +
            "px," +
            Math.cos(phase * 3.3) * px * 0.03 +
            "px)";
          bubble.textContent = "!";
          show(sweat, true);
          // A drop that slides down the face and starts again, twice a second.
          const cycle = (b.t * 2) % 1;
          sweat.style.fontSize = px * 0.3 + "px";
          /*
            The drop is always on the right: the emoji's drops fly off to
            the right, so on the right side they read as sweat off the face
            (Nil, 2026-10-26: "the sweat looks like its pouring to the
            right, but it appears on the left side of the mouse").
          */
          sweat.style.left = "78%";
          sweat.style.top = -5 + cycle * 30 + "%";
          sweat.style.opacity = 1 - cycle * 0.8;
        } else {
          /*
            Small hops with a wobble, at its own size, as the scared shake:
            an enlarged hop is cut by the window (2026-10-29). What the hop
            uncovers is the cell's own colour, never the still pawn (seen
            twice on 2026-10-26, at 22% of a cell).
          */
          const hop = Math.abs(Math.sin(b.t * Math.PI * 3.2));
          crop.style.transform =
            "translateY(" +
            -hop * px * 0.05 +
            "px) rotate(" +
            Math.sin(phase * 0.9) * 6 +
            "deg)";
          bubble.textContent = "😂";
          show(sweat, false);
        }
      };

      /**
       * An EDL stamp in the middle of the game: the word punches in like the
       * VS mark and fades over its last quarter second (__TEXT_TIMING).
       *   m = { text, t: seconds into the stamp, seconds: its length,
       *         at: {x, y} its centre on the board image (0..1), where the
       *         renderer measured it to cover the least of the move,
       *         fit: its size, 1 or less so a long word fits the board,
       *         pop: the size its slam starts at, from 1 to __PUNCH_FROM:
       *         the largest at which it covers nothing new }
       */
      const paintMidStamp = (m) => {
        const el = $("midStamp");
        show(el, !!m);
        if (!m) return;
        el.textContent = m.text;
        el.style.left = m.at.x * 100 + "%";
        el.style.top = m.at.y * 100 + "%";
        const { stampPunch, stampFade } = window.__TEXT_TIMING;
        el.style.opacity = 1 - span(m.t, m.seconds - stampFade, m.seconds);
        el.style.transform =
          "translate(-50%,-50%) rotate(-8deg) scale(" +
          (1 +
            ((punch(span(m.t, 0, stampPunch)) - 1) * (m.pop - 1)) /
              (window.__PUNCH_FROM - 1)) *
            m.fit +
          ")";
      };

      /**
       * The colour of a cell where no pawn is drawn, read from the board
       * image (a data: URL, so the canvas may read it): the median of a ring
       * of pixels one pixel inside the cell's edge, its round corners left
       * out. A pawn's art can reach that ring at a few points only, so the
       * median is the cell's own colour, its highlight included.
       *   box = { x0, y0, x1, y1 } the cell in the image (0..1)
       */
      window.__cellColour = async (url, box) => {
        const img = new Image();
        img.src = url;
        await img.decode();
        const W = img.naturalWidth;
        const H = img.naturalHeight;
        const x0 = Math.round(box.x0 * W) + 1;
        const y0 = Math.round(box.y0 * H) + 1;
        const x1 = Math.round(box.x1 * W) - 2;
        const y1 = Math.round(box.y1 * H) - 2;
        const canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        const g = canvas.getContext("2d");
        g.drawImage(img, 0, 0);
        const d = g.getImageData(0, 0, W, H).data;
        const cut = Math.ceil((x1 - x0) * 0.25);
        const ring = [];
        const at = (x, y) => ring.push((y * W + x) * 4);
        for (let x = x0 + cut; x <= x1 - cut; x += 1) (at(x, y0), at(x, y1));
        for (let y = y0 + cut; y <= y1 - cut; y += 1) (at(x0, y), at(x1, y));
        const median = (k) => {
          const v = ring.map((i) => d[i + k]).sort((a, b) => a - b);
          return v[Math.floor(v.length / 2)];
        };
        return "rgb(" + median(0) + "," + median(1) + "," + median(2) + ")";
      };

      /**
       * A pawn as a picture with a clear background: the board image's
       * `box` (0..1) with the colour `key` ("rgb(r,g,b)", its cell's colour
       * as __cellColour reads it) made clear, with a soft edge so the art
       * keeps its outline: { png: a PNG data: URL, art: the box of its
       * opaque pixels, as shares of the picture }.
       */
      window.__pawnSprite = async (url, box, key) => {
        const img = new Image();
        img.src = url;
        await img.decode();
        const W = img.naturalWidth;
        const H = img.naturalHeight;
        const x0 = Math.round(box.x0 * W);
        const y0 = Math.round(box.y0 * H);
        const w = Math.round((box.x1 - box.x0) * W);
        const h = Math.round((box.y1 - box.y0) * H);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const g = canvas.getContext("2d");
        g.drawImage(img, x0, y0, w, h, 0, 0, w, h);
        const data = g.getImageData(0, 0, w, h);
        const d = data.data;
        const bg = key.match(/\d+/g).map(Number);
        const SOFT = 24;
        for (let i = 0; i < d.length; i += 4) {
          const far =
            Math.abs(d[i] - bg[0]) +
            Math.abs(d[i + 1] - bg[1]) +
            Math.abs(d[i + 2] - bg[2]);
          d[i + 3] = Math.round(
            d[i + 3] * Math.max(0, Math.min(1, (far - SOFT) / SOFT)),
          );
        }
        g.putImageData(data, 0, 0);
        // The art's own box, the clear margin left out, as shares of the
        // picture: what an overlay must not cover.
        let ax0 = w;
        let ay0 = h;
        let ax1 = 0;
        let ay1 = 0;
        for (let y = 0; y < h; y += 1) {
          for (let x = 0; x < w; x += 1) {
            if (d[(y * w + x) * 4 + 3] < 128) continue;
            ax0 = Math.min(ax0, x);
            ay0 = Math.min(ay0, y);
            ax1 = Math.max(ax1, x + 1);
            ay1 = Math.max(ay1, y + 1);
          }
        }
        return {
          png: canvas.toDataURL("image/png"),
          art: { x0: ax0 / w, y0: ay0 / h, x1: ax1 / w, y1: ay1 / h },
        };
      };

      /**
       * The capture picture (render-game-video.mjs CAPTURE_INSIDE,
       * CAPTURE_POUNCE): c = { cell, mouse, cat: boxes {x, y, w, h} in the
       * board image (0..1); under: the capture cell's colour; mouseSrc,
       * catSrc: the two pawns' pictures (mouseSrc null when a ko ending
       * has thrown the caught pawn off); pounce: 0..1, how far the catcher
       * has landed }.
       */
      const paintCapture = (c) => {
        const fx = $("captureFx");
        show(fx, !!c);
        if (!c) return;
        const W = $("boardWrap").clientWidth;
        const place = (el, b) => {
          el.style.left = b.x * W + "px";
          el.style.top = b.y * W + "px";
          el.style.width = b.w * W + "px";
          el.style.height = b.h * W + "px";
        };
        place($("capUnder"), c.cell);
        $("capUnder").style.background = c.under;
        // A ko ending throws the caught pawn off the board: it is not here.
        show($("capMouse"), !!c.mouseSrc);
        if (c.mouseSrc) {
          place($("capMouse"), c.mouse);
          $("capMouse").src = c.mouseSrc;
        }
        place($("capCat"), c.cat);
        $("capCat").src = c.catSrc;
        // It grows from its feet to its box, never past it, so the pounce
        // covers only what the renderer measured.
        const p = easeOut3(clamp01(c.pounce));
        $("capCat").style.transformOrigin = "50% 100%";
        $("capCat").style.transform = "scale(" + (0.55 + 0.45 * p) + ")";
      };

      /**
       * The box a stamp word covers at rest (after its punch) at full size,
       * as a share of the board's width and height, so the renderer can
       * size it and place it where it hides the least of the move (audit
       * item 4).
       */
      window.__stampBox = (text) => {
        paintMidStamp({
          text,
          t: 0.25,
          seconds: 1,
          at: { x: 0.5, y: 0.5 },
          fit: 1,
          pop: 1,
        });
        const r = $("midStamp").getBoundingClientRect();
        const b = $("boardWrap").getBoundingClientRect();
        paintMidStamp(null);
        return { w: r.width / b.width, h: r.height / b.height };
      };

      /**
       * The box an element covers over a whole motion, as {x, y, w, h}
       * shares of the board, the camera's zoom left out: the union of its
       * boxes when `paint` draws `c` at each time of `ts` (seconds, the
       * frames it plays), where it shows. A pop grows past the rest size,
       * so one time is not enough (Video Reviewer 1, review 64).
       */
      const boxOver = (paint, el, c, ts) => {
        const cam = $("boardCam");
        const zoom = cam.style.transform;
        cam.style.transform = "none";
        const b = $("boardWrap").getBoundingClientRect();
        let x0 = Infinity;
        let y0 = Infinity;
        let x1 = -Infinity;
        let y1 = -Infinity;
        for (const t of ts) {
          paint({ ...c, t });
          // A faded element covers nothing.
          if (Number(getComputedStyle(el).opacity) < 0.05) continue;
          const r = el.getBoundingClientRect();
          x0 = Math.min(x0, r.left);
          y0 = Math.min(y0, r.top);
          x1 = Math.max(x1, r.right);
          y1 = Math.max(y1, r.bottom);
        }
        paint(null);
        cam.style.transform = zoom;
        // A wrong length or a new fade must not pass as "covers nothing"
        // (Video Reviewer 1, review 66).
        if (x0 === Infinity) {
          throw new Error(
            "the " + el.id + " never shows over its " + ts.length + " frames",
          );
        }
        return {
          x: (x0 - b.left) / b.width,
          y: (y0 - b.top) / b.height,
          w: (x1 - x0) / b.width,
          h: (y1 - y0) / b.height,
        };
      };

      /**
       * The box a react, blunder or brilliant mark (paintCellFx's `c`)
       * covers over the times `ts` (boxOver), so the renderer can put it on
       * a side where it covers no wall.
       */
      window.__cellFxBox = (c, ts) =>
        boxOver(
          paintCellFx,
          $(c.kind === "react" ? "cellEmoji" : "cellBadge"),
          c,
          ts,
        );

      /**
       * The box a scared or laughing mouse's bubble (paintBeat's `b`) covers
       * over the times `ts` (boxOver), for the same reason.
       */
      window.__beatBox = (b, ts) => boxOver(paintBeat, $("pawnBubble"), b, ts);

      /**
       * Place a bubble next to a cell-sized box, on the side the renderer
       * measured to be clear (as the mouse beat's bubble), popped by `pop`.
       */
      const placeBubble = (el, side, pop) => {
        const across = side === "left" || side === "right";
        el.style.top = side === "down" ? "105%" : across ? "50%" : "auto";
        el.style.bottom = side === "up" ? "105%" : "auto";
        el.style.left = side === "right" ? "105%" : across ? "auto" : "50%";
        el.style.right = side === "left" ? "105%" : "auto";
        el.style.transform =
          (across ? "translateY(-50%)" : "translateX(-50%)") +
          " scale(" +
          pop +
          ")";
      };

      /** Rays out of the middle of a 400x400 box, from fixed formulas. */
      const burstRays = (n, inner, outer, width, color) => {
        let out = "";
        for (let i = 0; i < n; i += 1) {
          const a = (i / n) * Math.PI * 2 + Math.sin(i * 7.31) * 0.12;
          const long = i % 2 === 0 ? 1 : 0.7;
          const x1 = Math.cos(a) * inner;
          const y1 = Math.sin(a) * inner;
          const x2 = Math.cos(a) * outer * long;
          const y2 = Math.sin(a) * outer * long;
          out +=
            '<line x1="' +
            x1 +
            '" y1="' +
            y1 +
            '" x2="' +
            x2 +
            '" y2="' +
            y2 +
            '" stroke="' +
            color +
            '" stroke-width="' +
            width +
            '" stroke-linecap="round"/>';
        }
        return out;
      };

      /**
       * A moment on one cell, one frame at a time.
       *
       *   blunder    a red ring and a "??" bubble. The renderer adds the red
       *              flash (fxFlash) and the shake (s.shake).
       *   brilliant  a burst of rays and a ring out of the cell, and a "!!"
       *              bubble.
       *   react      an emoji pops once NEXT TO the cell, on the side the
       *              renderer measured to be clear, so it never covers the
       *              pawn it reacts to, and kept inside the board (Wall Game
       *              PM, 2026-10-26: it covered the pawn, hung off the h-file,
       *              and its trailing copies read as artifacts).
       *
       * c = { kind, t: seconds into it, cell: {x, y} the cell centre in the
       *       board image (0..1), size: one cell's width (0..1), side: where
       *       the bubble goes, emoji: the react's character }
       */
      const paintCellFx = (c) => {
        const fx = $("cellFx");
        show(fx, !!c);
        if (!c) return;
        const W = $("boardWrap").clientWidth;
        const px = c.size * W;
        fx.style.left = (c.cell.x - c.size / 2) * W + "px";
        fx.style.top = (c.cell.y - c.size / 2) * W + "px";
        fx.style.width = px + "px";
        fx.style.height = px + "px";
        const ring = $("cellRing");
        const badge = $("cellBadge");
        const burst = $("cellBurst");
        const emoji = $("cellEmoji");
        show(ring, c.kind !== "react");
        show(badge, c.kind !== "react");
        show(burst, c.kind === "brilliant");
        show(emoji, c.kind === "react");
        badge.style.fontSize = px * 0.6 + "px";
        badge.style.padding = "0.12em 0.36em 0.12em 0.3em";
        const pop = punch(span(c.t, 0, 0.2));

        if (c.kind === "blunder") {
          ring.style.borderWidth = px * 0.09 + "px";
          ring.style.borderColor = "#ef4444";
          ring.style.boxShadow = "0 0 " + px * 0.25 + "px #ef4444";
          ring.style.opacity = 1;
          ring.style.transform = "scale(" + pop + ")";
          badge.textContent = "??";
          badge.style.background = "#dc2626";
          placeBubble(badge, c.side, pop);
        }

        if (c.kind === "brilliant") {
          const out = easeOut3(span(c.t, 0, 0.55));
          ring.style.borderWidth = px * 0.07 + "px";
          ring.style.borderColor = "#2dd4bf";
          ring.style.boxShadow = "0 0 " + px * 0.3 + "px #2dd4bf";
          ring.style.transform = "scale(" + (1 + 1.3 * out) + ")";
          ring.style.opacity = 1 - out;
          burst.innerHTML = burstRays(
            14,
            60 + 70 * out,
            80 + 120 * out,
            10,
            "#5eead4",
          );
          burst.style.opacity = 1 - span(c.t, 0.45, 0.9);
          badge.textContent = "!!";
          badge.style.background = "#0d9488";
          placeBubble(badge, c.side, pop);
        }

        if (c.kind === "react") {
          // One cell over, on the clear side; the centre is then clamped so
          // the emoji at its largest stays inside the board's square.
          const [dx, dy] = {
            up: [0, -1],
            down: [0, 1],
            left: [-1, 0],
            right: [1, 0],
          }[c.side];
          const most = 1.15;
          const half = (px * 0.95 * most) / 2;
          const clamp = (v) => Math.max(half, Math.min(W - half, v));
          const x = clamp(c.cell.x * W + dx * px) - c.cell.x * W;
          const y = clamp(c.cell.y * W + dy * px) - c.cell.y * W;
          // A clean pop: grows past full size, settles, holds, fades.
          const grow =
            c.t < 0.18
              ? 0.4 + (most - 0.4) * easeOut3(c.t / 0.18)
              : most - (most - 1) * easeOut3(span(c.t, 0.18, 0.32));
          emoji.textContent = c.emoji;
          emoji.style.fontSize = px * 0.95 + "px";
          emoji.style.transform =
            "translate(calc(-50% + " +
            x +
            "px), calc(-50% + " +
            y +
            "px)) rotate(" +
            Math.sin(c.t * 7) * 6 +
            "deg) scale(" +
            grow +
            ")";
          emoji.style.opacity = 1 - span(c.t, 1.0, 1.2);
        }
      };

      /**
       * A trap: the walls that shut a pawn in light up, pulse, and stay lit
       * while the renderer stamps its word over them.
       *   tr = { t: seconds into it, walls: [[x1, y1, x2, y2]] in the board
       *          image (0..1), lit: true to skip the light-up (the cold
       *          open cuts in on walls that are already lit) }
       */
      /**
       * A hunter's walk (edl.mjs "path"): p = { cell, pawns, lines: [{
       * hex, points, holes, steps, drawn, alpha }] }, points, holes (the
       * cells on the walk where another pawn stands) and the cell's size as
       * fractions of the board, from the hunter to its target. p.pawns is
       * every pawn the board shows, as the page drew it ({x, y, w, h}):
       * render-game-video.mjs playState adds it to every path, so it is
       * read as given. Each line is a dotted trail in its hunter's colour
       * (hex), drawn from the hunter up to `drawn` of its length, with no
       * dot on a pawn: not on the hunter's cell, the target's or a hole
       * (Nil, 2026-10-28: overlays never cover the pawns). Once whole it
       * shows its steps in a disc beside the target: across the walk's last
       * step (towards the board's middle first), or else ahead of it, on
       * the first side that is on the board, off the walk and off every
       * pawn, so the disc covers neither the target nor the walk. Returns
       * the whole walks whose number found no such side (the lint's
       * walk-number-crowded), as { steps, hex }.
       */
      const DOT_GAP = 52;
      /** The number's disc: its radius in cells, its dark ring in board units (1000 a board). */
      const DISC_R = 0.3;
      const DISC_RING = 8;
      const paintPath = (p) => {
        const svg = $("pathSvg");
        show(svg, !!p);
        const crowded = [];
        if (!p) return crowded;
        const k = (v) => (v * 1000).toFixed(1);
        svg.innerHTML = p.lines
          .filter((l) => l.alpha > 0 && l.drawn > 0)
          .map((l) => {
            const seg = l.points.slice(1).map((q, i) => {
              const a = l.points[i];
              return Math.hypot(q.x - a.x, q.y - a.y);
            });
            let left = seg.reduce((x, y) => x + y, 0) * l.drawn;
            const pts = [l.points[0]];
            for (let i = 0; i < seg.length && left > 0; i++) {
              const a = l.points[i];
              const q = l.points[i + 1];
              const f = Math.min(1, left / seg[i]);
              pts.push({ x: a.x + (q.x - a.x) * f, y: a.y + (q.y - a.y) * f });
              left -= seg[i];
            }
            // A dot every DOT_GAP along the drawn part, from the hunter, as
            // a dash of 0 with round caps drew them; none on a cell where a
            // pawn stands: the hunter's, the target's and the holes (the
            // cells' centres), so the walk starts and ends at their edges.
            const holes = [
              l.points[0],
              l.points[l.points.length - 1],
              ...(l.holes ?? []),
            ];
            const dots = [];
            let next = 0;
            let run = 0;
            for (let i = 1; i < pts.length; i++) {
              const a = pts[i - 1];
              const q = pts[i];
              const len = Math.hypot((q.x - a.x) * 1000, (q.y - a.y) * 1000);
              for (; next <= run + len + 1e-6; next += DOT_GAP) {
                const f = len > 0 ? (next - run) / len : 0;
                const dot = {
                  x: a.x + (q.x - a.x) * f,
                  y: a.y + (q.y - a.y) * f,
                };
                const onPawn = holes.some(
                  (h) =>
                    Math.abs(dot.x - h.x) < p.cell / 2 &&
                    Math.abs(dot.y - h.y) < p.cell / 2,
                );
                if (!onPawn) dots.push(dot);
              }
              run += len;
            }
            const circles = (r, fill) =>
              dots
                .map(
                  (q) =>
                    '<circle cx="' +
                    k(q.x) +
                    '" cy="' +
                    k(q.y) +
                    '" r="' +
                    r +
                    '" fill="' +
                    fill +
                    '"/>',
                )
                .join("");
            const tip = l.points[l.points.length - 1];
            const prev = l.points[l.points.length - 2] ?? tip;
            const vertical =
              Math.abs(tip.y - prev.y) > Math.abs(tip.x - prev.x);
            const toMid = (v) => (v < 0.5 ? 1 : -1);
            const ahead = {
              x: Math.sign(tip.x - prev.x),
              y: Math.sign(tip.y - prev.y),
            };
            // Across the last step (towards the middle first), then ahead.
            const sides = (
              vertical
                ? [
                    { x: toMid(tip.x), y: 0 },
                    { x: -toMid(tip.x), y: 0 },
                  ]
                : [
                    { x: 0, y: toMid(tip.y) },
                    { x: 0, y: -toMid(tip.y) },
                  ]
            ).concat([ahead]);
            const away = (c) => (q) =>
              Math.hypot(q.x - c.x, q.y - c.y) > 0.3 * p.cell;
            const cellOf = (d) => ({
              x: tip.x + d.x * p.cell,
              y: tip.y + d.y * p.cell,
            });
            // No pawn in the number's cell (p.pawns: the board's pawns).
            const noPawn = (d) => p.pawns.every(away(cellOf(d)));
            const free = (d) => {
              const c = cellOf(d);
              return (
                c.x > 0 &&
                c.x < 1 &&
                c.y > 0 &&
                c.y < 1 &&
                l.points.every(away(c)) &&
                noPawn(d)
              );
            };
            const freeSide = sides.find(free);
            if (!freeSide && l.drawn >= 1) {
              crowded.push({ steps: l.steps, hex: l.hex });
            }
            const side = freeSide ?? sides.find(noPawn) ?? sides[0];
            // Clear of the walk's own target too: its pawn as the page
            // drew it (p.pawns' box), plus the disc and its ring, measured
            // (render vet, 2026-10-30: at a fixed 0.55 cell, the ring cut
            // the feet of the mouse below it by 7-8 px).
            const target = p.pawns.find((q) => !away(tip)(q));
            // The disc's outer edge: its radius and half its ring.
            const rim = DISC_R * p.cell + DISC_RING / 2 / 1000;
            const reach = target
              ? (side.x !== 0 ? target.w : target.h) / 2 + rim + 0.03 * p.cell
              : 0;
            const out = Math.max(0.55 * p.cell, reach);
            // Whole on the board, even on a side that faces its edge.
            const inside = (v) => Math.min(1 - rim, Math.max(rim, v));
            const end = {
              x: inside(tip.x + out * side.x),
              y: inside(tip.y + out * side.y),
            };
            const r = (DISC_R * p.cell * 1000).toFixed(1);
            const disc =
              l.drawn < 1
                ? ""
                : '<circle cx="' +
                  k(end.x) +
                  '" cy="' +
                  k(end.y) +
                  '" r="' +
                  r +
                  '" fill="' +
                  l.hex +
                  '" stroke="#0b0f1c" stroke-width="' +
                  DISC_RING +
                  '"/>' +
                  '<text x="' +
                  k(end.x) +
                  '" y="' +
                  k(end.y) +
                  '" dy="0.35em" text-anchor="middle" font-family="TikTok Sans, DejaVu Sans, sans-serif" font-weight="900" font-size="' +
                  (r * 1.1).toFixed(1) +
                  '" fill="#fff">' +
                  l.steps +
                  "</text>";
            return (
              '<g opacity="' +
              l.alpha +
              '">' +
              circles(20, "#0b0f1c") +
              circles(13.5, l.hex) +
              disc +
              "</g>"
            );
          })
          .join("");
        return crowded;
      };

      /**
       * An EDL overlay (overlays.mjs, render-game-video.mjs overlayFrame):
       * drawn from o.draw and the facts the renderer put in, at the box it
       * placed (o.place, 0..1 of the board). It pops in over its first
       * overlayPop (TEXT_TIMING) and fades by o.alpha. With no place yet
       * (the renderer places an overlay once its window closes), nothing
       * shows. The bar's caption place paints #frameBar instead, on the
       * caption's last line, with the caption hidden while it shows.
       */
      const ERROR_HIT_SECONDS = 0.3;
      const OVERLAY_FIT_FLOOR = 0.6;
      const paintOverlay = (o) => {
        const frame = !!o && o.place.where === "caption";
        const el = $(frame ? "frameBar" : "overlay");
        show($(frame ? "overlay" : "frameBar"), false);
        $("caption").style.visibility = frame ? "hidden" : "";
        show(el, !!o && o.place.where !== undefined);
        if (!o || o.place.where === undefined) return;
        const p = o.place;
        el.className = o.draw;
        let room = true;
        if (frame) {
          /*
            The board bar's size, centred on the caption's last line (its
            text sits at the bottom of its box), MEASURED in #play, which
            the shake moves with it; kept in the safe area's top and over
            the head row, or room is false and the renderer stops.
          */
          const board = $("boardWrap");
          const cap = $("caption");
          const w = p.w * board.offsetWidth;
          const h = p.h * board.offsetHeight;
          const line = parseFloat(getComputedStyle(cap).lineHeight);
          const ceiling = parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue(
              "--safe-top",
            ),
          );
          const hud = $("hud");
          const floor = hud.offsetHeight > 0 ? hud.offsetTop : board.offsetTop;
          const mid = cap.offsetTop + cap.offsetHeight - line / 2;
          const top = Math.max(ceiling, Math.min(mid - h / 2, floor - h));
          room = top >= ceiling && top + h <= floor;
          el.style.left = board.offsetLeft + p.x * board.offsetWidth + "px";
          el.style.top = top + "px";
          el.style.width = w + "px";
          el.style.height = h + "px";
        } else {
          el.style.left = p.x * 100 + "%";
          el.style.top = p.y * 100 + "%";
          el.style.width = p.w * 100 + "%";
          el.style.height = p.h * 100 + "%";
        }
        const pop = easeOut3(span(o.t, 0, window.__TEXT_TIMING.overlayPop));
        el.style.opacity = pop * o.alpha;
        // The save hits the loading bar: over ERROR_HIT_SECONDS the panel
        // shakes side to side, dying out, and the bar drains (Wall Game
        // Director, 2026-10-28: the save lands on screen, not only in text).
        const hit = o.error ? span(o.error.t, 0, ERROR_HIT_SECONDS) : 0;
        const shake = o.error
          ? 3 * (1 - hit) * Math.sin(o.error.t * Math.PI * 2 * 14)
          : 0;
        el.style.transform =
          "translateX(" + shake + "%) scale(" + (0.85 + 0.15 * pop) + ")";
        el.style.fontSize = "";
        // A clip at its small size (overlays.mjs `small`) draws its content
        // scaled with its box, before the fit measures it.
        if (p.scale !== 1) {
          el.style.fontSize =
            parseFloat(getComputedStyle(el).fontSize) * p.scale + "px";
        }
        // A reactor's motion goes on after the fit is measured: a transform
        // counts in the box's overflow, and the shake would shrink the line.
        let faceMove = null;
        const esc = (v) =>
          String(v).replace(/[&<>"]/g, (c) => "&#" + c.charCodeAt(0) + ";");
        if (o.draw === "whitebar") {
          el.innerHTML = "<div>" + esc(o.text) + "</div>";
        } else if (o.draw === "sequence") {
          // Its corner's edges: "bottom-right" stands it on the bottom and
          // pushes it right, toward the board's rim, not into the middle.
          const [v, h] = p.where.split("-");
          el.innerHTML =
            '<img src="' +
            esc(o.src) +
            '" style="object-position:' +
            h +
            " " +
            v +
            '" />';
        } else if (o.draw === "toast") {
          el.innerHTML =
            '<div class="dot"></div><div>' + esc(o.text) + "</div>";
        } else if (o.draw === "reactor") {
          /*
            Each motion is a pure function of t, so a frame is the same
            whenever it is drawn: shock shakes and punches in, dying out;
            laugh bounces; stare creeps in for the whole clip.
          */
          const t = o.t;
          let move = "";
          let emo = "";
          if (o.motion === "shock") {
            const die = 1 - span(t, 0, 0.7);
            move =
              "translateX(" +
              5 * die * Math.sin(t * Math.PI * 2 * 11) +
              "%) scale(" +
              (1 + 0.18 * easeOut3(span(t, 0, 0.12)) * (0.6 + 0.4 * die)) +
              ")";
            emo = "💦";
          } else if (o.motion === "laugh") {
            move =
              "translateY(" +
              -9 * Math.abs(Math.sin(t * Math.PI * 3.2)) +
              "%) rotate(" +
              6 * Math.sin(t * Math.PI * 3.2) +
              "deg)";
            emo = "😂";
          } else {
            move = "scale(" + (1 + 0.35 * span(t, 0, 2)) + ")";
          }
          faceMove = move;
          el.innerHTML =
            '<div class="face"><img src="' +
            esc(o.portrait) +
            '" />' +
            (emo ? '<div class="emo">' + emo + "</div>" : "") +
            "</div>" +
            (o.text ? '<div class="label">' + esc(o.text) + "</div>" : "");
        } else if (o.draw === "loading") {
          el.className = "loading" + (o.error ? " error" : "");
          el.innerHTML =
            "<div>" +
            (o.error
              ? "ERROR: CAPTURE FAILED"
              : "CAPTURE LOADING " + o.percent + "%") +
            '</div><div class="bar"><div class="fill" style="width:' +
            o.percent * (1 - easeOut3(hit)) +
            "%;background:" +
            (o.error ? "#ef4444" : esc(o.hex)) +
            '"></div></div>';
        } else if (o.draw === "compare") {
          const n = (v) =>
            '<span style="color:' + esc(o.hex) + '">' + esc(v) + "</span>";
          el.innerHTML =
            '<div class="nums">' +
            n(o.before) +
            '<span class="arrow">\u2192</span>' +
            n(o.after) +
            '</div><div class="label">' +
            esc(o.label) +
            "</div>";
        }
        // A line that does not fit its box shrinks until it does (a long
        // seat name), measured, down to OVERLAY_FIT_FLOOR of its size; one
        // that still does not fit is reported in __overlayFit, and the
        // renderer stops (placeOverlays) rather than draw it cut.
        const over = () =>
          el.scrollWidth > el.clientWidth || el.scrollHeight > el.clientHeight;
        let size = parseFloat(getComputedStyle(el).fontSize);
        const floor = size * OVERLAY_FIT_FLOOR;
        while (over() && size - 1 >= floor) {
          size -= 1;
          el.style.fontSize = size + "px";
        }
        window.__overlayFit = {
          fits: !over(),
          room,
          size,
          floor,
          needs: [el.scrollWidth, el.scrollHeight],
          has: [el.clientWidth, el.clientHeight],
        };
        if (faceMove) el.querySelector(".face").style.transform = faceMove;
      };

      /**
       * How far the overlay as painted now (after __stage) reaches past its
       * box, as shares of the box on each side ({top, right, bottom, left},
       * 0 or more): the union of its own box and every part in it that
       * paints (a picture as the box it is drawn in), their motion
       * included (overlays.mjs overlayPlaces `reach`). #boardWrap
       * cuts what passes the board's edge (Wall Game Director, 2026-10-29:
       * VX ply 14, the cat's ears and the 💦 cut flat).
       */
      window.__overlayReach = () => {
        const el = $("overlay");
        const wrap = $("boardWrap").getBoundingClientRect();
        const x0 = wrap.left + (parseFloat(el.style.left) / 100) * wrap.width;
        const y0 = wrap.top + (parseFloat(el.style.top) / 100) * wrap.height;
        const w = (parseFloat(el.style.width) / 100) * wrap.width;
        const h = (parseFloat(el.style.height) / 100) * wrap.height;
        let u = { left: x0, top: y0, right: x0 + w, bottom: y0 + h };
        // A picture shown with object-fit: contain fills only part of its
        // element: its drawn box, at the size that fits, centred as the
        // reactor's portrait is (a sequence's frames sit in a corner of
        // their element, which stays inside the overlay's box anyway).
        const drawn = (part) => {
          const r = part.getBoundingClientRect();
          if (part.tagName !== "IMG" || !part.naturalWidth) return r;
          const k = Math.min(
            r.width / part.naturalWidth,
            r.height / part.naturalHeight,
          );
          const w = part.naturalWidth * k;
          const h = part.naturalHeight * k;
          const left = r.left + (r.width - w) / 2;
          const top = r.top + (r.height - h) / 2;
          return {
            left,
            top,
            right: left + w,
            bottom: top + h,
            width: w,
            height: h,
          };
        };
        // A part that paints: a picture, its own text, a background or a
        // border. A bare container (the reactor's .face) paints nothing,
        // however its motion scales it.
        const paints = (part) => {
          const st = getComputedStyle(part);
          return (
            ["IMG", "svg"].includes(part.tagName) ||
            [...part.childNodes].some(
              (n) => n.nodeType === 3 && n.textContent.trim() !== "",
            ) ||
            st.backgroundColor !== "rgba(0, 0, 0, 0)" ||
            st.backgroundImage !== "none" ||
            parseFloat(st.borderTopWidth) > 0
          );
        };
        for (const part of el.querySelectorAll("*")) {
          if (!paints(part)) continue;
          const r = drawn(part);
          if (r.width === 0 || r.height === 0) continue;
          u = {
            left: Math.min(u.left, r.left),
            top: Math.min(u.top, r.top),
            right: Math.max(u.right, r.right),
            bottom: Math.max(u.bottom, r.bottom),
          };
        }
        return {
          top: (y0 - u.top) / h,
          right: (u.right - x0 - w) / w,
          bottom: (u.bottom - y0 - h) / h,
          left: (x0 - u.left) / w,
        };
      };

      const paintTrap = (tr) => {
        const svg = $("trapSvg");
        show(svg, !!tr);
        if (!tr) return;
        const on = tr.lit ? 1 : easeOut3(span(tr.t, 0, 0.15));
        const pulse = 0.65 + 0.35 * Math.cos(tr.t * Math.PI * 4);
        svg.innerHTML = tr.walls
          .map(([x1, y1, x2, y2]) => {
            const pts =
              'x1="' +
              x1 * 1000 +
              '" y1="' +
              y1 * 1000 +
              '" x2="' +
              x2 * 1000 +
              '" y2="' +
              y2 * 1000 +
              '"';
            return (
              "<line " +
              pts +
              ' stroke="#facc15" stroke-opacity="' +
              0.6 * on * pulse +
              '" stroke-width="64" stroke-linecap="round"/>' +
              "<line " +
              pts +
              ' stroke="#fef08a" stroke-opacity="' +
              on +
              '" stroke-width="22" stroke-linecap="round"/>'
            );
          })
          .join("");
      };

      /**
       * The head row: the race counter, or the goal line while the VS
       * overlay is in. Each is hidden with visibility, not display, so the
       * row keeps its height and the board does not move.
       *   r = { a: {word, hex, n, changed}, b: {...}, t: seconds since the
       *         move landed, flash: seconds into an EDL `race` flash, or
       *         absent }
       *   goal = the goal line to show instead, or null
       */
      /**
       * The head row: the race counter `r`, or the goal line `goal`, or the
       * credit c = { a: 0..1 }, which takes the race counter's place: the
       * counter fades out over the first half and the credit fades in over
       * the second, so the two never show at once. The credit's text is set
       * once, by __fitWallz. In a fast-forward (edl.mjs fastForward, audit
       * item 5) the counter's middle shows the tag, "▶▶ x3", in place of
       * "VS", so a quiet stretch reads as sped up and not as the game's real
       * pace; off the board, it covers no pawn (Wall Game Director,
       * 2026-10-29).
       */
      const paintHud = (r, goal, c, ff) => {
        $("raceTag").textContent = ff ? "▶\uFE0E▶\uFE0E " + ff : "VS";
        const a = c ? c.a : 0;
        const out = Math.min(1, 2 * a);
        const inn = Math.max(0, 2 * a - 1);
        $("race").style.visibility =
          r && !goal && out < 1 ? "visible" : "hidden";
        $("race").style.opacity = a > 0 ? String(1 - out) : "";
        $("goal").style.visibility = goal ? "visible" : "hidden";
        $("credit").style.visibility = inn > 0 ? "visible" : "hidden";
        $("credit").style.opacity = inn > 0 ? String(inn) : "";
        if (goal) $("goal").textContent = goal;
        if (!r) return;
        // The flash: the counter swells and glows, twice, over 0.8 s.
        const f =
          r.flash === undefined
            ? 0
            : Math.sin(span(r.flash, 0, 0.8) * Math.PI * 2) ** 2;
        $("race").style.transform = "scale(" + (1 + 0.18 * f) + ")";
        $("race").style.filter = f
          ? "drop-shadow(0 0 " + 18 * f + "px rgba(253, 224, 71, 0.9))"
          : "";
        for (const [k, p] of [
          ["a", r.a],
          ["b", r.b],
        ]) {
          const n = $("raceN" + k);
          const w = $("raceW" + k);
          n.textContent = String(p.n);
          n.style.color = p.hex;
          w.textContent = p.word;
          w.style.color = p.hex;
          const bump = p.changed ? punch(span(r.t, 0, 0.3)) : 1;
          n.style.transform = "scale(" + bump + ")";
        }
      };

      /**
       * Size the daily look's board to the safe area: what the caption and
       * the head row leave of it. MEASURED here, after the fonts are in and
       * the caption is set, so a two-line caption gives a smaller board and
       * no pixel budget is guessed. Called once per video by the renderer;
       * the result holds for every frame, because the caption and the head
       * row do not change size. With a payoff beat (edl.mjs) there are two
       * captions: the caption keeps the height of the taller one all video
       * long, so the board does not move when the beat changes. Returns the
       * board's side in px.
       */
      window.__fitWallz = async ({
        captions,
        hud,
        goal,
        raceLabel,
        credit,
        strip,
      }) => {
        $("root").classList.add("wallz");
        show($("play"), true);
        $("goal").textContent = goal ?? "";
        const root = document.documentElement.style;
        root.setProperty("--caption-h", "0px");
        let captionH = 0;
        for (const text of captions) {
          $("caption").textContent = text;
          // A font loads when text first uses it; measure only once it has.
          await document.fonts.ready;
          captionH = Math.max(captionH, $("caption").offsetHeight);
        }
        root.setProperty("--caption-h", captionH + "px");
        $("caption").textContent = captions[0] ?? "";
        await document.fonts.ready;
        $("hud").classList.toggle("on", hud || !!credit);
        $("race").querySelector(".vs small").textContent = raceLabel ?? "STEPS";
        // The race counter at its widest, for the head row's measure.
        $("raceNa").textContent = "88";
        $("raceNb").textContent = "88";
        $("raceWa").textContent = "BLUE";
        $("raceWb").textContent = "BLUE";
        const captionSize = parseFloat(
          getComputedStyle(document.documentElement).getPropertyValue(
            "--caption-size",
          ),
        );
        /*
          The goal line (the rules, during the VS overlay) on one line: it
          shrinks from its size until the page sets it on one line, measured
          (textLines), inside the height it has at full size (--goal-h), so
          the head row, and with it the board, keep their size.
        */
        let goalSize = captionSize * 0.62;
        const goalFloor = captionSize * 0.36;
        root.setProperty("--goal-size", goalSize + "px");
        // Its one-line height at full size holds the row while it shrinks.
        $("goal").textContent = "Ag";
        root.setProperty(
          "--goal-h",
          $("goal").getBoundingClientRect().height + "px",
        );
        $("goal").textContent = goal ?? "";
        while (goal && textLines($("goal")).lines > 1 && goalSize > goalFloor) {
          goalSize = Math.max(goalFloor, goalSize - 1);
          root.setProperty("--goal-size", goalSize + "px");
        }
        goalFits = !goal || textLines($("goal")).lines === 1;
        /*
          The credit, one line per entry of `credit`: it shrinks from half
          the caption size until every line fits the row's width, measured,
          not predicted from its length. One line may set the row's height,
          as it always did; several lines must fit in the height the counter
          gives the row, so the board does not get smaller for them. The
          credit is hidden, not absent, on every other frame, so it would
          grow the row there too, and the VS banners measure the row: the
          heights are compared unrounded, as the layout has them.
        */
        const heightOf = (el) => el.getBoundingClientRect().height;
        $("credit").textContent = "";
        const rowH = heightOf($("hud"));
        $("credit").textContent = credit?.join("\n") ?? "";
        let creditSize = captionSize * 0.5;
        const creditFloor = captionSize * 0.36;
        root.setProperty("--credit-size", creditSize + "px");
        const creditMisfits = () =>
          !!credit &&
          ($("credit").scrollWidth > $("credit").clientWidth ||
            (credit.length > 1 && heightOf($("credit")) > rowH));
        while (creditMisfits() && creditSize > creditFloor) {
          creditSize = Math.max(creditFloor, creditSize - 1);
          root.setProperty("--credit-size", creditSize + "px");
        }
        creditFits = !creditMisfits();
        const play = $("play");
        const cs = getComputedStyle(play);
        const width =
          play.clientWidth -
          parseFloat(cs.paddingLeft) -
          parseFloat(cs.paddingRight);
        const height =
          play.clientHeight -
          parseFloat(cs.paddingTop) -
          parseFloat(cs.paddingBottom);
        const gap = parseFloat(cs.rowGap);
        const used = [$("caption"), $("hud")]
          .filter((el) => el.offsetHeight > 0)
          .reduce((sum, el) => sum + el.offsetHeight + gap, 0);
        const board = Math.floor(Math.min(width, height - used));
        document.documentElement.style.setProperty("--board", board + "px");
        const r = $("boardWrap").getBoundingClientRect();
        document.documentElement.style.setProperty(
          "--board-mid",
          r.top + r.height / 2 + "px",
        );
        /*
          The players strip: one gap under the board, as the head row is one
          gap over it, and not above STRIP_AREA (--strip-area-top). It shrinks from three quarters of the caption size until its line
          fits STRIP_AREA's width, measured; at its floor, `stripFits` says
          whether it did.
        */
        $("strip").classList.toggle("on", !!strip);
        if (strip) {
          for (const [k, p] of [
            ["A", strip.a],
            ["B", strip.b],
          ]) {
            $("stripImg" + k).src = p.portrait;
            $("stripName" + k).textContent = p.name;
            $("stripName" + k).style.color = p.hex;
          }
          await Promise.all(
            [$("stripImgA"), $("stripImgB")].map((img) => img.decode()),
          );
          const areaTop = parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue(
              "--strip-area-top",
            ),
          );
          root.setProperty(
            "--strip-top",
            Math.max(r.bottom + gap, areaTop) + "px",
          );
          let stripSize = captionSize * 0.75;
          const stripFloor = captionSize * 0.36;
          root.setProperty("--strip-size", stripSize + "px");
          const row = $("strip").querySelector(".row");
          const tooWide = () => row.scrollWidth > $("strip").clientWidth;
          while (tooWide() && stripSize > stripFloor) {
            stripSize = Math.max(stripFloor, stripSize - 1);
            root.setProperty("--strip-size", stripSize + "px");
          }
          stripFits = !tooWide();
        }
        return board;
      };

      /**
       * The boxes a viewer must see, as the page lays them out at rest, for
       * the safe-area check: {x, y, w, h} rounded outward, and only the ones
       * this video shows.
       */
      window.__layoutBoxes = ({ captions, race, goal, credit, strip }) => {
        const box = (el) => {
          const r = el.getBoundingClientRect();
          const x = Math.floor(r.left);
          const y = Math.floor(r.top);
          return {
            x,
            y,
            w: Math.ceil(r.right) - x,
            h: Math.ceil(r.bottom) - y,
          };
        };
        const captionBox = (text) => {
          $("caption").textContent = text;
          const b = box($("caption"));
          $("caption").textContent = captions[0] ?? "";
          return b;
        };
        return {
          board: box($("boardWrap")),
          ...(captions[0] && { caption: captionBox(captions[0]) }),
          ...(captions[1] && { payoff: captionBox(captions[1]) }),
          ...(race && { race: box($("race")) }),
          ...(goal && { goalLine: box($("goal")) }),
          ...(credit && { credit: box($("credit")) }),
          ...(strip && { strip: box($("strip")) }),
        };
      };

      /**
       * A text as the page wraps it (a caption beat, the credit): { lines,
       * width } with the width of its widest line in px, MEASURED from the
       * text's own line
       * boxes (emoji widths vary, so a character count cannot tell). Text
       * runs in two fonts on one line can sit at different heights, so a
       * run joins a line when their middles are within half a run's height.
       */
      const textLines = (el) => {
        const range = document.createRange();
        range.selectNodeContents(el);
        const lines = [];
        for (const r of range.getClientRects()) {
          if (r.width === 0) continue;
          const mid = r.top + r.height / 2;
          const line = lines.find(
            (l) => Math.abs(l.mid - mid) < Math.min(l.height, r.height) / 2,
          );
          if (line) {
            line.left = Math.min(line.left, r.left);
            line.right = Math.max(line.right, r.right);
          } else {
            lines.push({
              mid,
              height: r.height,
              left: r.left,
              right: r.right,
            });
          }
        }
        return {
          lines: lines.length,
          width: Math.ceil(Math.max(0, ...lines.map((l) => l.right - l.left))),
        };
      };
      /** Each caption beat as the page wraps it (textLines). */
      window.__captionText = (captions) => {
        const el = $("caption");
        const out = captions.map((text) => {
          el.textContent = text;
          return textLines(el);
        });
        el.textContent = captions[0] ?? "";
        return out;
      };
      /** Whether the credit fitted its row at __fitWallz's last call. */
      let creditFits = true;
      /** Whether the goal line fitted on one line, and its size. */
      let goalFits = true;
      window.__goalFit = () => ({
        fits: goalFits,
        size: parseFloat(getComputedStyle($("goal")).fontSize),
      });
      /** Whether the players strip fitted on one line, and its size. */
      let stripFits = true;
      window.__stripFit = () => ({
        fits: stripFits,
        size: parseFloat(getComputedStyle($("strip")).fontSize),
      });
      /**
       * The credit as the page lays it out: { lines, width, size }, and
       * `fits`, false when it fits its row at no size down to its floor.
       */
      window.__creditText = () => ({
        ...textLines($("credit")),
        size: parseFloat(getComputedStyle($("credit")).fontSize),
        fits: creditFits,
      });

      /**
       * A filter on the board as the camera shows it: its image and the
       * capture picture over it, so the picture greys and darkens with the
       * board under an ending.
       */
      const boardFilter = (f) => {
        $("boardImg").style.filter = f;
        $("captureFx").style.filter = f;
      };

      /**
       * A freeze before a move lands: the position before it in grey, and a
       * pause mark. The renderer pushes the camera in (s.zoom).
       *   f = { t: seconds into it }
       */
      const paintFreeze = (f) => {
        show($("freezeBadge"), !!f);
        if (!f) return;
        const g = easeOut3(span(f.t, 0, 0.12));
        boardFilter("grayscale(" + g + ") contrast(" + (1 + 0.15 * g) + ")");
        $("freezeBadge").style.opacity = g;
      };

      const paintEnding = (e) => {
        for (const id of [
          "boardPrev",
          "replayBadge",
          "stamp",
          "crack",
          "flash",
          "ggCard",
          "koPawn",
          "koBanner",
        ]) {
          show($(id), false);
        }
        boardFilter("");
        $("boardWrap").style.transform = "";
        if (!e) return;
        const t = e.t;

        if (e.kind === "replay") {
          const push = easeInOut3(span(t, 0, 1.4));
          $("boardCam").style.transformOrigin =
            e.at.x * 100 + "% " + e.at.y * 100 + "%";
          $("boardCam").style.transform = "scale(" + (1 + 1.1 * push) + ")";
          show($("boardPrev"), true);
          $("boardPrev").src = e.before;
          $("boardPrev").style.opacity = 1 - span(t, 0.5, 1.4);
          show($("replayBadge"), true);
          $("replayBadge").querySelector(".dot").style.opacity =
            Math.floor(t * 3) % 2 === 0 ? 1 : 0.25;
          // A game won any other way than a catch or a home stamps no word.
          if (t >= 1.4 && e.stamp) {
            show($("stamp"), true);
            $("stamp").textContent = e.stamp;
            $("stamp").style.transform =
              "translate(-50%,-50%) rotate(-8deg) scale(" +
              punch(span(t, 1.4, 1.65)) +
              ")";
          }
        }

        if (e.kind === "gg") {
          const flash = window.__ENDINGS.gg.flash;
          show($("flash"), t < flash);
          $("flash").style.opacity = 0.85 * (1 - span(t, 0, flash));
          // Translation only, like the capture shake: a scale would not
          // come back to where it began.
          const k = 1 - span(t, 0, 0.5);
          const phase = t * 30;
          $("boardWrap").style.transform =
            "translate(" +
            Math.sin(phase * 7.3) * 18 * k +
            "px," +
            Math.cos(phase * 5.1) * 12 * k +
            "px)";
          show($("crack"), true);
          paintCracks(e.at.x, e.at.y, easeOut3(span(t, 0, 0.35)));
          const g = span(t, 0.15, 0.6);
          boardFilter(
            "grayscale(" + g + ") brightness(" + (1 - 0.55 * g) + ")",
          );
          if (t >= 0.55) {
            const p = easeOut3(span(t, 0.55, 0.95));
            show($("ggCard"), true);
            $("ggCard").style.opacity = p;
            // It grows in where it rests, never sliding: the ending's bar
            // may take the band below it (Wall Game Director, 2026-10-29).
            $("ggCard").style.transform =
              "translate(-50%, -50%) scale(" + (0.92 + 0.08 * p) + ")";
            $("ggAv").src = e.winner.portrait;
            $("ggName").textContent = e.winner.name;
            $("ggName").style.color = e.winner.hex;
            $("ggHow").textContent = e.how;
            fitName($("ggName"));
          }
        }

        if (e.kind === "ko") {
          boardFilter("brightness(" + (1 - 0.4 * span(t, 0, 0.4)) + ")");
          const flash = window.__ENDINGS.ko.flash;
          show($("flash"), t < flash);
          $("flash").style.opacity = 0.6 * (1 - span(t, 0, flash));
          if (t < 0.95) {
            // The loser's pawn, from the capture cell up and across the
            // frame, spinning and growing as it goes, off the far side.
            const r = $("boardWrap").getBoundingClientRect();
            const size = e.cell * r.width;
            const p = span(t, 0, 0.95);
            const dir = e.at.x < 0.5 ? 1 : -1;
            const x =
              r.x + e.at.x * r.width + dir * p * p * window.innerWidth * 0.9;
            const y =
              r.y +
              e.at.y * r.height -
              Math.sin(p * Math.PI * 0.6) * window.innerHeight * 0.45;
            show($("koPawn"), true);
            $("koPawn").src = e.loser.portrait;
            $("koPawn").style.width = size + "px";
            $("koPawn").style.height = size + "px";
            $("koPawn").style.transform =
              "translate(" +
              (x - size / 2) +
              "px," +
              (y - size / 2) +
              "px) rotate(" +
              dir * p * 900 +
              "deg) scale(" +
              (1 + 1.6 * p) +
              ")";
          }
          if (t >= 0.35) {
            const b = easeOut3(span(t, 0.35, 0.75));
            show($("koBanner"), true);
            $("koBanner").style.marginLeft = (1 - b) * -120 + "%";
            $("koBanner").style.background = e.winner.gradient;
            $("koImg").src = e.winner.portrait;
            $("koName").textContent = e.winner.name;
            fitName($("koName"));
          }
        }
      };

      const paintVs = (a, b, t, out) => {
        const ease = (x) => 1 - Math.pow(1 - x, 3);
        /*
          Banners fly in from opposite sides and settle.

          They are STAGGERED and they take their time. The first cut of this
          ran both in together over about a second and read as janky - two
          slabs arriving at once looks like a glitch rather than an
          introduction. Landing them one after the other, over roughly half
          again as long, reads as two players being announced.
        */
        const slideAt = (delay) =>
          ease(Math.max(0, Math.min(1, (t - delay) / 0.42)));
        // On the way out (the overlay only) each banner keeps going the
        // way it came, so it leaves rather than reverses.
        const leave = ease(out);
        $("beamTop").style.marginLeft =
          (1 - slideAt(0)) * -120 + leave * 120 + "%";
        $("beamBottom").style.marginLeft =
          (1 - slideAt(0.1)) * 120 - leave * 120 + "%";

        // The VS stamps down late and overshoots once - the loudest beat,
        // and the moment the sting is built to hit.
        const vp = Math.max(
          0,
          Math.min(
            1,
            (t - window.__VS_PUNCH_FRACTION) / window.__VS_PUNCH_DURATION,
          ),
        );
        const overshoot =
          vp < 1 ? 1.9 - 0.9 * ease(vp) - 0.14 * Math.sin(vp * Math.PI) : 1;
        $("vsMark").style.setProperty("--vs-scale", vp === 0 ? 0 : overshoot);
        $("vsMark").style.opacity = vp === 0 ? 0 : 1 - leave;

        // The bottom banner is mirrored, so its gradient is mirrored too -
        // otherwise it fades to dark exactly where its portrait sits.
        $("beamTop").style.background = a.gradient;
        $("beamBottom").style.background = b.gradientMirrored;
        $("vsImgA").src = a.portrait;
        $("vsImgB").src = b.portrait;
        for (const [beam, name, sub, p] of [
          [$("beamTop"), $("vsNameA"), $("vsSubA"), a],
          [$("beamBottom"), $("vsNameB"), $("vsSubB"), b],
        ]) {
          // `word` (the daily overlay) replaces the name with the daily name
          // (Bot or Human).
          beam.classList.toggle("word", !!p.word);
          beam.style.boxShadow = p.word
            ? "inset 0 14px 0 " + p.hex + ", inset 0 -14px 0 " + p.hex
            : "";
          name.textContent = p.word ?? p.name;
          name.style.color = p.word ? p.hex : "";
          fitName(name);
          sub.textContent = p.sub;
          show(sub, !p.word);
        }
      };

      /**
       * Paint one frame. Called once per screenshot by the renderer.
       *
       * `s.segment` picks which of the three layers is visible; `s.t` is a
       * 0..1 progress used only by the animated segments. Everything else is
       * data lifted from the game record or from a screenshot of the product.
       */
      window.__stage = (s) => {
        // The walks whose number found no free side (paintPath), for the
        // lint: none unless this frame paints a walk, so a VS or end frame
        // never reports a play frame's walks (Video Reviewer 1, review 88).
        window.__crowdedWalks = [];
        show($("vs"), s.segment === "vs");
        show($("play"), s.segment === "play");
        show($("end"), s.segment === "end");
        // No watermark in the daily look (audit item 8).
        show($("brand"), s.segment === "play" && s.look !== "wallz");
        /*
          The goal line holds the head row while the VS overlay is in and
          the game has not started; from the first move on, the race counter
          has it.
        */
        // The renderer shows the rules line through the opening walks.
        const goalNow = s.goal ?? null;
        $("root").classList.toggle("wallz", s.look === "wallz");
        $("vs").style.transform = "";

        if (s.segment === "vs") paintVs(s.a, s.b, s.t, 0);

        /*
          The VS overlay (Nil, 2026-10-26: an intro screen loses viewers, so
          the names fly in over the board while the game already plays). The
          same banners and mark as the VS screen, run over the first
          __VS_OVERLAY.entry seconds, then sliding off over the last
          __VS_OVERLAY.exit seconds.
        */
        if (s.segment === "play" && s.vsOverlay) {
          const o = s.vsOverlay;
          const v = window.__VS_OVERLAY;
          show($("vs"), true);
          paintVs(
            o.a,
            o.b,
            Math.min(1, o.t / v.entry),
            Math.max(0, Math.min(1, (o.t - (v.seconds - v.exit)) / v.exit)),
          );
          /*
            The banners never cover the caption or the head row (Wall Game
            PM, 2026-10-26: the top banner cut into "winning"). Their skew
            lifts one end, so the clearance is MEASURED: the overlay moves
            down until the top banner's box starts below both.
          */
          $("caption").textContent = s.caption ?? "";
          paintHud(s.race, goalNow, s.credit, s.fastForward);
          const above = [$("caption"), $("hud")]
            .filter((el) => el.offsetHeight > 0)
            .map((el) => el.getBoundingClientRect().bottom);
          if (above.length > 0) {
            const clear =
              Math.max(...above) +
              12 -
              $("beamTop").getBoundingClientRect().top;
            if (clear > 0) {
              $("vs").style.transform = "translateY(" + clear + "px)";
            }
          }
        }

        if (s.segment === "play") {
          $("boardImg").src = s.board;
          $("caption").textContent = s.caption ?? "";
          /*
            Camera punch-in: a scale about the point of the move. The origin is
            inside the board and the scale is never below 1, so the magnified
            board always covers its whole square and no edge shows.
          */
          const z = s.zoom;
          $("boardCam").style.transformOrigin = z
            ? z.x * 100 + "% " + z.y * 100 + "%"
            : "50% 50%";
          $("boardCam").style.transform = z ? "scale(" + z.scale + ")" : "none";
          paintBeat(s.beat);
          paintCapture(s.capture);
          paintMidStamp(s.midStamp);
          paintEnding(s.ending);
          paintCellFx(s.cellFx);
          paintTrap(s.trap);
          window.__crowdedWalks = paintPath(s.path);
          paintOverlay(s.overlay);
          paintHud(s.race, goalNow, s.credit, s.fastForward);
          paintFreeze(s.freeze);
          // The loop tail: a white flash fading into the first frame.
          if (s.rewind) {
            show($("flash"), true);
            $("flash").style.opacity = 0.85 * s.rewind;
          }
          show($("fxFlash"), !!s.flash);
          $("fxFlash").style.opacity = s.flash ?? 0;
          $("pAvT").src = s.top.portrait;
          $("pAvB").src = s.bottom.portrait;
          $("pNameT").textContent = s.top.name;
          $("pNameB").textContent = s.bottom.name;
          for (const [el, p] of [
            [$("pTagT"), s.top],
            [$("pTagB"), s.bottom],
          ]) {
            el.textContent = p.sub;
            el.style.color = p.hex;
            el.style.background = p.soft;
          }
          /*
            Screen shake: a decaying wobble.

            TRANSLATION AND ROTATION ONLY - NEVER SCALE. An earlier version
            scaled to 1.045 during the shake and reset to `none` after it, so
            the board settled 4.5% smaller than it started and the cut was
            visible as a jump. Scale is not a shake, it is a zoom, and a zoom
            that only exists during the effect cannot return to where it began.
            The composition is inset from the frame, so a translation never
            exposes an edge and no cover-up scale is needed.

            It moves #play, not #root, so the background stays put and only the
            board and plates shake against it.
          */
          const k = s.shake ?? 0;
          if (k > 0) {
            const amp = 16 * k;
            const dx = Math.sin(s.shakePhase * 7.3) * amp;
            const dy = Math.cos(s.shakePhase * 5.1) * amp * 0.7;
            const rot = Math.sin(s.shakePhase * 6.1) * 0.7 * k;
            $("play").style.transform =
              "translate(" + dx + "px," + dy + "px) rotate(" + rot + "deg)";
          } else {
            $("play").style.transform = "none";
          }
        } else {
          $("play").style.transform = "none";
        }

        if (s.segment === "end") {
          $("endAv").src = s.winner.portrait;
          $("endName").textContent = s.winner.name;
          $("endName").style.color = s.winner.hex;
          $("endHow").textContent = s.how;
          $("endKicker").textContent = s.kicker;
        }
        return true;
      };
    </script>
  </body>
</html>
