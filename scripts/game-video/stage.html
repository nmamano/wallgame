<!doctype html>
<!--
  The video stage for scripts/game-video/render-game-video.mjs.

  This page is a CANVAS FOR COMPOSITION, not a second renderer. It never draws a
  board, a pawn or a wall: every one of those arrives as a PNG that real Chrome
  screenshotted off the real replay page, so there is no artwork here that could
  disagree with the product. What this file owns is the parts the product has no
  opinion about - the aspect ratio, the VS screen, the name plates and the end
  card.

  The renderer sets window.__stage(state) and screenshots the viewport.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "StageSans";
        src: local("DejaVu Sans");
      }
      :root {
        --ink: #f8fafc;
        --dim: #94a3b8;
        --bg: #0b0f1c;
        --panel: #121a2e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        font-family: "Segoe UI", "DejaVu Sans", system-ui, sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 50% 34%,
            rgba(56, 78, 140, 0.32),
            transparent 62%
          ),
          var(--bg);
      }

      /* ---------- shared ---------- */
      .hidden {
        display: none !important;
      }

      /* ---------- the VS screen ---------- */
      /*
        Both of Nil's references share one structure: two skewed banners offset
        top-left and bottom-right, a portrait in each, and a heavy VS at the
        centre crossing the split. That is what these rules build. The skew is
        the diagonal split; the banners overshoot the frame on purpose so the
        cut edges are never visible.
      */
      #vs {
        position: absolute;
        inset: 0;
        /* Over the board when it plays as an overlay. */
        z-index: 2;
      }
      .beam {
        position: absolute;
        left: -12%;
        width: 124%;
        height: var(--beam-h);
        transform: skewY(-7deg);
        overflow: hidden;
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
      }
      #vs .beam.top {
        top: var(--beam-top);
      }
      #vs .beam.bottom {
        top: var(--beam-bottom);
      }
      /*
        The contents are un-skewed so faces and text stay upright while the
        banner tilts. The padding is measured from the beam's own overshoot
        (it starts at -12% and runs 124% wide), so a portrait sits inside the
        visible frame rather than off the edge of it.
      */
      .beam .inner {
        position: absolute;
        inset: 0;
        transform: skewY(7deg);
        display: flex;
        align-items: center;
        gap: 4%;
        padding: 0 16%;
      }
      #vs .beam.bottom .inner {
        flex-direction: row-reverse;
      }
      .beam .portrait {
        width: var(--portrait);
        height: var(--portrait);
        flex: none;
        object-fit: contain;
        filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.55));
      }
      .beam .who {
        min-width: 0;
      }
      .beam .name {
        font-size: var(--name-size);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.02;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #vs .beam.bottom .who {
        text-align: right;
      }
      /*
        The daily overlay names no player: it says which side is the AI and
        which the human, each word IN its side's colour (Nil, 2026-10-26: "AI
        (in Red) vs Human (in Blue)"), so the viewer links each word to its
        pieces. A light banner keeps both colours readable.
      */
      #vs .beam.word {
        background: linear-gradient(
          100deg,
          #ffffff 0%,
          #f1f5f9 62%,
          rgba(241, 245, 249, 0.88) 100%
        ) !important;
      }
      #vs .beam.word .name {
        font-size: calc(var(--name-size) * 1.4);
        text-shadow: 0 3px 0 rgba(15, 23, 42, 0.18);
      }
      .beam .sub {
        font-size: var(--sub-size);
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        opacity: 0.82;
        margin-top: 0.35em;
      }
      #vs .vsmark {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) scale(var(--vs-scale));
        font-size: var(--vs-size);
        font-weight: 900;
        font-style: italic;
        letter-spacing: -0.04em;
        color: #fff;
        text-shadow:
          0 0 0 #000,
          6px 6px 0 #0b0f1c,
          0 0 42px rgba(255, 214, 102, 0.85);
        -webkit-text-stroke: calc(var(--vs-size) * 0.055) #10182c;
        paint-order: stroke fill;
      }
      #vs .vsmark span {
        color: #ffd166;
      }

      /* ---------- the board segment ---------- */
      /*
        The bands above and below the board are not slack - the plates live in
        them, and the lower one also keeps the board clear of the caption and
        button furniture that TikTok and Shorts paint over the bottom of every
        video. What IS slack is anything past the plates, so the block is
        pushed up by the reserved chrome band rather than centred in the whole
        frame, and the plates are tall enough to carry the space they occupy.
      */
      #play {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--gap);
        padding-bottom: var(--chrome);
      }
      #play .plate {
        width: var(--board);
        display: flex;
        align-items: center;
        gap: 2.4%;
        padding: var(--plate-pad);
        border-radius: 26px;
        background: rgba(18, 26, 46, 0.9);
        border: 2px solid rgba(148, 163, 184, 0.16);
      }
      #play .plate.bottom {
        flex-direction: row;
      }
      #play .plate .avatar {
        width: var(--avatar);
        height: var(--avatar);
        flex: none;
        object-fit: contain;
      }
      #play .plate .nm {
        font-size: var(--plate-name);
        font-weight: 800;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
        flex: 1;
      }
      #play .plate .tag {
        font-size: var(--plate-tag);
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 0.42em 0.85em;
        border-radius: 999px;
        flex: none;
      }
      #boardWrap {
        width: var(--board);
        height: var(--board);
        border-radius: 26px;
        overflow: hidden;
        border: 2px solid rgba(148, 163, 184, 0.16);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      }
      #boardImg {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: fill;
      }
      /*
        The camera. The board screenshot rides on it, and so does the position
        before the last move during the instant replay. #boardWrap clips it, so a zoom stays
        inside the board's square and never covers the caption.
      */
      #boardCam {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #boardWrap {
        position: relative;
      }
      /* The position before the last move, for the instant replay's dissolve. */
      #boardPrev {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
      }

      /* ---------- the close-call beat (daily look) ---------- */
      /*
        Nil, 2026-10-26: the mouse looks scared when the cat gets close, and
        laughs once a wall has saved it. The pawn that trembles or bounces is
        a CROP OF THE REAL SCREENSHOT, cut to the mouse's cell and moved over
        it; the pawn art is never redrawn. It rides on the camera.
      */
      #pawnFx {
        position: absolute;
      }
      #pawnCrop {
        position: absolute;
        inset: 0;
        border-radius: 22%;
        background-repeat: no-repeat;
      }
      #pawnSweat {
        position: absolute;
        font-family: "Noto Color Emoji", sans-serif;
        line-height: 1;
      }
      #pawnBubble {
        position: absolute;
        left: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #fff;
        border: 0.06em solid #10182c;
        box-shadow: 0 0.08em 0 #10182c;
        color: #10182c;
        font-family:
          "TikTok Sans", "Noto Color Emoji", "DejaVu Sans", sans-serif;
        font-weight: 900;
        line-height: 1;
        white-space: nowrap;
      }

      /* ---------- the endings (wallz look) ---------- */
      /*
        Three endings of our own, each a layer over the frozen final
        screenshot: nothing of the game is redrawn. Their lettering is the VS
        mark's, their panels are the replay page's plates, their pawns and
        colours are the players' own.
      */
      .stampmark {
        font-weight: 900;
        font-style: italic;
        letter-spacing: -0.03em;
        color: #fff;
        text-shadow:
          6px 6px 0 #0b0f1c,
          0 0 42px rgba(255, 214, 102, 0.85);
        -webkit-text-stroke: 0.055em #10182c;
        paint-order: stroke fill;
        white-space: nowrap;
      }
      #stamp,
      #midStamp {
        position: absolute;
        left: 50%;
        top: 50%;
        font-size: calc(var(--board) * 0.14);
      }
      #replayBadge {
        position: absolute;
        left: 4%;
        top: 4%;
        display: flex;
        align-items: center;
        gap: 0.5em;
        padding: 0.4em 0.9em;
        border-radius: 999px;
        background: rgba(18, 26, 46, 0.9);
        border: 2px solid rgba(148, 163, 184, 0.16);
        font-size: calc(var(--board) * 0.04);
        font-weight: 800;
        letter-spacing: 0.18em;
      }
      #replayBadge .dot {
        width: 0.7em;
        height: 0.7em;
        border-radius: 50%;
        background: #ef4444;
      }
      #crack {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
      }
      #ggCard {
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(var(--board) * 0.8);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: calc(var(--board) * 0.02);
        padding: calc(var(--board) * 0.05) calc(var(--board) * 0.04);
        border-radius: 26px;
        background: rgba(18, 26, 46, 0.94);
        border: 2px solid rgba(148, 163, 184, 0.16);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      }
      #ggCard .gg {
        font-size: calc(var(--board) * 0.2);
        line-height: 1;
      }
      #ggCard .gg span {
        color: #ffd166;
      }
      /*
        The full card width, not its content's: a row that sizes itself to its
        content measured the name before it shrank and left it 540 px of an
        834 px card, so the name was cut (2026-10-26).
      */
      #ggCard .who {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4%;
        width: 100%;
      }
      #ggCard img {
        width: calc(var(--board) * 0.14);
        height: calc(var(--board) * 0.14);
        flex: none;
        object-fit: contain;
      }
      #ggCard .n {
        font-size: calc(var(--board) * 0.065);
        font-weight: 900;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      #ggCard .how {
        font-size: calc(var(--board) * 0.032);
        font-weight: 700;
        color: var(--dim);
        letter-spacing: 0.04em;
      }
      #ggCard .cta {
        margin-top: 2%;
        font-size: calc(var(--board) * 0.055);
        font-weight: 900;
        letter-spacing: 0.12em;
      }
      #ggCard .cta .dot {
        color: #ff8c42;
      }
      #koPawn {
        position: absolute;
        left: 0;
        top: 0;
        object-fit: contain;
        filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.6));
      }
      #koBanner {
        top: calc(50% + var(--board) * 0.12);
        height: calc(var(--board) * 0.3);
      }

      /* ---------- the WallzGame look (style "wallz") ---------- */
      /*
        Nil's reference Short (2026-10-25): black frame, one meme caption over
        the board for the whole video, the board as wide as the frame, nothing
        else. Same tree as the default look: the plates are hidden and the
        caption shown, so nothing is drawn twice.
      */
      #play .caption {
        display: none;
      }
      #root.wallz {
        background: #000;
      }
      #root.wallz #play .plate {
        display: none;
      }
      #root.wallz #play .caption {
        display: block;
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(50% + var(--board) / 2 + var(--caption-gap));
        padding: 0 5%;
        text-align: center;
        font-family:
          "TikTok Sans", "Noto Color Emoji", "DejaVu Sans", sans-serif;
        font-size: var(--caption-size);
        font-weight: 700;
        line-height: 1.15;
        color: #fff;
      }
      #root.wallz #boardWrap {
        border: none;
        border-radius: 12px;
        box-shadow: none;
      }
      #root.wallz #brand {
        bottom: auto;
        top: calc(50% + var(--board) / 2 + var(--caption-gap));
      }

      /* ---------- persistent branding ---------- */
      /*
        Quiet during play, loud only on the end card. A feed watermark that
        fights the board costs more attention than it earns.
      */
      #brand {
        position: absolute;
        left: 0;
        right: 0;
        bottom: var(--brand-bottom);
        text-align: center;
        font-size: var(--brand-size);
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: lowercase;
        /*
          Readable at 1x on a phone-sized timeline, which is the only size
          anyone watches at. It was rgba(...,0.42) on the principle that a
          watermark must not fight the board; that principle still holds, but
          0.42 crossed from quiet into invisible.
        */
        color: rgba(226, 232, 240, 0.72);
      }

      /* ---------- the end card ---------- */
      #end {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--gap);
        background:
          radial-gradient(
            circle at 50% 42%,
            rgba(56, 78, 140, 0.4),
            transparent 62%
          ),
          var(--bg);
      }
      #end .crown {
        font-size: var(--end-kicker);
        font-weight: 800;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #ffd166;
      }
      #end .winner {
        display: flex;
        align-items: center;
        gap: 3%;
      }
      #end .winner img {
        width: var(--end-avatar);
        height: var(--end-avatar);
        object-fit: contain;
      }
      #end .winner .n {
        font-size: var(--end-name);
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      #end .how {
        font-size: var(--end-how);
        font-weight: 700;
        color: var(--dim);
        letter-spacing: 0.04em;
      }
      #end .cta {
        margin-top: 4%;
        font-size: var(--end-cta);
        font-weight: 900;
        letter-spacing: 0.12em;
        color: #fff;
      }
      #end .cta .dot {
        color: #ff8c42;
      }
      #end .cta2 {
        margin-top: 1.4%;
        font-size: var(--end-cta2);
        font-weight: 700;
        color: var(--dim);
        letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="vs" class="hidden">
        <div class="beam top" id="beamTop">
          <div class="inner">
            <img class="portrait" id="vsImgA" />
            <div class="who">
              <div class="name" id="vsNameA"></div>
              <div class="sub" id="vsSubA"></div>
            </div>
          </div>
        </div>
        <div class="beam bottom" id="beamBottom">
          <div class="inner">
            <img class="portrait" id="vsImgB" />
            <div class="who">
              <div class="name" id="vsNameB"></div>
              <div class="sub" id="vsSubB"></div>
            </div>
          </div>
        </div>
        <div class="vsmark" id="vsMark">V<span>S</span></div>
      </div>

      <div id="play" class="hidden">
        <div class="caption" id="caption"></div>
        <div class="plate top">
          <img class="avatar" id="pAvT" />
          <div class="nm" id="pNameT"></div>
          <div class="tag" id="pTagT"></div>
        </div>
        <div id="boardWrap">
          <div id="boardCam">
            <img id="boardImg" />
            <img id="boardPrev" class="hidden" />
            <div id="pawnFx" class="hidden">
              <div id="pawnCrop"></div>
              <div id="pawnSweat">💦</div>
              <div id="pawnBubble"></div>
            </div>
          </div>
          <svg id="crack" class="hidden" viewBox="0 0 1000 1000"></svg>
          <div id="replayBadge" class="hidden">
            <div class="dot"></div>
            REPLAY
          </div>
          <div id="stamp" class="stampmark hidden"></div>
          <div id="midStamp" class="stampmark hidden"></div>
        </div>
        <div id="flash" class="hidden"></div>
        <img id="koPawn" class="hidden" />
        <div class="beam hidden" id="koBanner">
          <div class="inner">
            <img class="portrait" id="koImg" />
            <div class="who">
              <div class="name" id="koName"></div>
              <div class="sub">WINS</div>
            </div>
          </div>
        </div>
        <div id="ggCard" class="hidden">
          <div class="gg stampmark">G<span>G</span></div>
          <div class="who">
            <img id="ggAv" />
            <div class="n" id="ggName"></div>
          </div>
          <div class="how" id="ggHow"></div>
          <div class="cta">wallgame<span class="dot">.</span>io</div>
        </div>
        <div class="plate bottom">
          <img class="avatar" id="pAvB" />
          <div class="nm" id="pNameB"></div>
          <div class="tag" id="pTagB"></div>
        </div>
      </div>

      <div id="end" class="hidden">
        <div class="crown" id="endKicker">WINNER</div>
        <div class="winner">
          <img id="endAv" />
          <div class="n" id="endName"></div>
        </div>
        <div class="how" id="endHow"></div>
        <div class="cta">wallgame<span class="dot">.</span>io</div>
        <div class="cta2" id="endCta2">free · no account · play in one tap</div>
      </div>

      <!--
        The track name used to appear here so four comparison renders could be
        told apart on screen. That comparison is over, and a viewer has no use
        for it - the filename carries it now.
      -->
      <div id="brand" class="hidden">wallgame.io</div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const show = (el, on) => el.classList.toggle("hidden", !on);

      /**
       * How far into the VS segment the mark punches down, as a fraction.
       *
       * The renderer reads this to line the sting's impact up with the visual
       * one. It is published rather than copied, so the sound cannot drift
       * away from the picture when the animation is retimed.
       */
      window.__VS_PUNCH_FRACTION = 0.55;
      /** How long the punch takes, as a fraction of the same segment. */
      window.__VS_PUNCH_DURATION = 0.26;
      /**
       * The VS overlay's timing, in seconds: the whole of it, the entry the
       * VS screen's 0..1 animation is stretched over, and the exit. The
       * renderer reads it to place the overlay frames and the punch sound,
       * and plays the first move only once the exit starts. Nil, 2026-10-26:
       * 3.0 s was "still too crowded and fast"; at 4.0 the words stand still
       * for about 2.5 s.
       */
      window.__VS_OVERLAY = { seconds: 4.0, entry: 1.6, exit: 0.6 };

      /**
       * The three endings of the wallz look, one frame at a time.
       *
       * Nil, 2026-10-26: the colour flood looked like a copy of WallzGame, so
       * the video ends in one of these instead, in Wall Game's own language:
       *
       *   replay  an instant replay: the camera cuts back to the position
       *           before the last move, pushes in on the capture cell while
       *           the two real screenshots dissolve in slow motion, and a
       *           stamp lands.
       *   gg      a freeze frame: a flash, a shake, cracks out of the capture
       *           cell, the board goes grey, and our winner card slides up.
       *   ko      a knockout: the loser's pawn spins off the board and the
       *           winner's banner, the VS screen's own, slides in.
       *
       * Each ending publishes its length, its hold and the second of its
       * impact here. The renderer reads them, and the finish sound lands on
       * the impact, so the sound cannot drift off the picture when an ending
       * is retimed.
       *
       * e = { kind, t: seconds into the ending, at: {x, y} the capture cell
       *       in the board image (0..1), cell: one cell's width (0..1),
       *       before: the board image before the last move, stamp, how,
       *       winner, loser }
       */
      window.__ENDINGS = {
        replay: { seconds: 2.0, impact: 1.4, hold: 1.3 },
        gg: { seconds: 1.0, impact: 0, hold: 1.6 },
        ko: { seconds: 1.0, impact: 0, hold: 1.5 },
      };

      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const easeOut3 = (x) => 1 - Math.pow(1 - x, 3);
      const easeInOut3 = (x) =>
        x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      /** Progress of `t` through the window [from, to], 0..1. */
      const span = (t, from, to) => clamp01((t - from) / (to - from));
      /** The VS mark's punch: lands big, overshoots once, settles at 1. */
      const punch = (p) =>
        p >= 1 ? 1 : 1.9 - 0.9 * easeOut3(p) - 0.14 * Math.sin(p * Math.PI);

      /**
       * A long name shrinks until it fits, instead of ending in "...". The
       * room a name gets depends on the frame and the portrait size, so it is
       * measured here, not predicted. Seen 2026-10-26: the 9:16 frame cut
       * "Guest Cormorant" to "Guest Cormor...".
       */
      const fitName = (el) => {
        el.style.fontSize = "";
        let size = parseFloat(getComputedStyle(el).fontSize);
        const floor = size * 0.6;
        while (el.scrollWidth > el.clientWidth && size > floor) {
          size = Math.max(floor, size - 2);
          el.style.fontSize = size + "px";
        }
      };

      /**
       * Cracks out of a point, in a 1000x1000 box over the board. The rays
       * come from fixed formulas, not a random source, so every render of a
       * game cracks the same way.
       */
      const paintCracks = (x, y, drawn) => {
        const svg = $("crack");
        const key = x + "/" + y;
        if (svg.dataset.key !== key) {
          svg.dataset.key = key;
          const rays = [];
          for (let i = 0; i < 9; i += 1) {
            let a = (i / 9) * Math.PI * 2 + Math.sin(i * 12.9898) * 0.35;
            let px = x * 1000;
            let py = y * 1000;
            const len = 260 + 220 * Math.abs(Math.sin(i * 78.233));
            const pts = [[px, py]];
            for (let k = 1; k <= 6; k += 1) {
              a += Math.sin(i * 3.1 + k * 1.7) * 0.35;
              px += (Math.cos(a) * len) / 6;
              py += (Math.sin(a) * len) / 6;
              pts.push([px, py]);
            }
            rays.push(pts.map((p) => p.join(",")).join(" "));
          }
          svg.innerHTML = rays
            .map(
              (pts) =>
                `<polyline points="${pts}" pathLength="1" fill="none" stroke="rgba(11,15,28,0.85)" stroke-width="9" stroke-linejoin="round" stroke-dasharray="1"/>` +
                `<polyline points="${pts}" pathLength="1" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="1"/>`,
            )
            .join("");
        }
        for (const line of svg.children) {
          line.setAttribute("stroke-dashoffset", String(1 - drawn));
        }
      };

      /**
       * The close-call beat on the mouse, one frame at a time.
       *
       *   scared  the cat is close: the mouse trembles, sweats, and a "!"
       *           bubble pops over it.
       *   laugh   a wall has saved it: the mouse bounces and a 😂 bubble pops.
       *
       * b = { kind, t: seconds into the beat, board: the screenshot under it,
       *       cell: {x, y} the mouse's cell centre in the board image (0..1),
       *       size: one cell's width (0..1),
       *       side: where the bubble goes, up | right | left | down, chosen
       *       by the renderer away from the other pawns }
       */
      const paintBeat = (b) => {
        const fx = $("pawnFx");
        show(fx, !!b);
        if (!b) return;
        const W = $("boardWrap").clientWidth;
        const px = b.size * W;
        const left = (b.cell.x - b.size / 2) * W;
        const top = (b.cell.y - b.size / 2) * W;
        fx.style.left = left + "px";
        fx.style.top = top + "px";
        fx.style.width = px + "px";
        fx.style.height = px + "px";
        const crop = $("pawnCrop");
        crop.style.backgroundImage = "url('" + b.board + "')";
        crop.style.backgroundSize = W + "px " + W + "px";
        crop.style.backgroundPosition = -left + "px " + -top + "px";

        const phase = b.t * 30;
        const bubble = $("pawnBubble");
        // Next to the mouse, on the side the renderer measured to be clear.
        const across = b.side === "left" || b.side === "right";
        bubble.style.top = b.side === "down" ? "105%" : across ? "50%" : "auto";
        bubble.style.bottom = b.side === "up" ? "105%" : "auto";
        bubble.style.left =
          b.side === "right" ? "105%" : across ? "auto" : "50%";
        bubble.style.right = b.side === "left" ? "105%" : "auto";
        bubble.style.fontSize = px * 0.42 + "px";
        bubble.style.padding = "0.18em 0.42em";
        const pop = punch(span(b.t, 0, 0.18));
        bubble.style.transform =
          (across ? "translateY(-50%)" : "translateX(-50%)") +
          " scale(" +
          pop +
          ")";
        const sweat = $("pawnSweat");

        if (b.kind === "scared") {
          crop.style.transform =
            "translate(" +
            Math.sin(phase * 2.7) * px * 0.05 +
            "px," +
            Math.cos(phase * 3.3) * px * 0.035 +
            "px) scale(1.06)";
          bubble.textContent = "!";
          show(sweat, true);
          // A drop that slides down the face and starts again, twice a second.
          const cycle = (b.t * 2) % 1;
          sweat.style.fontSize = px * 0.3 + "px";
          // The drop goes on the side away from a bubble on the left.
          sweat.style.left = b.side === "left" ? "78%" : "-8%";
          sweat.style.top = -5 + cycle * 30 + "%";
          sweat.style.opacity = 1 - cycle * 0.8;
        } else {
          /*
            Small hops with a wobble, and always a little enlarged. The crop
            sits on the real pawn, so a hop higher than the enlargement would
            show the pawn twice (seen 2026-10-26 at 22% of a cell).
          */
          const hop = Math.abs(Math.sin(b.t * Math.PI * 3.2));
          crop.style.transform =
            "translateY(" +
            -hop * px * 0.07 +
            "px) rotate(" +
            Math.sin(phase * 0.9) * 8 +
            "deg) scale(" +
            (1.14 + 0.05 * hop) +
            ")";
          bubble.textContent = "😂";
          show(sweat, false);
        }
      };

      /**
       * An EDL stamp in the middle of the game: the word punches in like the
       * VS mark and fades over its last quarter second.
       *   m = { text, t: seconds into the stamp, seconds: its length }
       */
      const paintMidStamp = (m) => {
        const el = $("midStamp");
        show(el, !!m);
        if (!m) return;
        el.textContent = m.text;
        el.style.opacity = 1 - span(m.t, m.seconds - 0.25, m.seconds);
        el.style.transform =
          "translate(-50%,-50%) rotate(-8deg) scale(" +
          punch(span(m.t, 0, 0.25)) +
          ")";
      };

      const paintEnding = (e) => {
        for (const id of [
          "boardPrev",
          "replayBadge",
          "stamp",
          "crack",
          "flash",
          "ggCard",
          "koPawn",
          "koBanner",
        ]) {
          show($(id), false);
        }
        $("boardImg").style.filter = "";
        $("boardWrap").style.transform = "";
        if (!e) return;
        const t = e.t;

        if (e.kind === "replay") {
          const push = easeInOut3(span(t, 0, 1.4));
          $("boardCam").style.transformOrigin =
            e.at.x * 100 + "% " + e.at.y * 100 + "%";
          $("boardCam").style.transform = "scale(" + (1 + 1.1 * push) + ")";
          show($("boardPrev"), true);
          $("boardPrev").src = e.before;
          $("boardPrev").style.opacity = 1 - span(t, 0.5, 1.4);
          show($("replayBadge"), true);
          $("replayBadge").querySelector(".dot").style.opacity =
            Math.floor(t * 3) % 2 === 0 ? 1 : 0.25;
          // A game won any other way than a catch or a home stamps no word.
          if (t >= 1.4 && e.stamp) {
            show($("stamp"), true);
            $("stamp").textContent = e.stamp;
            $("stamp").style.transform =
              "translate(-50%,-50%) rotate(-8deg) scale(" +
              punch(span(t, 1.4, 1.65)) +
              ")";
          }
        }

        if (e.kind === "gg") {
          show($("flash"), t < 0.18);
          $("flash").style.opacity = 0.85 * (1 - span(t, 0, 0.18));
          // Translation only, like the capture shake: a scale would not
          // come back to where it began.
          const k = 1 - span(t, 0, 0.5);
          const phase = t * 30;
          $("boardWrap").style.transform =
            "translate(" +
            Math.sin(phase * 7.3) * 18 * k +
            "px," +
            Math.cos(phase * 5.1) * 12 * k +
            "px)";
          show($("crack"), true);
          paintCracks(e.at.x, e.at.y, easeOut3(span(t, 0, 0.35)));
          const g = span(t, 0.15, 0.6);
          $("boardImg").style.filter =
            "grayscale(" + g + ") brightness(" + (1 - 0.55 * g) + ")";
          if (t >= 0.55) {
            const p = easeOut3(span(t, 0.55, 0.95));
            show($("ggCard"), true);
            $("ggCard").style.opacity = p;
            $("ggCard").style.transform =
              "translate(-50%, calc(-50% + " + (1 - p) * 40 + "%))";
            $("ggAv").src = e.winner.portrait;
            $("ggName").textContent = e.winner.name;
            $("ggName").style.color = e.winner.hex;
            $("ggHow").textContent = e.how;
            fitName($("ggName"));
          }
        }

        if (e.kind === "ko") {
          $("boardImg").style.filter =
            "brightness(" + (1 - 0.4 * span(t, 0, 0.4)) + ")";
          show($("flash"), t < 0.12);
          $("flash").style.opacity = 0.6 * (1 - span(t, 0, 0.12));
          if (t < 0.95) {
            // The loser's pawn, from the capture cell up and across the
            // frame, spinning and growing as it goes, off the far side.
            const r = $("boardWrap").getBoundingClientRect();
            const size = e.cell * r.width;
            const p = span(t, 0, 0.95);
            const dir = e.at.x < 0.5 ? 1 : -1;
            const x =
              r.x + e.at.x * r.width + dir * p * p * window.innerWidth * 0.9;
            const y =
              r.y +
              e.at.y * r.height -
              Math.sin(p * Math.PI * 0.6) * window.innerHeight * 0.45;
            show($("koPawn"), true);
            $("koPawn").src = e.loser.portrait;
            $("koPawn").style.width = size + "px";
            $("koPawn").style.height = size + "px";
            $("koPawn").style.transform =
              "translate(" +
              (x - size / 2) +
              "px," +
              (y - size / 2) +
              "px) rotate(" +
              dir * p * 900 +
              "deg) scale(" +
              (1 + 1.6 * p) +
              ")";
          }
          if (t >= 0.35) {
            const b = easeOut3(span(t, 0.35, 0.75));
            show($("koBanner"), true);
            $("koBanner").style.marginLeft = (1 - b) * -120 + "%";
            $("koBanner").style.background = e.winner.gradient;
            $("koImg").src = e.winner.portrait;
            $("koName").textContent = e.winner.name;
            fitName($("koName"));
          }
        }
      };

      const paintVs = (a, b, t, out) => {
        const ease = (x) => 1 - Math.pow(1 - x, 3);
        /*
          Banners fly in from opposite sides and settle.

          They are STAGGERED and they take their time. The first cut of this
          ran both in together over about a second and read as janky - two
          slabs arriving at once looks like a glitch rather than an
          introduction. Landing them one after the other, over roughly half
          again as long, reads as two players being announced.
        */
        const slideAt = (delay) =>
          ease(Math.max(0, Math.min(1, (t - delay) / 0.42)));
        // On the way out (the overlay only) each banner keeps going the
        // way it came, so it leaves rather than reverses.
        const leave = ease(out);
        $("beamTop").style.marginLeft =
          (1 - slideAt(0)) * -120 + leave * 120 + "%";
        $("beamBottom").style.marginLeft =
          (1 - slideAt(0.1)) * 120 - leave * 120 + "%";

        // The VS stamps down late and overshoots once - the loudest beat,
        // and the moment the sting is built to hit.
        const vp = Math.max(
          0,
          Math.min(
            1,
            (t - window.__VS_PUNCH_FRACTION) / window.__VS_PUNCH_DURATION,
          ),
        );
        const overshoot =
          vp < 1 ? 1.9 - 0.9 * ease(vp) - 0.14 * Math.sin(vp * Math.PI) : 1;
        $("vsMark").style.setProperty("--vs-scale", vp === 0 ? 0 : overshoot);
        $("vsMark").style.opacity = vp === 0 ? 0 : 1 - leave;

        // The bottom banner is mirrored, so its gradient is mirrored too -
        // otherwise it fades to dark exactly where its portrait sits.
        $("beamTop").style.background = a.gradient;
        $("beamBottom").style.background = b.gradientMirrored;
        $("vsImgA").src = a.portrait;
        $("vsImgB").src = b.portrait;
        for (const [beam, name, sub, p] of [
          [$("beamTop"), $("vsNameA"), $("vsSubA"), a],
          [$("beamBottom"), $("vsNameB"), $("vsSubB"), b],
        ]) {
          // `word` (the daily overlay) replaces the name with AI or Human.
          beam.classList.toggle("word", !!p.word);
          beam.style.boxShadow = p.word
            ? "inset 0 14px 0 " + p.hex + ", inset 0 -14px 0 " + p.hex
            : "";
          name.textContent = p.word ?? p.name;
          name.style.color = p.word ? p.hex : "";
          fitName(name);
          sub.textContent = p.sub;
          show(sub, !p.word);
        }
      };

      /**
       * Paint one frame. Called once per screenshot by the renderer.
       *
       * `s.segment` picks which of the three layers is visible; `s.t` is a
       * 0..1 progress used only by the animated segments. Everything else is
       * data lifted from the game record or from a screenshot of the product.
       */
      window.__stage = (s) => {
        show($("vs"), s.segment === "vs");
        show($("play"), s.segment === "play");
        show($("end"), s.segment === "end");
        show($("brand"), s.segment === "play");
        $("root").classList.toggle("wallz", s.look === "wallz");
        $("vs").style.transform = "";

        if (s.segment === "vs") paintVs(s.a, s.b, s.t, 0);

        /*
          The VS overlay (Nil, 2026-10-26: an intro screen loses viewers, so
          the names fly in over the board while the game already plays). The
          same banners and mark as the VS screen, run over the first
          __VS_OVERLAY.entry seconds, then sliding off over the last
          __VS_OVERLAY.exit seconds.
        */
        if (s.segment === "play" && s.vsOverlay) {
          const o = s.vsOverlay;
          const v = window.__VS_OVERLAY;
          show($("vs"), true);
          paintVs(
            o.a,
            o.b,
            Math.min(1, o.t / v.entry),
            Math.max(0, Math.min(1, (o.t - (v.seconds - v.exit)) / v.exit)),
          );
          /*
            The banners never cover the caption (Wall Game PM, 2026-10-26:
            the top banner cut into "winning"). Their skew lifts one end, so
            the clearance is MEASURED: the overlay moves down until the top
            banner's box starts below the caption's box.
          */
          if (s.caption) {
            $("caption").textContent = s.caption;
            const clear =
              $("caption").getBoundingClientRect().bottom +
              12 -
              $("beamTop").getBoundingClientRect().top;
            if (clear > 0) {
              $("vs").style.transform = "translateY(" + clear + "px)";
            }
          }
        }

        if (s.segment === "play") {
          $("boardImg").src = s.board;
          $("caption").textContent = s.caption ?? "";
          /*
            Camera punch-in: a scale about the point of the move. The origin is
            inside the board and the scale is never below 1, so the magnified
            board always covers its whole square and no edge shows.
          */
          const z = s.zoom;
          $("boardCam").style.transformOrigin = z
            ? z.x * 100 + "% " + z.y * 100 + "%"
            : "50% 50%";
          $("boardCam").style.transform = z ? "scale(" + z.scale + ")" : "none";
          paintBeat(s.beat);
          paintMidStamp(s.midStamp);
          paintEnding(s.ending);
          $("pAvT").src = s.top.portrait;
          $("pAvB").src = s.bottom.portrait;
          $("pNameT").textContent = s.top.name;
          $("pNameB").textContent = s.bottom.name;
          for (const [el, p] of [
            [$("pTagT"), s.top],
            [$("pTagB"), s.bottom],
          ]) {
            el.textContent = p.sub;
            el.style.color = p.hex;
            el.style.background = p.soft;
          }
          /*
            Screen shake: a decaying wobble.

            TRANSLATION AND ROTATION ONLY - NEVER SCALE. An earlier version
            scaled to 1.045 during the shake and reset to `none` after it, so
            the board settled 4.5% smaller than it started and the cut was
            visible as a jump. Scale is not a shake, it is a zoom, and a zoom
            that only exists during the effect cannot return to where it began.
            The composition is inset from the frame, so a translation never
            exposes an edge and no cover-up scale is needed.

            It moves #play, not #root, so the background stays put and only the
            board and plates shake against it.
          */
          const k = s.shake ?? 0;
          if (k > 0) {
            const amp = 16 * k;
            const dx = Math.sin(s.shakePhase * 7.3) * amp;
            const dy = Math.cos(s.shakePhase * 5.1) * amp * 0.7;
            const rot = Math.sin(s.shakePhase * 6.1) * 0.7 * k;
            $("play").style.transform =
              "translate(" + dx + "px," + dy + "px) rotate(" + rot + "deg)";
          } else {
            $("play").style.transform = "none";
          }
        } else {
          $("play").style.transform = "none";
        }

        if (s.segment === "end") {
          $("endAv").src = s.winner.portrait;
          $("endName").textContent = s.winner.name;
          $("endName").style.color = s.winner.hex;
          $("endHow").textContent = s.how;
          $("endKicker").textContent = s.kicker;
        }
        return true;
      };
    </script>
  </body>
</html>
