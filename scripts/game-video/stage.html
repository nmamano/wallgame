      /**
       * How far the overlay as painted now (after __stage) reaches past its
       * box, as shares of the box on each side ({top, right, bottom, left},
       * 0 or more): the union of its own box and every part in it that
       * paints (a picture as the box it is drawn in), their motion
       * included (overlays.mjs overlayPlaces `reach`). #boardWrap
       * cuts what passes the board's edge (Wall Game Director, 2026-10-29:
       * VX ply 14, the cat's ears and the 💦 cut flat).
       */
      window.__overlayReach = () => {
        const el = $("overlay");
        const wrap = $("boardWrap").getBoundingClientRect();
        const x0 = wrap.left + (parseFloat(el.style.left) / 100) * wrap.width;
        const y0 = wrap.top + (parseFloat(el.style.top) / 100) * wrap.height;
        const w = (parseFloat(el.style.width) / 100) * wrap.width;
        const h = (parseFloat(el.style.height) / 100) * wrap.height;
        let u = { left: x0, top: y0, right: x0 + w, bottom: y0 + h };
        // A picture shown with object-fit: contain fills only part of its
        // element: its drawn box, at the size that fits, centred as the
        // reactor's portrait is (a sequence's frames sit in a corner of
        // their element, which stays inside the overlay's box anyway).
        const drawn = (part) => {
          const r = part.getBoundingClientRect();
          if (part.tagName !== "IMG" || !part.naturalWidth) return r;
          const k = Math.min(
            r.width / part.naturalWidth,
            r.height / part.naturalHeight,
          );
          const w = part.naturalWidth * k;
          const h = part.naturalHeight * k;
          const left = r.left + (r.width - w) / 2;
          const top = r.top + (r.height - h) / 2;
          return {
            left,
            top,
            right: left + w,
            bottom: top + h,
            width: w,
            height: h,
          };
        };
        // A part that paints: a picture, its own text, a background or a
        // border. A bare container (the reactor's .face) paints nothing,
        // however its motion scales it.
        const paints = (part) => {
          const st = getComputedStyle(part);
          return (
            ["IMG", "svg"].includes(part.tagName) ||
            [...part.childNodes].some(
              (n) => n.nodeType === 3 && n.textContent.trim() !== "",
            ) ||
            st.backgroundColor !== "rgba(0, 0, 0, 0)" ||
            st.backgroundImage !== "none" ||
            parseFloat(st.borderTopWidth) > 0
          );
        };
        for (const part of el.querySelectorAll("*")) {
          if (!paints(part)) continue;
          const r = drawn(part);
          if (r.width === 0 || r.height === 0) continue;
          u = {
            left: Math.min(u.left, r.left),
            top: Math.min(u.top, r.top),
            right: Math.max(u.right, r.right),
            bottom: Math.max(u.bottom, r.bottom),
          };
        }
        return {
          top: (y0 - u.top) / h,
          right: (u.right - x0 - w) / w,
          bottom: (u.bottom - y0 - h) / h,
          left: (x0 - u.left) / w,
        };
      };

      /*
        A trap's or an explain's lit walls (render-game-video.mjs litWalls):
        each wall itself, drawn over the page's wall 1.6 times as thick and
        35% lighter in its owner's colour (Nil, 2026-10-30, C27: "B is the
        best look. all others have weird gaps"; a ring or a glow round the
        wall left gaps at the corners). All walls are drawn opaque in one
        group that has the fade's opacity, so where two walls meet they
        join with no brighter seam, and their round ends make a round join.
        The group is clipped to the outer cells' box (tr.box): a wall that ends
        at the board's edge ends flat there, and its round end does not
        run off the board.
      */
      /*
        A callback's old wall taken away (render-game-video.mjs playCallback):
        the same spot of the screenshot from before that wall's move, over
        its groove and its joints, at opacity e.a; and at a joint where a
        later wall ends, that wall's round end, a disc of its own pixels from
        one groove further along it (e.caps). Plain images, as the board's:
        the renderer preloads every file it names (fileUrlsIn).
      */
      /*
        The evaluation strip: e = { left, right: the two seats' colours,
        x: the left seat's share (0..1), swing: { from, to, t: 0..1 } while
        a marked move's swing flashes, or null }. The swing's part of the
        strip flashes white and the strip swells, once, as sin^2.
      */
      const paintEval = (e) => {
        show($("evalStrip"), !!e);
        if (!e) return;
        $("evalStrip").style.background = e.right;
        $("evalLeft").style.background = e.left;
        $("evalLeft").style.width = e.x * 100 + "%";
        const w = e.swing;
        const pulse = w ? Math.sin(Math.PI * w.t) ** 2 : 0;
        show($("evalSwing"), !!w);
        if (w) {
          $("evalSwing").style.left = Math.min(w.from, w.to) * 100 + "%";
          $("evalSwing").style.width = Math.abs(w.to - w.from) * 100 + "%";
          $("evalSwing").style.opacity = 0.85 * pulse;
        }
        $("evalStrip").style.transform = "scaleY(" + (1 + 0.35 * pulse) + ")";
      };
      const paintErase = (e) => {
        show($("eraseFx"), !!e);
        if (!e) return;
        const pc = (v) => v * 100 + "%";
        // Set a src only when it changes, as the board's own image does.
        const src = (img, url) => {
          if (img.getAttribute("src") !== url) img.setAttribute("src", url);
        };
        $("eraseFx").style.opacity = e.a;
        const [x0, y0, x1, y1] = e.box;
        src($("eraseOld"), e.old);
        $("eraseOld").style.clipPath =
          "inset(" + [y0, 1 - x1, 1 - y1, x0].map(pc).join(" ") + ")";
        [0, 1].forEach((i) => {
          const img = $("eraseCap" + i);
          const c = e.caps[i];
          show(img, !!c);
          if (!c) return;
          src(img, e.cur);
          // The clip is in the image's own box, which the shift moves.
          img.style.transform = "translate(" + pc(c.dx) + ", " + pc(c.dy) + ")";
          img.style.clipPath =
            "ellipse(" +
            pc(c.rx) +
            " " +
            pc(c.ry) +
            " at " +
            pc(c.cx - c.dx) +
            " " +
            pc(c.cy - c.dy) +
            ")";
        });
      };
      /**
       * A flashback's look: f = { sepia: 0..1, label: "<< REWIND",
       * "MOVE 8", ">>" or null, t: seconds into it }, or null. The VHS
       * look shows while the board is sepia at all; its band rolls down
       * with t (from the state: workers shoot the frames apart).
       */
      const paintFlashback = (f) => {
        const on = !!f && f.sepia > 0;
        show($("vhsFx"), on);
        $("boardImg").style.filter = on
          ? "sepia(" + f.sepia + ") saturate(" + (1 - 0.3 * f.sepia) + ")"
          : "";
        if (!on) return;
        $("vhsFx").style.opacity = Math.min(1, f.sepia * 3);
        $("vhsBand").style.top = ((f.t * 93) % 107) - 7 + "%";
        $("vhsLabel").textContent = f.label ?? "";
      };
      const paintTrap = (tr) => {
        const svg = $("trapSvg");
        show(svg, !!tr);
        if (!tr) return;
        // tr.fade (0..1, absent 1): a plant's glow going out. tr.plain[i]:
        // wall i in its own colour at the groove's width, not lit (a
        // flashback's other walls, over a sepia board).
        const on =
          (tr.lit ? 1 : easeOut3(span(tr.t, 0, 0.15))) * (tr.fade ?? 1);
        // The groove's width in the svg's units, across the wall.
        const across = ([x1, , x2]) =>
          (x1 === x2 ? tr.groove.x : tr.groove.y) * 1000;
        const lighter = (rgb) =>
          "rgb(" +
          rgb
            .match(/\d+/g)
            .map((v) => Math.round(+v + (255 - v) * TRAP_LIGHTER))
            .join(",") +
          ")";
        const [x0, y0, x1, y1] = tr.box.map((v) => v * 1000);
        svg.innerHTML =
          '<defs><clipPath id="trapBox"><rect x="' +
          x0 +
          '" y="' +
          y0 +
          '" width="' +
          (x1 - x0) +
          '" height="' +
          (y1 - y0) +
          '"/></clipPath></defs><g clip-path="url(#trapBox)" opacity="' +
          on +
          '">' +
          tr.walls
            .map(
              ([ax, ay, bx, by], i) =>
                '<line x1="' +
                ax * 1000 +
                '" y1="' +
                ay * 1000 +
                '" x2="' +
                bx * 1000 +
                '" y2="' +
                by * 1000 +
                '" stroke="' +
                (tr.plain?.[i] ? tr.colors[i] : lighter(tr.colors[i])) +
                '" stroke-width="' +
                across([ax, ay, bx, by]) * (tr.plain?.[i] ? 1 : TRAP_THICK) +
                '" stroke-linecap="round"/>',
            )
            .join("") +
          "</g>";
      };
      // A lit wall's width, in grooves, and how far it goes toward white.
      const TRAP_THICK = 1.6;
      const TRAP_LIGHTER = 0.35;

      /**
       * The head row: the race counter, or the goal line while the VS
       * overlay is in. Each is hidden with visibility, not display, so the
       * row keeps its height and the board does not move.
       *   r = { a: {word, hex, n, changed}, b: {...}, t: seconds since the
       *         move landed, flash: seconds into an EDL `race` flash, or
       *         absent }
       *   goal = the goal line to show instead, or null
       */
      /**
       * The head row: the race counter `r`, or the goal line `goal`; and the
       * credit c = { a: 0..1 }, its fade-in, in the board's corner (the
       * counter stays: the credit no longer takes its place). The credit's
       * text is set once, by __fitWallz. In a fast-forward (edl.mjs fastForward, audit
       * item 5) the counter's middle shows the tag, "▶▶ x3", as a badge in
       * place of its words, so a quiet stretch reads as sped up and not as
       * the game's real pace; off the board, it covers no pawn (Wall Game
       * Director, 2026-10-29) and no counter.
       */
      const paintHud = (r, goal, c, ff) => {
        if (ff) $("raceFast").textContent = "▶\uFE0E▶\uFE0E " + ff;
        // "inherit", never "visible": a child set visible shows through
        // its hidden parent, and #race is hidden while the goal line shows
        // in the same place (render vet, 2026-10-31: v-2026-10-31-6's
        // opening drew "VS STEPS TO CATCH" over the goal line).
        $("raceFast").style.visibility = ff ? "inherit" : "hidden";
        $("race").querySelector(".vs .words").style.visibility = ff
          ? "hidden"
          : "inherit";
        const inn = c ? c.a : 0;
        $("race").style.visibility = r && !goal ? "visible" : "hidden";
        $("goal").style.visibility = goal ? "visible" : "hidden";
        $("credit").style.visibility = inn > 0 ? "visible" : "hidden";
        $("credit").style.opacity = inn > 0 ? String(inn) : "";
        if (goal) $("goal").textContent = goal;
        if (!r) return;
        // The flash: the counter swells and glows, twice, over 0.8 s.
        const f =
          r.flash === undefined
            ? 0
            : Math.sin(span(r.flash, 0, 0.8) * Math.PI * 2) ** 2;
        $("race").style.transform = "scale(" + (1 + 0.18 * f) + ")";
        $("race").style.filter = f
          ? "drop-shadow(0 0 " + 18 * f + "px rgba(253, 224, 71, 0.9))"
          : "";
        for (const [k, p] of [
          ["a", r.a],
          ["b", r.b],
        ]) {
          const n = $("raceN" + k);
          const w = $("raceW" + k);
          n.textContent = String(p.n);
          n.style.color = p.hex;
          w.textContent = p.word;
          w.style.color = p.hex;
          const bump = p.changed ? punch(span(r.t, 0, 0.3)) : 1;
          n.style.transform = "scale(" + bump + ")";
        }
      };

      /**
       * Size the daily look's board to the safe area: what the caption and
       * the head row leave of it. MEASURED here, after the fonts are in and
       * the caption is set, so a two-line caption gives a smaller board and
       * no pixel budget is guessed. Called once per video by the renderer;
       * the result holds for every frame, because the caption and the head
       * row do not change size. With a payoff beat (edl.mjs) there are two
       * captions: the caption keeps the height of the taller one all video
       * long, so the board does not move when the beat changes. Returns the
       * board's side in px.
       */
      window.__fitWallz = async ({
        captions,
        hud,
        goal,
        raceLabel,
        credit,
        strip,
        cta,
        evalStrip,
        ending,
        fastForward,
      }) => {
        $("root").classList.add("wallz");
        // The widest speed tag the video shows, laid out (hidden) all video
        // long, so the counter's middle keeps one width; none: no badge.
        $("raceFast").style.display = fastForward ? "block" : "none";
        $("raceFast").textContent = fastForward
          ? "▶\uFE0E▶\uFE0E " + fastForward
          : "";
        // The call to action (edl.mjs cta) in the badge under the board and
        // as the GG card's last line, its "." in the site's orange.
        for (const el of [$("stripSite"), $("ggCta")]) ctaInto(el, cta);
        show($("play"), true);
        $("goal").textContent = goal ?? "";
        const root = document.documentElement.style;
        root.setProperty("--caption-h", "0px");
        let captionH = 0;
        for (const text of captions) {
          $("caption").textContent = text;
          // A font loads when text first uses it; measure only once it has.
          await document.fonts.ready;
          captionH = Math.max(captionH, $("caption").offsetHeight);
        }
        root.setProperty("--caption-h", captionH + "px");
        $("caption").textContent = captions[0] ?? "";
        await document.fonts.ready;
        $("hud").classList.toggle("on", hud);
        $("race").querySelector(".vs small").textContent = raceLabel ?? "STEPS";
        // The race counter at its widest, for the head row's measure.
        $("raceNa").textContent = "88";
        $("raceNb").textContent = "88";
        $("raceWa").textContent = "BLUE";
        $("raceWb").textContent = "BLUE";
        const captionSize = parseFloat(
          getComputedStyle(document.documentElement).getPropertyValue(
            "--caption-size",
          ),
        );
        /*
          The goal line (the rules, during the opening) on one line: it
          shrinks from its size until the page sets it on one line, measured
          (textLines), inside the height it has at full size (--goal-h), so
          the head row, and with it the board, keep their size.
        */
        let goalSize = captionSize * 0.62;
        const goalFloor = captionSize * 0.36;
        root.setProperty("--goal-size", goalSize + "px");
        // Its one-line height at full size holds the row while it shrinks.
        $("goal").textContent = "Ag";
        root.setProperty(
          "--goal-h",
          $("goal").getBoundingClientRect().height + "px",
        );
        $("goal").textContent = goal ?? "";
        while (goal && textLines($("goal")).lines > 1 && goalSize > goalFloor) {
          goalSize = Math.max(goalFloor, goalSize - 1);
          root.setProperty("--goal-size", goalSize + "px");
        }
        goalFits = !goal || textLines($("goal")).lines === 1;
        // The credit, one line per entry of `credit`, at a fixed size: in
        // the GG card on a "gg" ending, else in the board's corner.
        // creditFits says whether each line fits its width (measured once
        // the board has its size, below).
        $("credit").textContent = credit?.join("\n") ?? "";
        const card = ending === "gg" && !!credit;
        (card ? $("ggCard") : $("boardWrap")).append($("credit"));
        $("ggCard").classList.toggle("credited", card);
        /*
          The strip under the board (Nil, 2026-11-05, C58): the call to
          action, with the evaluation bar over it in a video that has one.
          The players' names are no longer in it: the opening names the
          sides over their cats. It stands on the floor (--look-floor, the
          top of the apps' caption zone), and it shrinks from three
          quarters of the caption size until its lines fit STRIP_AREA's
          width; at its floor, `stripFits` says whether it did.
        */
        const root2 = document.documentElement.style;
        const floor = parseFloat(
          getComputedStyle(document.documentElement).getPropertyValue(
            "--look-floor",
          ),
        );
        $("strip").classList.toggle("on", !!strip);
        $("strip").classList.toggle("eval", !!evalStrip);
        // Measured with the bar on, as every frame of such a video shows it.
        show($("evalStrip"), !!evalStrip);
        let stripH = 0;
        if (strip) {
          let stripSize = captionSize * 0.75;
          const stripFloor = captionSize * 0.36;
          root2.setProperty("--strip-size", stripSize + "px");
          const tooWide = () =>
            $("stripSite").scrollWidth > $("strip").clientWidth;
          while (tooWide() && stripSize > stripFloor) {
            stripSize = Math.max(stripFloor, stripSize - 1);
            root2.setProperty("--strip-size", stripSize + "px");
          }
          stripFits = !tooWide();
          stripH = $("strip").getBoundingClientRect().height;
          root2.setProperty("--strip-top", floor - stripH + "px");
        }
        const play = $("play");
        const gap = parseFloat(getComputedStyle(play).rowGap);
        // The column ends one gap over the strip, or on the floor.
        root2.setProperty(
          "--look-bottom",
          window.innerHeight - floor + (strip ? stripH + gap : 0) + "px",
        );
        const cs = getComputedStyle(play);
        const width =
          play.clientWidth -
          parseFloat(cs.paddingLeft) -
          parseFloat(cs.paddingRight);
        const height =
          play.clientHeight -
          parseFloat(cs.paddingTop) -
          parseFloat(cs.paddingBottom);
        const used = [$("caption"), $("hud")]
          .filter((el) => el.offsetHeight > 0)
          .reduce((sum, el) => sum + el.offsetHeight + gap, 0);
        const board = Math.floor(Math.min(width, height - used));
        document.documentElement.style.setProperty("--board", board + "px");
        const r = $("boardWrap").getBoundingClientRect();
        document.documentElement.style.setProperty(
          "--board-mid",
          r.top + r.height / 2 + "px",
        );
        creditFits = cardAtRest(
          () => !credit || $("credit").scrollWidth <= $("credit").clientWidth,
        );
        return board;
      };

      /**
       * The boxes a viewer must see, as the page lays them out at rest, for
       * the safe-area check: {x, y, w, h} rounded outward, and only the ones
       * this video shows.
       */
      window.__layoutBoxes = ({ captions, race, goal, credit, strip }) => {
        const box = (el) => {
          const r = el.getBoundingClientRect();
          const x = Math.floor(r.left);
          const y = Math.floor(r.top);
          return {
            x,
            y,
            w: Math.ceil(r.right) - x,
            h: Math.ceil(r.bottom) - y,
          };
        };
        const captionBox = (text) => {
          $("caption").textContent = text;
          const b = box($("caption"));
          $("caption").textContent = captions[0] ?? "";
          return b;
        };
        return {
          board: box($("boardWrap")),
          ...(captions[0] && { caption: captionBox(captions[0]) }),
          ...(captions[1] && { payoff: captionBox(captions[1]) }),
          ...(race && { race: box($("race")) }),
          ...(goal && { goalLine: box($("goal")) }),
          ...(credit && { credit: cardAtRest(() => box($("credit"))) }),
          ...(strip && { strip: box($("strip")) }),
        };
      };

      /**
       * A text as the page wraps it (a caption beat, the credit): { lines,
       * width } with the width of its widest line in px, MEASURED from the
       * text's own line
       * boxes (emoji widths vary, so a character count cannot tell). Text
       * runs in two fonts on one line can sit at different heights, so a
       * run joins a line when their middles are within half a run's height.
       */
      const textLines = (el) => {
        const range = document.createRange();
        range.selectNodeContents(el);
        const lines = [];
        for (const r of range.getClientRects()) {
          if (r.width === 0) continue;
          const mid = r.top + r.height / 2;
          const line = lines.find(
            (l) => Math.abs(l.mid - mid) < Math.min(l.height, r.height) / 2,
          );
          if (line) {
            line.left = Math.min(line.left, r.left);
            line.right = Math.max(line.right, r.right);
          } else {
            lines.push({
              mid,
              height: r.height,
              left: r.left,
              right: r.right,
            });
          }
        }
        return {
          lines: lines.length,
          width: Math.ceil(Math.max(0, ...lines.map((l) => l.right - l.left))),
        };
      };
      /** Each caption beat as the page wraps it (textLines). */
      window.__captionText = (captions) => {
        const el = $("caption");
        const out = captions.map((text) => {
          el.textContent = text;
          return textLines(el);
        });
        el.textContent = captions[0] ?? "";
        return out;
      };
      /** Whether the credit fitted its row at __fitWallz's last call. */
      let creditFits = true;
      /** Whether the goal line fitted on one line, and its size. */
      let goalFits = true;
      window.__goalFit = () => ({
        fits: goalFits,
        size: parseFloat(getComputedStyle($("goal")).fontSize),
      });
      /** Whether the players strip fitted on one line, and its size. */
      let stripFits = true;
      window.__stripFit = () => ({
        fits: stripFits,
        size: parseFloat(getComputedStyle($("strip")).fontSize),
      });
      /**
       * The credit as the page lays it out: { lines, width, size }, and
       * `fits`, false when it fits its row at no size down to its floor.
       */
      window.__creditText = () =>
        cardAtRest(() => ({
          ...textLines($("credit")),
          size: parseFloat(getComputedStyle($("credit")).fontSize),
          fits: creditFits,
        }));

      /**
       * A filter on the board as the camera shows it: its image and the
       * capture picture over it, so the picture greys and darkens with the
       * board under an ending.
       */
      const boardFilter = (f) => {
        $("boardImg").style.filter = f;
        $("captureFx").style.filter = f;
      };

      /**
       * A freeze before a move lands: the position before it in grey, and a
       * pause mark. The renderer pushes the camera in (s.zoom).
       *   f = { t: seconds into it }
       */
      const paintFreeze = (f) => {
        show($("freezeBadge"), !!f);
        if (!f) return;
        const g = easeOut3(span(f.t, 0, 0.12));
        boardFilter("grayscale(" + g + ") contrast(" + (1 + 0.15 * g) + ")");
        $("freezeBadge").style.opacity = g;
      };

      const paintEnding = (e) => {
        for (const id of [
          "boardPrev",
          "replayBadge",
          "stamp",
          "crack",
          "flash",
          "ggCard",
          "koPawn",
          "koBanner",
        ]) {
          show($(id), false);
        }
        boardFilter("");
        $("boardWrap").style.transform = "";
        $("stripSite").style.opacity = "";
        if (!e) return;
        const t = e.t;

        if (e.kind === "replay") {
          const push = easeInOut3(span(t, 0, 1.4));
          $("boardCam").style.transformOrigin =
            e.at.x * 100 + "% " + e.at.y * 100 + "%";
          $("boardCam").style.transform = "scale(" + (1 + 1.1 * push) + ")";
          show($("boardPrev"), true);
          $("boardPrev").src = e.before;
          $("boardPrev").style.opacity = 1 - span(t, 0.5, 1.4);
          show($("replayBadge"), true);
          $("replayBadge").querySelector(".dot").style.opacity =
            Math.floor(t * 3) % 2 === 0 ? 1 : 0.25;
          // A game won any other way than a catch or a home stamps no word.
          if (t >= 1.4 && e.stamp) {
            show($("stamp"), true);
            $("stamp").textContent = e.stamp;
            $("stamp").style.transform =
              "translate(-50%,-50%) rotate(-8deg) scale(" +
              punch(span(t, 1.4, 1.65)) +
              ")";
          }
        }

        if (e.kind === "gg") {
          const flash = window.__ENDINGS.gg.flash;
          show($("flash"), t < flash);
          $("flash").style.opacity = 0.85 * (1 - span(t, 0, flash));
          // Translation only, like the capture shake: a scale would not
          // come back to where it began.
          const k = 1 - span(t, 0, 0.5);
          const phase = t * 30;
          $("boardWrap").style.transform =
            "translate(" +
            Math.sin(phase * 7.3) * 18 * k +
            "px," +
            Math.cos(phase * 5.1) * 12 * k +
            "px)";
          // A crack reads as a hit: only when a move ended the game (Wall
          // Game Director, 2026-10-30: on v-2026-10-30-8, a resignation,
          // it ran out of the bot's cat).
          show($("crack"), e.crack);
          if (e.crack) paintCracks(e.at.x, e.at.y, easeOut3(span(t, 0, 0.35)));
          const g = span(t, 0.15, 0.6);
          boardFilter(
            "grayscale(" + g + ") brightness(" + (1 - 0.55 * g) + ")",
          );
          if (t >= 0.55) {
            const p = easeOut3(span(t, 0.55, window.__ENDINGS.gg.cardIn));
            show($("ggCard"), true);
            $("ggCard").style.opacity = p;
            // One call to action at the end, the card's, which pops: the
            // badge under the board fades out as the card lands, and is
            // back on the loop's first frame (Wall Game Director,
            // 2026-10-31: two orange badges split the eye).
            $("stripSite").style.opacity = 1 - p;
            // It grows in where it rests, never sliding: the ending's bar
            // may take the band below it (Wall Game Director, 2026-10-29).
            $("ggCard").style.transform =
              "translate(-50%, -50%) scale(" + (0.92 + 0.08 * p) + ")";
            $("ggAv").src = e.winner.portrait;
            $("ggName").textContent = e.winner.name;
            $("ggName").style.color = e.winner.hex;
            $("ggHow").textContent = e.how;
            fitName($("ggName"));
            fitName($("ggCta"));
            // The call to action pops as the card lands: it swells and
            // glows once (Nil, 2026-10-31: "make it pop"). Then, while the
            // ending holds (`e.cta`, the clock that runs on; Nil,
            // 2026-11-01: "start giving the CTA some animation to make it
            // stand out more"), it breathes, a slow swell and glow every
            // CTA_PULSE seconds, and a shine crosses it every second breath.
            // It swells by a fifth at most, and less for a wide one, so it
            // stays 2% inside the card's sides (VR1 review 123 N1).
            const ct = e.cta ?? t;
            const pop = Math.sin(Math.PI * span(ct, 0.62, 0.93));
            const breathe =
              ct < CTA_PULSE_FROM
                ? 0
                : (1 -
                    Math.cos(
                      (2 * Math.PI * (ct - CTA_PULSE_FROM)) / CTA_PULSE,
                    )) /
                  2;
            const room =
              ($("ggCard").clientWidth * 0.96) / $("ggCta").offsetWidth;
            const swell = Math.max(0, Math.min(0.2, room - 1));
            // The breath swells to CTA_BREATH, within the same room, and
            // also glows and brightens.
            const grow = Math.max(
              swell * pop,
              Math.min(CTA_BREATH - 1, swell) * breathe,
            );
            $("ggCta").style.transform = "scale(" + (1 + grow) + ")";
            $("ggCta").style.boxShadow =
              "0 0 " +
              (0.3 + 0.9 * pop + 1.2 * breathe) +
              "em rgba(255, 140, 66, " +
              (0.5 + 0.45 * Math.max(pop, breathe)) +
              ")";
            $("ggCta").style.filter =
              breathe > 0 ? "brightness(" + (1 + 0.2 * breathe) + ")" : "";
            // The shine: a light band across the pill, left to right, at
            // CTA_SHINE_AT and every second breath after it.
            const shine =
              ct < CTA_SHINE_AT
                ? 0
                : span((ct - CTA_SHINE_AT) % (2 * CTA_PULSE), 0, CTA_SHINE);
            $("ggCta").style.backgroundImage =
              shine > 0 && shine < 1
                ? "linear-gradient(105deg, transparent " +
                  (-30 + 160 * shine - 12) +
                  "%, rgba(255, 255, 255, 0.85) " +
                  (-30 + 160 * shine) +
                  "%, transparent " +
                  (-30 + 160 * shine + 12) +
                  "%), var(--cta-fill)"
                : "";
          }
        }

        if (e.kind === "ko") {
          boardFilter("brightness(" + (1 - 0.4 * span(t, 0, 0.4)) + ")");
          const flash = window.__ENDINGS.ko.flash;
          show($("flash"), t < flash);
          $("flash").style.opacity = 0.6 * (1 - span(t, 0, flash));
          if (t < 0.95) {
            // The loser's pawn, from the capture cell up and across the
            // frame, spinning and growing as it goes, off the far side.
            const r = $("boardWrap").getBoundingClientRect();
            const size = e.cell * r.width;
            const p = span(t, 0, 0.95);
            const dir = e.at.x < 0.5 ? 1 : -1;
            const x =
              r.x + e.at.x * r.width + dir * p * p * window.innerWidth * 0.9;
            const y =
              r.y +
              e.at.y * r.height -
              Math.sin(p * Math.PI * 0.6) * window.innerHeight * 0.45;
            show($("koPawn"), true);
            $("koPawn").src = e.loser.portrait;
            $("koPawn").style.width = size + "px";
            $("koPawn").style.height = size + "px";
            $("koPawn").style.transform =
              "translate(" +
              (x - size / 2) +
              "px," +
              (y - size / 2) +
              "px) rotate(" +
              dir * p * 900 +
              "deg) scale(" +
              (1 + 1.6 * p) +
              ")";
          }
          if (t >= 0.35) {
            const b = easeOut3(span(t, 0.35, 0.75));
            show($("koBanner"), true);
            $("koBanner").style.marginLeft = (1 - b) * -120 + "%";
            $("koBanner").style.background = e.winner.gradient;
            $("koImg").src = e.winner.portrait;
            $("koName").textContent = e.winner.name;
            fitName($("koName"));
          }
        }
      };

      const paintVs = (a, b, t, out) => {
        const ease = (x) => 1 - Math.pow(1 - x, 3);
        /*
          Banners fly in from opposite sides and settle.

          They are STAGGERED and they take their time. The first cut of this
          ran both in together over about a second and read as janky - two
          slabs arriving at once looks like a glitch rather than an
          introduction. Landing them one after the other, over roughly half
          again as long, reads as two players being announced.
        */
        const slideAt = (delay) =>
          ease(Math.max(0, Math.min(1, (t - delay) / 0.42)));
        // On the way out (the overlay only) each banner keeps going the
        // way it came, so it leaves rather than reverses.
        const leave = ease(out);
        $("beamTop").style.marginLeft =
          (1 - slideAt(0)) * -120 + leave * 120 + "%";
        $("beamBottom").style.marginLeft =
          (1 - slideAt(0.1)) * 120 - leave * 120 + "%";

        // The VS stamps down late and overshoots once - the loudest beat,
        // and the moment the sting is built to hit.
        const vp = Math.max(
          0,
          Math.min(
            1,
            (t - window.__VS_PUNCH_FRACTION) / window.__VS_PUNCH_DURATION,
          ),
        );
        const overshoot =
          vp < 1 ? 1.9 - 0.9 * ease(vp) - 0.14 * Math.sin(vp * Math.PI) : 1;
        $("vsMark").style.setProperty("--vs-scale", vp === 0 ? 0 : overshoot);
        $("vsMark").style.opacity = vp === 0 ? 0 : 1 - leave;

        // The bottom banner is mirrored, so its gradient is mirrored too -
        // otherwise it fades to dark exactly where its portrait sits.
        $("beamTop").style.background = a.gradient;
        $("beamBottom").style.background = b.gradientMirrored;
        $("vsImgA").src = a.portrait;
        $("vsImgB").src = b.portrait;
        for (const [beam, name, sub, p] of [
          [$("beamTop"), $("vsNameA"), $("vsSubA"), a],
          [$("beamBottom"), $("vsNameB"), $("vsSubB"), b],
        ]) {
          // `word` (the daily overlay) replaces the name with the daily name
          // (Bot or Human).
          beam.classList.toggle("word", !!p.word);
          beam.style.boxShadow = p.word
            ? "inset 0 14px 0 " + p.hex + ", inset 0 -14px 0 " + p.hex
            : "";
          name.textContent = p.word ?? p.name;
          name.style.color = p.word ? p.hex : "";
          fitName(name);
          sub.textContent = p.sub;
          show(sub, !p.word);
        }
      };

      /**
       * Paint one frame. Called once per screenshot by the renderer.
       *
       * `s.segment` picks which of the three layers is visible; `s.t` is a
       * 0..1 progress used only by the animated segments. Everything else is
       * data lifted from the game record or from a screenshot of the product.
       */
      window.__stage = (s) => {
        show($("vs"), s.segment === "vs");
        show($("play"), s.segment === "play");
        show($("end"), s.segment === "end");
        // No watermark in the daily look (audit item 8).
        show($("brand"), s.segment === "play" && s.look !== "wallz");
        /*
          The goal line holds the head row through the opening, while the
          game has not started; from the first move on, the race counter
          has it.
        */
        // The renderer shows the rules line through the opening walks.
        const goalNow = s.goal ?? null;
        $("root").classList.toggle("wallz", s.look === "wallz");
        $("vs").style.transform = "";

        if (s.segment === "vs") paintVs(s.a, s.b, s.t, 0);

        if (s.segment === "play") {
          $("boardImg").src = s.board;
          $("caption").textContent = s.caption ?? "";
          /*
            Camera punch-in: a scale about the point of the move. The origin is
            inside the board and the scale is never below 1, so the magnified
            board always covers its whole square and no edge shows.
          */
          const z = s.zoom;
          $("boardCam").style.transformOrigin = z
            ? z.x * 100 + "% " + z.y * 100 + "%"
            : "50% 50%";
          $("boardCam").style.transform = z ? "scale(" + z.scale + ")" : "none";
          paintBeat(s.beat);
          paintCapture(s.capture);
          paintMidStamp(s.midStamp);
          paintEnding(s.ending);
          paintCellFx(s.cellFx);
          paintResignFlags(
            s.overlay?.flags
              ? { ...s.overlay.flags, t: s.overlay.t, alpha: s.overlay.alpha }
              : null,
          );
          paintEval(s.evalStrip);
          paintErase(s.erase);
          paintFlashback(s.flashback);
          paintTrap(s.trap);
          paintPath(s.path);
          paintNames(s.names);
          paintOverlay(s.overlay);
          paintHud(s.race, goalNow, s.credit, s.fastForward);
          paintFreeze(s.freeze);
          // The loop tail: a white flash fading into the first frame.
          if (s.rewind) {
            show($("flash"), true);
            $("flash").style.opacity = 0.85 * s.rewind;
          }
          show($("fxFlash"), !!s.flash);
          $("fxFlash").style.opacity = s.flash ?? 0;
          $("pAvT").src = s.top.portrait;
          $("pAvB").src = s.bottom.portrait;
          $("pNameT").textContent = s.top.name;
          $("pNameB").textContent = s.bottom.name;
          for (const [el, p] of [
            [$("pTagT"), s.top],
            [$("pTagB"), s.bottom],
          ]) {
            el.textContent = p.sub;
            el.style.color = p.hex;
            el.style.background = p.soft;
          }
          /*
            Screen shake: a decaying wobble.

            TRANSLATION AND ROTATION ONLY - NEVER SCALE. An earlier version
            scaled to 1.045 during the shake and reset to `none` after it, so
            the board settled 4.5% smaller than it started and the cut was
            visible as a jump. Scale is not a shake, it is a zoom, and a zoom
            that only exists during the effect cannot return to where it began.
            The composition is inset from the frame, so a translation never
            exposes an edge and no cover-up scale is needed.

            It moves #play, not #root, so the background stays put and only the
            board and plates shake against it.
          */
          const k = s.shake ?? 0;
          if (k > 0) {
            const amp = 16 * k;
            const dx = Math.sin(s.shakePhase * 7.3) * amp;
            const dy = Math.cos(s.shakePhase * 5.1) * amp * 0.7;
            const rot = Math.sin(s.shakePhase * 6.1) * 0.7 * k;
            $("play").style.transform =
              "translate(" + dx + "px," + dy + "px) rotate(" + rot + "deg)";
          } else {
            $("play").style.transform = "none";
          }
        } else {
          $("play").style.transform = "none";
        }

        if (s.segment === "end") {
          $("endAv").src = s.winner.portrait;
          $("endName").textContent = s.winner.name;
          $("endName").style.color = s.winner.hex;
          $("endHow").textContent = s.how;
          $("endKicker").textContent = s.kicker;
        }
        return true;
      };
    </script>
  </body>
</html>
