# The actions in .github/workflows are pinned to commit SHAs, so nothing moves
# them forward on its own. Dependabot opens one grouped pull request a week
# with the new SHAs and their release tags.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
