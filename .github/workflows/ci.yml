name: CI

# The suite had seven files failing unnoticed for over a week because nothing
# ran it: .husky/pre-push checks formatting, lint and the build, but not tests,
# so a broken test cost nothing visible. This is the gate that makes it cost
# something.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # tests/integration/bot-5-minimax-engine.test.ts compiles
      # minimax_bgs_engine, and minimax-engine/CMakeLists.txt requires the
      # system nlohmann_json package. cmake and g++ already ship on the runner.
      - name: Install the engine's C++ dependency
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cheap checks first so an obvious failure does not wait on the suite.
      - name: Check formatting
        run: bun run format:check

      # Not `bun run lint`: that one passes --fix, which would repair the
      # problem and report success instead of failing the build.
      - name: Lint
        run: bun x eslint .

      - name: Build frontend
        run: bun run build

      # Every integration file starts its own Postgres through Testcontainers,
      # which needs the Docker daemon that ubuntu-latest already provides.
      - name: Test
        run: bun run test
