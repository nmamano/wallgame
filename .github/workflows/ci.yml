name: CI

# The suite had seven files failing unnoticed for over a week because nothing
# ran it: .husky/pre-push checks formatting, lint and the build, but not tests,
# so a broken test cost nothing visible. This is the gate that makes it cost
# something.
#
# Push runs are main-only on purpose. transport/* branches carry C++ work in
# progress from the desktop - including commits that are known-bad BY DESIGN
# (the known-bad phase of the transport process) - so CI there can only fail
# or be cancelled, and each one emailed Nil. Measured over the 100 runs before
# 2026-08-16: main was 55 runs with 0 cancelled, while transport/* branches
# produced all 14 cancelled runs and 2 intended failures. A branch that wants
# CI opens a pull request.
on:
  push:
    branches: [main]
  pull_request:

# Read only: no job writes to the repo, and CI uses no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each action is pinned to a full commit SHA, with its release tag as a
# comment. A tag can be moved to other code by whoever takes over the action's
# repo (tj-actions/changed-files, 2025); a SHA cannot. Dependabot
# (.github/dependabot.yml) proposes the SHA bumps each week.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # The scripts/game-video tests run their scripts with `node`. Pinned to
      # the floor those scripts need (import.meta.main, Node 22.18), so CI
      # proves the floor and not whatever Node the runner image ships. CI was
      # green while Node 18.19 (the desktop's) failed 10 of those tests
      # (2026-11-04). The floor and its reason: scripts/game-video/README.md.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0

      # tests/integration/bot-5-minimax-engine.test.ts compiles
      # minimax_bgs_engine, and minimax-engine/CMakeLists.txt requires the
      # system nlohmann_json package. cmake and g++ already ship on the runner.
      #
      # ffmpeg is for scripts/game-video/app/server.test.ts. Those tests stub
      # the RENDERER but not ffmpeg, because the app resolves a real one from
      # PATH on purpose - it refuses the scratch copy under tmp/, which gets
      # cleaned. Without it every render settles as "error" and 8 assertions
      # fail. The runner stopped shipping ffmpeg, so install it here.
      - name: Install the engine's C++ dependency and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # frontend/ has its OWN package.json and lockfile, and the root is not a
      # workspace, so a root install leaves it empty. Skipping this does not
      # merely fail the build step: eslint's typed rules resolve against
      # frontend/tsconfig.*.json, and with the types missing every expression
      # becomes `error`-typed, which reports ~5,500 bogus "unsafe" errors.
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # Known high and critical advisories in each lockfile. REPORT ONLY for
      # now (board task 34ef46cc): it prints the advisories and their count and
      # never fails the build, because the lockfiles still carry dev-only ones
      # that a later lock refresh removes. bun audit reads the lockfile, so the
      # bot client needs no install. GitHub's dependency graph cannot read
      # bun.lock, so this step is what sees these advisories.
      - name: Audit dependencies (report only)
        run: |
          for dir in . frontend official-custom-bot-client; do
            echo "::group::bun audit --audit-level=high ($dir)"
            (cd "$dir" && bun audit --audit-level=high) || true
            echo "::endgroup::"
          done

      # Cheap checks first so an obvious failure does not wait on the suite.
      - name: Check formatting
        run: bun run format:check

      # Not `bun run lint`: that one passes --fix, which would repair the
      # problem and report success instead of failing the build. `lint:check`
      # is the same eslint run without --fix, and it carries the raised heap
      # limit that type-aware linting of seven TS projects needs. The script
      # runs `lint:check`, keeps its exit code, and records its peak RSS for
      # the growth report below.
      - name: Lint
        run: bun scripts/ci-growth-report.ts lint

      # Six projects in series, as of 2026-08-09: server+shared, tests,
      # scripts, scripts/browser-harness, the frontend bun:test files, and
      # official-custom-bot-client. Nothing ran tsc over server/shared/tests
      # until that date: the root tsconfig.json has no `include`, so
      # `tsc -p tsconfig.json` globs the CMake-generated .ts under
      # minimax-engine/build_release and drowns in syntax errors, which is why a
      # real breakage in tests/ once reached main. The frontend's own `tsc -b`
      # in the build step covers the app and frontend/scripts, but it excludes
      # *.test.ts, so those needed naming here too. See
      # ops-private/wallgame-testing.md for why scripts and the harnesses are
      # separate projects (DOM is contagious).
      - name: Typecheck
        run: bun run typecheck

      - name: Build frontend
        run: bun run build

      # REPORT ONLY (board task 2aacada6): lint peak RSS against its heap cap,
      # first-load JS, and source files over 3,000 lines, with a warning at 80%
      # of each limit. It never fails the build. Crew doc sizes are not here:
      # those docs are in a local repo that CI never sees, and the improve
      # loop checks them.
      - name: Report the numbers that grow (report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bun scripts/ci-growth-report.ts report

      # The runner starts ONE Postgres through Testcontainers (each test file
      # clones a migrated template database inside it), which needs the Docker
      # daemon that ubuntu-latest already provides.
      #
      # The reaper (Ryuk) is Testcontainers' cleanup container, and failing to
      # start it aborts the run - which happened on this runner on 2026-08-05
      # ("Failed to connect to Reaper", run 31037300193) and could only ever
      # be infrastructure noise: this VM is destroyed minutes later, so there
      # is nothing for a reaper to clean up. Locally it stays on, because a
      # crashed run there really would leak a container.
      - name: Test
        run: bun run test
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
