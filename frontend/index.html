<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Board game about building walls and outsmarting your opponents. Play with friends, face the AI, or solve puzzles."
    />
    <!-- The server rewrites this href per route before serving the page, so a
         query string or a duplicate path does not read as a separate page.
         It must stay a single tag with an href attribute: server/routes/html-shell.ts
         refuses to start if it finds zero of these or more than one. -->
    <link rel="canonical" href="https://wallgame.io/" />

    <!-- Matches the background the app actually paints, oklch(0.14 0.04 265),
         so the browser chrome and the launch splash do not step out of it. -->
    <meta name="theme-color" content="#030819" />

    <!-- Installed-app behaviour. iOS ignores the manifest's display mode and
         reads these instead, so a home-screen launch opens without Safari's
         chrome rather than in a browser tab. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wall Game" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Open Graph / Facebook / WhatsApp / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wallgame.io/" />
    <meta property="og:title" content="wallgame.io – Strategic Board Game" />
    <meta
      property="og:description"
      content="Board game about building walls and outsmarting your opponents. Play with friends, face the AI, or solve puzzles."
    />
    <meta property="og:image" content="https://wallgame.io/og-image.png" />
    <meta property="og:site_name" content="Wall Game" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://wallgame.io/" />
    <meta name="twitter:title" content="wallgame.io – Strategic Board Game" />
    <meta
      name="twitter:description"
      content="Board game about building walls and outsmarting your opponents. Play with friends, face the AI, or solve puzzles."
    />
    <meta name="twitter:image" content="https://wallgame.io/og-image.png" />

    <title>Wall Game</title>
    <!-- Cormorant and Geist Mono are self-hosted; see the @font-face imports at
         the top of src/index.css. -->
    <style>
      :root {
        --font-serif: "Cormorant", serif;
        --font-mono: "Geist Mono", monospace;
      }
    </style>

    <!-- Google Analytics (GA4). Only loads on the production host, so dev
         servers, previews, and localhost don't pollute the real numbers.

         It is also skipped entirely in a portal frame, which must contact no
         third party at all. That decision has to be made HERE, in plain JS,
         because this script runs before any module: by the time
         lib/embedded-mode.ts could answer, the tag would already be appended.
         So the query param, the sessionStorage key and the guarded reads below
         mirror that file. tests/embedded-analytics.test.ts executes this very
         script against production-shaped input and fails if the two drift. -->
    <script>
      const embedded = (function () {
        try {
          if (new URLSearchParams(location.search).get("embedded") === "1") {
            return true;
          }
        } catch (e) {
          /* a malformed query string is not a reason to fail the page */
        }
        try {
          // The latch, for a reload that no longer carries the param. Reading
          // sessionStorage can itself throw in some privacy modes.
          return sessionStorage.getItem("wall-game-embedded") === "1";
        } catch (e) {
          return false;
        }
      })();

      if (
        !embedded &&
        (location.hostname === "wallgame.io" ||
          location.hostname === "www.wallgame.io")
      ) {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        gtag("js", new Date());
        gtag("config", "G-WJTLKK8C80", {
          anonymize_ip: true,
          allow_google_signals: false,
          allow_ad_personalization_signals: false,
        });

        const tag = document.createElement("script");
        tag.async = true;
        tag.src = "https://www.googletagmanager.com/gtag/js?id=G-WJTLKK8C80";
        document.head.appendChild(tag);
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
